<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The layers of defense in Android</title>
  <desc id="d">Five layers from top to bottom. Apps have APK signing, declared permissions and a per-app sandbox. The framework has runtime permissions, Keystore2, Gatekeeper, biometrics and the Network Security Config. The kernel has SELinux, seccomp-BPF, namespaces, dm-verity and file-based encryption. Boot has Android Verified Boot and rollback protection. Hardware has the boot ROM and fuses, the TEE on TrustZone and StrongBox. Each layer works on its own, so an attacker has to defeat all of them.</desc>
