<text x="146" y="141" font-size="13.6" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">llm_zero = ChatGoogleGenerativeAI(..., temperature=0, max_output_tokens=64)</text>
