<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Binder compared with classic Linux IPC</title>
  <desc id="d">A comparison of four mechanisms. A pipe copies the data twice, does not know who sent it and has no object references, death notices or thread pool. A Unix socket copies twice and knows the sender only per connection. Shared memory copies nothing but gives no sender, no references, no death notices and no thread pool. Binder copies the data once, knows the sender of every call from the kernel, has object references and death notices, and has a thread pool that the kernel manages.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="20" y="34" font-size="12.6" fill="#1c2230" text-anchor="start" font-weight="700">What each mechanism gives the two processes</text>
<text x="239" y="62" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="700">Copies of the data</text>
<text x="377" y="62" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="700">Who sent it</text>
<text x="515" y="62" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="700">Object references</text>
<text x="653" y="62" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="700">Death notices</text>
<text x="791" y="62" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="700">Thread pool</text>
<rect x="20" y="76" width="840" height="42" rx="9" fill="#fff" stroke="#d9d4c7" stroke-width="1.1"/>
<text x="36" y="102" font-size="12.6" fill="#1c2230" text-anchor="start" font-weight="700">Pipe</text>
<text x="239" y="102" font-size="11.6" fill="#1c2230" text-anchor="middle">2</text>
<text x="377" y="102" font-size="11.6" fill="#1c2230" text-anchor="middle">Not known</text>
<text x="515" y="102" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="653" y="102" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="791" y="102" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<rect x="20" y="126" width="840" height="42" rx="9" fill="#fff" stroke="#d9d4c7" stroke-width="1.1"/>
<text x="36" y="152" font-size="12.6" fill="#1c2230" text-anchor="start" font-weight="700">Unix socket</text>
<text x="239" y="152" font-size="11.6" fill="#1c2230" text-anchor="middle">2</text>
<text x="377" y="152" font-size="11.6" fill="#1c2230" text-anchor="middle">Per connection</text>
<text x="515" y="152" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="653" y="152" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="791" y="152" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<rect x="20" y="176" width="840" height="42" rx="9" fill="#fff" stroke="#d9d4c7" stroke-width="1.1"/>
<text x="36" y="202" font-size="12.6" fill="#1c2230" text-anchor="start" font-weight="700">Shared memory</text>
<text x="239" y="202" font-size="11.6" fill="#1c2230" text-anchor="middle">0</text>
<text x="377" y="202" font-size="11.6" fill="#1c2230" text-anchor="middle">Not known</text>
<text x="515" y="202" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="653" y="202" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<text x="791" y="202" font-size="11.6" fill="#1c2230" text-anchor="middle">No</text>
<rect x="20" y="226" width="840" height="42" rx="9" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="36" y="252" font-size="12.6" fill="#0b6650" text-anchor="start" font-weight="700">Binder</text>
<text x="239" y="252" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">1</text>
<text x="377" y="252" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Per call, from the kernel</text>
<text x="515" y="252" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Yes</text>
<text x="653" y="252" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Yes</text>
<text x="791" y="252" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Yes, kernel-managed</text>
</svg>
