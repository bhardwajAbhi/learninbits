<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1416" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lane B, share or publish data</title>
  <desc id="d">First measure the risk with threat modeling. If the receiver does not need individual records, share insights only, with a differentially private query service for many queries or aggregates with DP noise for one release. If the records need not be real people, use synthetic data with DP. If you must link back to the person, use pseudonymization, which stays personal data. If the data is location data, use a crowd rule. Else generalize and suppress the quasi-identifiers until k-anonymity, then apply l-diversity, t-closeness and DP noise as needed, and measure again. When the risk is low, share the anonymized data.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="85" y="34" width="330" height="54" rx="27" fill="#0f8a6a"/>
<text x="250" y="55" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">Lane B</text>
<text x="250" y="71" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">share or publish</text>
<rect x="85" y="122" width="330" height="54" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="250" y="146" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">Measure the risk first with threat</text>
<text x="250" y="162" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">modeling (score, attacks, classes)</text>
<path d="M250 210 L415 256 L250 302 L85 256 Z" fill="#fff" stroke="#0f8a6a" stroke-width="2"/>
<text x="250" y="253" font-size="12.3" fill="#0b6650" text-anchor="middle" font-weight="700">Does the receiver need</text>
<text x="250" y="269" font-size="12.3" fill="#0b6650" text-anchor="middle" font-weight="700">individual records?</text>
<rect x="470" y="201" width="390" height="110" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<rect x="470" y="201" width="6" height="110" rx="3" fill="#b7791f"/>
<text x="488" y="225" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">Share insights only, with DP</text>
<text x="488" y="245" font-size="11.5" fill="#1c2230" text-anchor="start">For many queries over time, a DP query service</text>
<text x="488" y="261" font-size="11.5" fill="#1c2230" text-anchor="start">with a privacy budget (central DP).</text>
<text x="488" y="277" font-size="11.5" fill="#1c2230" text-anchor="start">For one release, aggregates with DP noise</text>
<text x="488" y="293" font-size="11.5" fill="#1c2230" text-anchor="start">(Laplace for counts).</text>
<rect x="786" y="211" width="62" height="20" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="817" y="224.78" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-weight="600">Part 5</text>
<path d="M415 256 H464" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#m6)"/>
<text x="442.5" y="249" font-size="11" fill="#8a5a12" text-anchor="middle" font-weight="800">No</text>
<path d="M250 345 L415 391 L250 437 L85 391 Z" fill="#fff" stroke="#0f8a6a" stroke-width="2"/>
<text x="250" y="388" font-size="12.3" fill="#0b6650" text-anchor="middle" font-weight="700">Must the records belong</text>
<text x="250" y="404" font-size="12.3" fill="#0b6650" text-anchor="middle" font-weight="700">to real people?</text>
<rect x="470" y="344" width="390" height="94" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<rect x="470" y="344" width="6" height="94" rx="3" fill="#7a4fc2"/>
<text x="488" y="368" font-size="13" fill="#58378f" text-anchor="start" font-weight="700">Synthetic data with DP</text>
<text x="488" y="388" font-size="11.5" fill="#1c2230" text-anchor="start">DP stops the generator from copying rare rows.</text>
<text x="488" y="404" font-size="11.5" fill="#1c2230" text-anchor="start">Check distributions, PCA and correlations.</text>
<text x="488" y="420" font-size="11.5" fill="#1c2230" text-anchor="start">Good for testing, training and research.</text>
<rect x="786" y="354" width="62" height="20" rx="10" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="817" y="367.78" font-size="10.5" fill="#58378f" text-anchor="middle" font-weight="600">Part 5</text>
<path d="M415 391 H464" fill="none" stroke="#7a4fc2" stroke-width="1.8" marker-end="url(#m5)"/>
<text x="442.5" y="384" font-size="11" fill="#58378f" text-anchor="middle" font-weight="800">No</text>
<path d="M250 472 L415 518 L250 564 L85 518 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="515" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Must you link a record back</text>
<text x="250" y="531" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">to the person later?</text>
<rect x="470" y="479" width="390" height="78" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<rect x="470" y="479" width="6" height="78" rx="3" fill="#c2552d"/>
<text x="488" y="503" font-size="13" fill="#963f1f" text-anchor="start" font-weight="700">Pseudonymization or tokenization</text>
<text x="488" y="523" font-size="11.5" fill="#1c2230" text-anchor="start">Still personal data. Keep consent, Rule 6</text>
<text x="488" y="539" font-size="11.5" fill="#1c2230" text-anchor="start">safeguards and a processor contract.</text>
<rect x="786" y="489" width="62" height="20" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="817" y="502.78" font-size="10.5" fill="#963f1f" text-anchor="middle" font-weight="600">Part 4</text>
<path d="M415 518 H464" fill="none" stroke="#c2552d" stroke-width="1.8" marker-end="url(#m7)"/>
<text x="442.5" y="511" font-size="11" fill="#963f1f" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 598 L415 644 L250 690 L85 644 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="649" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Is it location data?</text>
<rect x="470" y="597" width="390" height="94" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<rect x="470" y="597" width="6" height="94" rx="3" fill="#b7791f"/>
<text x="488" y="621" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">Use a crowd rule, not rounding</text>
<text x="488" y="641" font-size="11.5" fill="#1c2230" text-anchor="start">Show a point only when at least 10 cases</text>
<text x="488" y="657" font-size="11.5" fill="#1c2230" text-anchor="start">are within 1 km. Rounding can expose</text>
<text x="488" y="673" font-size="11.5" fill="#1c2230" text-anchor="start">a person who lives alone.</text>
<rect x="786" y="607" width="62" height="20" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="817" y="620.78" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-weight="600">Part 3</text>
<path d="M415 644 H464" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#m6)"/>
<text x="442.5" y="637" font-size="11" fill="#8a5a12" text-anchor="middle" font-weight="800">Yes</text>
<rect x="85" y="725" width="330" height="54" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="250" y="749" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="600">Generalize and suppress the quasi-</text>
<text x="250" y="765" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="600">identifiers until k-anonymity (k = 5)</text>
<path d="M250 813 L415 859 L250 905 L85 859 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="856" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Do all rows in a group share</text>
<text x="250" y="872" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">one sensitive value?</text>
<rect x="470" y="820" width="390" height="78" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<rect x="470" y="820" width="6" height="78" rx="3" fill="#2f62c8"/>
<text x="488" y="844" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Apply l-diversity</text>
<text x="488" y="864" font-size="11.5" fill="#1c2230" text-anchor="start">At least l different sensitive values</text>
<text x="488" y="880" font-size="11.5" fill="#1c2230" text-anchor="start">in each group. Stops homogeneity.</text>
<rect x="786" y="830" width="62" height="20" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="817" y="843.78" font-size="10.5" fill="#1f4a9e" text-anchor="middle" font-weight="600">Part 3</text>
<path d="M415 859 H464" fill="none" stroke="#2f62c8" stroke-width="1.8" marker-end="url(#m3)"/>
<text x="442.5" y="852" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 939 L415 985 L250 1031 L85 985 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="982" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Do groups look different from</text>
<text x="250" y="998" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">the whole table?</text>
<rect x="470" y="946" width="390" height="78" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<rect x="470" y="946" width="6" height="78" rx="3" fill="#2f62c8"/>
<text x="488" y="970" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Apply t-closeness</text>
<text x="488" y="990" font-size="11.5" fill="#1c2230" text-anchor="start">Keep each group near the overall</text>
<text x="488" y="1006" font-size="11.5" fill="#1c2230" text-anchor="start">distribution (t from 0.35 to 0.5).</text>
<rect x="786" y="956" width="62" height="20" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="817" y="969.78" font-size="10.5" fill="#1f4a9e" text-anchor="middle" font-weight="600">Part 3</text>
<path d="M415 985 H464" fill="none" stroke="#2f62c8" stroke-width="1.8" marker-end="url(#m3)"/>
<text x="442.5" y="978" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 1065 L415 1111 L250 1157 L85 1111 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="1108" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Do outliers remain in the</text>
<text x="250" y="1124" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">statistical columns?</text>
<rect x="470" y="1072" width="390" height="78" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<rect x="470" y="1072" width="6" height="78" rx="3" fill="#b7791f"/>
<text x="488" y="1096" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">Add DP noise to those columns</text>
<text x="488" y="1116" font-size="11.5" fill="#1c2230" text-anchor="start">Noise gives each person plausible</text>
<text x="488" y="1132" font-size="11.5" fill="#1c2230" text-anchor="start">deniability. Set epsilon with care.</text>
<rect x="786" y="1082" width="62" height="20" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="817" y="1095.78" font-size="10.5" fill="#8a5a12" text-anchor="middle" font-weight="600">Part 5</text>
<path d="M415 1111 H464" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#m6)"/>
<text x="442.5" y="1104" font-size="11" fill="#8a5a12" text-anchor="middle" font-weight="800">Yes</text>
<rect x="85" y="1191" width="330" height="54" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="250" y="1215" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">Measure again with</text>
<text x="250" y="1231" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">threat modeling</text>
<path d="M250 1279 L415 1325 L250 1371 L85 1325 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="250" y="1322" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Is the risk score</text>
<text x="250" y="1338" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">low enough now?</text>
<rect x="470" y="1278" width="390" height="94" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<rect x="470" y="1278" width="6" height="94" rx="3" fill="#0f8a6a"/>
<text x="488" y="1302" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">Share as anonymized data</text>
<text x="488" y="1322" font-size="11.5" fill="#1c2230" text-anchor="start">Unrelatable data can be outside the Act</text>
<text x="488" y="1338" font-size="11.5" fill="#1c2230" text-anchor="start">(Section 2(t)). For research, follow Rule 16</text>
<text x="488" y="1354" font-size="11.5" fill="#1c2230" text-anchor="start">and the Second Schedule.</text>
<rect x="786" y="1288" width="62" height="20" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="817" y="1301.78" font-size="10.5" fill="#0b6650" text-anchor="middle" font-weight="600">Part 4</text>
<path d="M415 1325 H464" fill="none" stroke="#0f8a6a" stroke-width="1.8" marker-end="url(#m4)"/>
<text x="442.5" y="1318" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 88 V118" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<path d="M250 176 V206" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<path d="M250 302 V341" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="318" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 437 V468" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="453" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">Yes</text>
<path d="M250 564 V594" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="580" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">No</text>
<path d="M250 690 V721" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="706" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">No</text>
<path d="M250 779 V809" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<path d="M250 905 V935" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="921" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">No</text>
<path d="M250 1031 V1061" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="1047" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">No</text>
<path d="M250 1157 V1187" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="268" y="1173" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">No</text>
<path d="M250 1245 V1275" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<path d="M85 1325 H36 V752 H79" fill="none" stroke="#c2552d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m7)"/>
<text x="42" y="1038.5" font-size="11" fill="#963f1f" text-anchor="start" font-weight="800">No</text>
</svg>
