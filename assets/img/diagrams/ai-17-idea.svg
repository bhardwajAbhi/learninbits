<path d="M522 226 L 576 226" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="440" y="312" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">Pair every DO NOT with a requirement, so that the model knows what to write instead.</text>
</svg>
