<text x="36" y="236" font-size="11.2" fill="#1c2230" text-anchor="start">· Add a field at the end of a parcelable</text>
<text x="36" y="254" font-size="11.2" fill="#1c2230" text-anchor="start">· Add a constant or an enum value</text>
