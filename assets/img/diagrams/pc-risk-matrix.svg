  <title id="t">The likelihood and severity matrix</title>
  <desc id="d">A five by five grid. Severity, how identifiable the data is, goes from category 1 to 5. Likelihood, how feasible re-identification is, goes from very low to very high. Green cells are low risk and red cells are high risk. A marker shows where the dataset sits.</desc>
