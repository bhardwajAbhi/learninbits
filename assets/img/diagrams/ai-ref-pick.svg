<rect x="566" y="578" width="294" height="44" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="584" y="605" font-size="12.8" fill="#0b6650" text-anchor="start" font-weight="700">Least-to-most</text>
<text x="844" y="605" font-size="11.4" fill="#0b6650" text-anchor="end" font-weight="600">Chapter 12</text>
