<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One problem, several runs and a vote</title>
  <desc id="d">One problem is asked several times, here say five runs. Each run reasons in its own way and gives its own answer, namely 2000, 2600, 2000, 900 and 2000. The answers go into a vote. 2000 gets 3 votes, 2600 gets 1 vote and 900 gets 1 vote. The winner is 2000, with 3 of 5 votes. Most wrong paths end in different wrong answers, so they split their votes.</desc>
