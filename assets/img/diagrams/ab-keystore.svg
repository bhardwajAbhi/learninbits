<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Encrypt data with a key from the Android Keystore</title>
  <desc id="d">Plain data such as a token goes into AES-256-GCM, which keeps it secret and adds a tamper check in one step. The stored file holds the IV, the ciphertext and the authentication tag. The key comes from the Android Keystore, which keeps it in secure hardware where the device has such hardware. The key works there but never leaves. On read, a changed file fails the tag check, and the app rejects the data.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="40" width="160" height="70" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="100" y="68" font-size="13" fill="#3f4a59" text-anchor="middle" font-weight="700">Plain data</text>
<text x="100" y="88" font-size="11" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace">token=8f2c...</text>
<rect x="240" y="24" width="240" height="102" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="360" y="50" font-size="14" fill="#0b6650" text-anchor="middle" font-weight="800">AES-256-GCM</text>
<text x="360" y="72" font-size="11.6" fill="#4a5263" text-anchor="middle">Secret and tamper check</text>
<text x="360" y="92" font-size="11.6" fill="#4a5263" text-anchor="middle">in one step</text>
<path d="M180 75 L 236 75" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="540" y="40" width="320" height="70" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="556" y="66" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">Stored file</text>
<text x="556" y="88" font-size="11.4" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">IV + ciphertext + auth tag</text>
<path d="M480 75 L 536 75" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="240" y="170" width="240" height="92" rx="12" fill="#1c2230"/>
<text x="360" y="196" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Android Keystore</text>
<text x="360" y="218" font-size="11.6" fill="#ffffffcc" text-anchor="middle">Key stays in secure hardware</text>
<text x="360" y="238" font-size="11.6" fill="#ffffffcc" text-anchor="middle">where the device has it</text>
<path d="M360 170 L 360 130" fill="none" stroke="#0f8a6a" stroke-width="1.8" marker-end="url(#m4)"/>
<text x="372" y="154" font-size="11" fill="#0b6650" text-anchor="start" font-weight="600">the key works here, but never leaves</text>
<rect x="540" y="170" width="320" height="92" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.3"/>
<text x="556" y="194" font-size="13" fill="#963f1f" text-anchor="start" font-weight="700">On read</text>
<text x="556" y="214" font-size="11.4" fill="#4a5263" text-anchor="start">A changed file fails the tag check.</text>
<text x="556" y="231" font-size="11.4" fill="#4a5263" text-anchor="start">Reject the data and do not use it.</text>
<path d="M700 110 L 700 166" fill="none" stroke="#c2552d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m7)"/>
</svg>
