<rect x="566" y="632" width="294" height="44" rx="10" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.4"/>
<text x="584" y="659" font-size="12.8" fill="#095a61" text-anchor="start" font-weight="700">Program of thought</text>
<text x="844" y="659" font-size="11.4" fill="#095a61" text-anchor="end" font-weight="600">Chapter 13</text>
<rect x="20" y="686" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="713" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">A short answer that you want to confirm with several tries</text>
