<rect x="720" y="182" width="110" height="40" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="775" y="206" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="700">SoC C modules</text>
<text x="470" y="262" font-size="11.6" fill="#0b6650" text-anchor="start">The same core runs on every device.</text>
<text x="470" y="282" font-size="11.6" fill="#0b6650" text-anchor="start">Google can ship a kernel fix directly.</text>
