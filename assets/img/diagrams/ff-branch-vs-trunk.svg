<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 506" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Branch model compared with the trunk-stable model</title>
  <desc id="d">Top, the branch model. Features A, B and C leave the main line, live apart and meet late in a release branch, which brings late merges, conflicts and untested mixes. Bottom, the trunk-stable model. Every change goes to one trunk and new code waits behind a flag. At the release cut, a release configuration sets each flag on or off.</desc>
