<text x="790" y="146" font-size="10.8" fill="#ffffffcc" text-anchor="middle">parses the tree</text>
<path d="M680 130 L 716 130" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="250" width="420" height="144" rx="12" fill="#1f2633"/>
<path d="M32 250 h396 a12 12 0 0 1 12 12 v22 h-420 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="36" y="273" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">A node in the tree</text>
<text x="36" y="306" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">virtio_mmio@a003c00 {</text>
<text x="36" y="324" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    compatible = &quot;virtio,mmio&quot;;</text>
<text x="36" y="342" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    reg = &lt;0x0 0xa003c00 0x0 0x200&gt;;</text>
<text x="36" y="360" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    interrupts = &lt;0 43 4&gt;;</text>
<text x="36" y="378" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">};</text>
<rect x="480" y="250" width="380" height="144" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="496" y="276" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">Binding a driver</text>
<text x="496" y="300" font-size="11.4" fill="#4a5263" text-anchor="start">The kernel registers a platform device</text>
<text x="496" y="318" font-size="11.4" fill="#4a5263" text-anchor="start">for the node, then looks for a driver</text>
<text x="496" y="336" font-size="11.4" fill="#4a5263" text-anchor="start">whose of_match_table lists the same</text>
<text x="496" y="354" font-size="11.4" fill="#4a5263" text-anchor="start">compatible string. Its probe() reads</text>
<text x="496" y="372" font-size="11.4" fill="#4a5263" text-anchor="start">reg and interrupts from the node.</text>
