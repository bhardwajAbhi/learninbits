<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Choosing the rules that apply to an app</title>
  <desc id="d">A decision flow for an app that processes personal data. If it is offered to people in India, the DPDP Act applies to digital personal data. Either way, if it offers goods or services to people in the EU or monitors them, the GDPR applies, even without an EU office. Either way, if it is distributed through Google Play, the Play policies apply, such as Data safety, deletion and consent. At the end, meet the strictest rule that applies to each feature, and design one flow for all users.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="320" y="14" width="240" height="34" rx="17" fill="#1c2230"/>
<text x="440" y="36" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Your app processes personal data</text>
<path d="M440 48 L 440 62" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M440 62 L560 100 L440 138 L320 100 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="440" y="96.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Offered to people</text>
<text x="440" y="113.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">in India?</text>
<rect x="640" y="72" width="220" height="58" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="652" y="95" font-size="12.4" fill="#8a5a12" text-anchor="start" font-weight="700">DPDP Act applies</text>
<text x="652" y="114" font-size="11" fill="#4a5263" text-anchor="start">For digital personal data</text>
<path d="M560 100 L 636 100" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="598" y="92" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="800">Yes</text>
<path d="M440 138 L 440 170" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="458" y="160" font-size="12" fill="#1c2230" text-anchor="start" font-weight="800">Either way</text>
<path d="M440 172 L560 210 L440 248 L320 210 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="440" y="206.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Offered to or monitoring</text>
<text x="440" y="223.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">people in the EU?</text>
<rect x="640" y="182" width="220" height="58" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="652" y="205" font-size="12.4" fill="#1f4a9e" text-anchor="start" font-weight="700">GDPR applies</text>
<text x="652" y="224" font-size="11" fill="#4a5263" text-anchor="start">Even without an EU office</text>
<path d="M560 210 L 636 210" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<text x="598" y="202" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="800">Yes</text>
<path d="M440 248 L 440 280" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="458" y="270" font-size="12" fill="#1c2230" text-anchor="start" font-weight="800">Either way</text>
<path d="M440 282 L560 320 L440 358 L320 320 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="440" y="316.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Distributed through</text>
<text x="440" y="333.5" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Google Play?</text>
<rect x="640" y="292" width="220" height="58" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="652" y="315" font-size="12.4" fill="#0b6650" text-anchor="start" font-weight="700">Play policies apply</text>
<text x="652" y="334" font-size="11" fill="#4a5263" text-anchor="start">Data safety, deletion, consent</text>
<path d="M560 320 L 636 320" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="598" y="312" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="800">Yes</text>
<path d="M440 358 L 440 390" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="250" y="394" width="380" height="58" rx="12" fill="#f2efe8"/>
<text x="440" y="418" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">Meet the strictest rule that applies to each</text>
<text x="440" y="438" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">feature, and design one flow for all users.</text>
</svg>
