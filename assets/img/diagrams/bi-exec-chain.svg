<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The three program images of process 1</title>
  <desc id="d">Three frames from left to right, all with process ID 1. The first stage runs /init from the ramdisk in the kernel domain. It mounts /dev, /proc and /sys, loads kernel modules, mounts /system and /vendor and frees the ramdisk. An execv starts /system/bin/init selinux_setup, still in the kernel domain. It reads and loads the policy, sets enforcing mode and runs restorecon on /system/bin/init. A second execv starts /system/bin/init second_stage in the init domain. It starts the property service, parses the rc files and runs the main loop forever. The environment carries data forward, for example the start time that becomes ro.boottime.init.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="40" width="250" height="236" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<rect x="20" y="40" width="250" height="36" rx="12" fill="#5d6b7e"/>
<rect x="20" y="60" width="250" height="16" rx="0" fill="#5d6b7e"/>
<text x="34" y="64" font-size="14" fill="#fff" text-anchor="start" font-weight="700">First stage</text>
<text x="256" y="64" font-size="12" fill="#ffffffdd" text-anchor="end" font-weight="700">PID 1</text>
<text x="34" y="98" font-size="10.8" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">/init from the ramdisk</text>
<rect x="34" y="110" width="121.6" height="24" rx="12" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="94.8" y="126.032" font-size="11.2" fill="#3f4a59" text-anchor="middle" font-weight="700">kernel domain</text>
<circle cx="40" cy="158" r="3" fill="#5d6b7e"/>
<text x="50" y="162" font-size="12" fill="#4a5263" text-anchor="start">Mounts /dev, /proc, /sys</text>
<circle cx="40" cy="184" r="3" fill="#5d6b7e"/>
<text x="50" y="188" font-size="12" fill="#4a5263" text-anchor="start">Loads kernel modules</text>
<circle cx="40" cy="210" r="3" fill="#5d6b7e"/>
<text x="50" y="214" font-size="12" fill="#4a5263" text-anchor="start">Mounts /system and /vendor</text>
<circle cx="40" cy="236" r="3" fill="#5d6b7e"/>
<text x="50" y="240" font-size="12" fill="#4a5263" text-anchor="start">Frees the ramdisk</text>
<path d="M274 158 L 311 158" fill="none" stroke="#c2552d" stroke-width="2.2" marker-end="url(#m7)"/>
<text x="292" y="146" font-size="11.5" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">execv</text>
<rect x="315" y="40" width="250" height="236" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<rect x="315" y="40" width="250" height="36" rx="12" fill="#b7791f"/>
<rect x="315" y="60" width="250" height="16" rx="0" fill="#b7791f"/>
<text x="329" y="64" font-size="14" fill="#fff" text-anchor="start" font-weight="700">SELinux setup</text>
<text x="551" y="64" font-size="12" fill="#ffffffdd" text-anchor="end" font-weight="700">PID 1</text>
<text x="329" y="98" font-size="10.8" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">/system/bin/init selinux_setup</text>
<rect x="329" y="110" width="121.6" height="24" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="389.8" y="126.032" font-size="11.2" fill="#8a5a12" text-anchor="middle" font-weight="700">kernel domain</text>
<circle cx="335" cy="158" r="3" fill="#b7791f"/>
<text x="345" y="162" font-size="12" fill="#4a5263" text-anchor="start">Reads and loads the policy</text>
<circle cx="335" cy="184" r="3" fill="#b7791f"/>
<text x="345" y="188" font-size="12" fill="#4a5263" text-anchor="start">Sets enforcing mode</text>
<circle cx="335" cy="210" r="3" fill="#b7791f"/>
<text x="345" y="214" font-size="12" fill="#4a5263" text-anchor="start">restorecon /system/bin/init</text>
<path d="M569 158 L 606 158" fill="none" stroke="#c2552d" stroke-width="2.2" marker-end="url(#m7)"/>
<text x="587" y="146" font-size="11.5" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">execv</text>
<rect x="610" y="40" width="250" height="236" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.7"/>
<rect x="610" y="40" width="250" height="36" rx="12" fill="#0f8a6a"/>
<rect x="610" y="60" width="250" height="16" rx="0" fill="#0f8a6a"/>
<text x="624" y="64" font-size="14" fill="#fff" text-anchor="start" font-weight="700">Second stage</text>
<text x="846" y="64" font-size="12" fill="#ffffffdd" text-anchor="end" font-weight="700">PID 1</text>
<text x="624" y="98" font-size="10.8" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">/system/bin/init second_stage</text>
<rect x="624" y="110" width="107.2" height="24" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="677.6" y="126.032" font-size="11.2" fill="#0b6650" text-anchor="middle" font-weight="700">init domain</text>
<circle cx="630" cy="158" r="3" fill="#0f8a6a"/>
<text x="640" y="162" font-size="12" fill="#4a5263" text-anchor="start">Starts the property service</text>
<circle cx="630" cy="184" r="3" fill="#0f8a6a"/>
<text x="640" y="188" font-size="12" fill="#4a5263" text-anchor="start">Parses the rc files</text>
<circle cx="630" cy="210" r="3" fill="#0f8a6a"/>
<text x="640" y="214" font-size="12" fill="#4a5263" text-anchor="start">Runs the main loop forever</text>
<rect x="20" y="300" width="840" height="62" rx="12" fill="#f2efe8"/>
<text x="36" y="324" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">The process ID stays 1. Each execv replaces the program image, and the environment carries data forward.</text>
<text x="36" y="346" font-size="12" fill="#4a5263" text-anchor="start">Example, the start time of the first stage becomes ro.boottime.init in the second stage.</text>
</svg>
