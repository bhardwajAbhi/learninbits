<text x="357.333" y="370" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">may the caller find &quot;foo&quot;?</text>
<path d="M552.667 434 L 329.333 434" fill="none" stroke="#c2552d" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m7)"/>
<circle cx="341.333" cy="421" r="10" fill="#c2552d"/>
<text x="341.333" y="424.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text>
<text x="357.333" y="426" font-size="12" fill="#963f1f" text-anchor="start" font-weight="700">allowed</text>
<path d="M327.333 490 L 784 490" fill="none" stroke="#7a4fc2" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m5)"/>
<circle cx="341.333" cy="477" r="10" fill="#7a4fc2"/>
<text x="341.333" y="480.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text>
<text x="357.333" y="482" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">reply with the binder</text>
<text x="357.333" y="506" font-size="11.3" fill="#4a5263" text-anchor="start">the driver turns it into a new handle</text>
