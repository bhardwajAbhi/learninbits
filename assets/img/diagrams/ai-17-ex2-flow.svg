<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 756" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of Example 2 flows</title>
  <desc id="d">Setup, llm = ChatOpenRouter(model=&quot;meta-llama/llama-3.1-8b-instruct&quot;, ...), temperature=0.3, so that the wording varies a little. Input, topic = &quot;...&quot;, Certificate pinning in mobile apps, for a product manager. Plain, unconstrained_prompt, Explain {topic} to .... Call, (unconstrained_prompt | llm | parser).invoke(...), The answer without limits. Count, len(result.split()), Prints the answer and its word count. Limits, constrained_prompt, The same request, plus REQUIREMENTS and DO NOT. Call, (constrained_prompt | llm | parser).invoke(...), The answer with limits. Count, len(result.split()), Prints the answer and its word count, to compare with the limit of 80 words.</desc>
