<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Each pair of debug lines belongs to one step of the chain</title>
  <desc id="d">Left, the terminal output of the debug mode, shortened to one start line and one end line for each step. Right, the step that printed each pair. The first pair belongs to the whole chain, a RunnableSequence, which receives the behavior and returns the report. Then come the steps of chain 1. The prompt fills behavior into the template, the model ChatOllama maps the behavior to techniques and the parser StrOutputParser keeps only the text of the answer. Then come the steps of chain 2. The prompt fills techniques into the template, and the model writes the report. Green lines start a step. Cyan lines end it and carry the time, such as 1 millisecond for a prompt and about 10 to 20 seconds for the model.</desc>
