<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">pstore keeps the last kernel log across a crash</title>
  <desc id="d">Before the panic, the kernel log goes to the ramoops writer, a pstore backend, which stores it in reserved RAM that a reboot does not clear. After the reboot, the files appear under /sys/fs/pstore/. dmesg-ramoops-0 holds the last kernel log, console-ramoops-0 the last console output and pmsg-ramoops-0 the last user-space messages.</desc>
