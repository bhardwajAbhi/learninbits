<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Maximum penalties under the DPDP Act and the GDPR</title>
  <desc id="d">Under the Schedule of the DPDP Act, maximum penalties per instance are 250 crore rupees for a lack of reasonable security safeguards, 200 crore for no breach notice to the Board or the people, 200 crore for a breach of duties for children, 150 crore for a breach of the extra duties of a Significant Data Fiduciary, 10,000 rupees for a breach of duties by a Data Principal and 50 crore for any other breach. Under GDPR Article 83, core breaches such as of principles, rights or transfers can cost 20 million euros or 4% of worldwide turnover, and other breaches such as of security or records 10 million euros or 2%, whichever is higher.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="20" y="30" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">DPDP Act, Schedule, maximum per instance in crore rupees</text>
<text x="20" y="65" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">No reasonable security safeguards</text>
<rect x="330" y="50" width="425" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="761" y="66" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹250 crore</text>
<text x="20" y="101" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">No breach notice to the Board or people</text>
<rect x="330" y="86" width="340" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="676" y="102" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹200 crore</text>
<text x="20" y="137" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Breach of duties for children</text>
<rect x="330" y="122" width="340" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="676" y="138" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹200 crore</text>
<text x="20" y="173" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Breach of extra SDF duties</text>
<rect x="330" y="158" width="255" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="591" y="174" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹150 crore</text>
<text x="20" y="209" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Breach of duties by a Data Principal</text>
<rect x="330" y="194" width="3" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="339" y="210" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹10,000</text>
<text x="20" y="245" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Any other breach of the Act or Rules</text>
<rect x="330" y="230" width="85" height="22" rx="5" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="421" y="246" font-size="11.4" fill="#8a5a12" text-anchor="start" font-weight="700">₹50 crore</text>
<text x="20" y="296" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">GDPR, Article 83, the higher of the two amounts</text>
<text x="20" y="329" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Core breaches, for example of principles, rights or transfers</text>
<rect x="470" y="313" width="360" height="24" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="650" y="329.032" font-size="11.2" fill="#1f4a9e" text-anchor="middle" font-weight="700">€20 million or 4% of worldwide turnover</text>
<text x="20" y="365" font-size="11.6" fill="#1c2230" text-anchor="start" font-weight="600">Other breaches, for example of security or records</text>
<rect x="470" y="349" width="360" height="24" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="650" y="365.032" font-size="11.2" fill="#1f4a9e" text-anchor="middle" font-weight="700">€10 million or 2% of worldwide turnover</text>
</svg>
