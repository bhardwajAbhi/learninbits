<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The support windows of the GKI kernel branches</title>
  <desc id="d">A timeline from 2020 to 2030 with one bar for each branch. android12-5.10 and android13-5.10 run from December 2020 to July 2027. android13-5.15 and android14-5.15 run from October 2021 to July 2028. android14-6.1 runs from December 2022 to July 2029. android15-6.6 runs from October 2023 to July 2028. android16-6.12 runs from November 2024 to July 2029. android17-6.18 runs from November 2025 to July 2030 and had no quarterly release yet when Android 17 was cut.</desc>
