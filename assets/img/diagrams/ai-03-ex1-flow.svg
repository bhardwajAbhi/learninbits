<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the temperature program of Example 1 flows</title>
  <desc id="d">Input, prompt, &quot;Write a one sentense security awareness message about phishing emails.&quot;. Model, llm_zero = ChatGoogleGenerativeAI(..., temperature=0, max_output_tokens=64), for i in range(3) runs invoke(prompt) three times, Result, three identical sentences. Model, llm_balanced = ChatGoogleGenerativeAI(..., temperature=0.7, max_output_tokens=64), for i in range(3) runs invoke(prompt) three times, Result, a few words change. Model, llm_creative = ChatGoogleGenerativeAI(..., temperature=1.5, max_output_tokens=64), for i in range(3) runs invoke(prompt) three times, Result, more variety, still correct. Output, print(f&quot;Run {i+1} {response.text}&quot;), Nine sentences, three for each temperature.</desc>
