<rect x="20" y="34" width="400" height="170" rx="16" fill="#fbecec" fill-opacity="0.55"/>
<rect x="20" y="34" width="400" height="170" rx="16" fill="none" stroke="#c2552d" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="36" y="21" width="149.6" height="26" rx="13" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="110.8" y="38.5" font-size="12.5" fill="#963f1f" text-anchor="middle" font-weight="700">Before the panic</text>
<rect x="40" y="66" width="160" height="50" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.3"/>
<text x="120" y="96" font-size="12.4" fill="#3f4a59" text-anchor="middle" font-weight="700">Kernel log</text>
<rect x="240" y="66" width="160" height="50" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.3"/>
<text x="320" y="90" font-size="12.4" fill="#963f1f" text-anchor="middle" font-weight="700">ramoops writer</text>
<text x="320" y="106" font-size="10.8" fill="#4a5263" text-anchor="middle">pstore backend</text>
<path d="M200 91 L 236 91" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="140" y="136" width="160" height="50" rx="10" fill="#1c2230"/>
<text x="220" y="160" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">Reserved RAM</text>
<text x="220" y="176" font-size="10.6" fill="#ffffffcc" text-anchor="middle">not cleared at reboot</text>
<path d="M320 116 L 290 134" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="460" y="34" width="400" height="170" rx="16" fill="#e3f4ee" fill-opacity="0.55"/>
<rect x="460" y="34" width="400" height="170" rx="16" fill="none" stroke="#0f8a6a" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="476" y="21" width="149.6" height="26" rx="13" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="550.8" y="38.5" font-size="12.5" fill="#0b6650" text-anchor="middle" font-weight="700">After the reboot</text>
<rect x="480" y="66" width="360" height="120" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="496" y="90" font-size="12.4" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">/sys/fs/pstore/</text>
