<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The normal world, the secure world and the path between them</title>
  <desc id="d">On the left, the normal world with Android. The app runs at EL0 and calls the Keystore API. The KeyMint HAL and libtrusty run at EL0 and open /dev/trusty-ipc-dev0. The Linux kernel at EL1 holds the Trusty IPC driver, which writes the message to shared memory. On the right, the secure world with Trusty. Trusted apps such as the KeyMint TA, the Gatekeeper TA, the Storage TA and the Confirmation UI TA run at S-EL0 and are built into a signed image. The Trusty kernel, based on Little Kernel, runs at S-EL1. A shared ring buffer sits between the worlds. At the bottom, the secure monitor at EL3. The driver issues an SMC instruction, and the monitor dispatches to the Trusty kernel, which routes the message to the trusted app. The SMC instruction is the only door between the worlds, and the TZASC blocks normal-world access to secure memory.</desc>
