<text x="230" y="246" font-size="15.5" fill="#8a5a12" text-anchor="middle" font-weight="700">The specific problem</text>
<path d="M150 288 H310 L295 364 H165 Z" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="230" y="332" font-size="15.5" fill="#0b6650" text-anchor="middle" font-weight="700">Your contribution</text>
<text x="230" y="384" font-size="12.5" fill="#4a5263" text-anchor="middle" font-weight="700">Start broad, then narrow down</text>
<text x="670" y="24" font-size="15.5" fill="#1c2230" text-anchor="middle" font-weight="700">Find the gap in the literature</text>
<rect x="490" y="40" width="174" height="144" rx="10" fill="#fff" stroke="#d9d4c7" stroke-width="1.5"/>
<rect x="670" y="40" width="174" height="144" rx="10" fill="#fff" stroke="#d9d4c7" stroke-width="1.5"/>
