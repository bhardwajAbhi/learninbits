<text x="496" y="160" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">pmsg-ramoops-0</text>
<text x="824" y="160" font-size="11" fill="#4a5263" text-anchor="end">last user-space messages</text>
