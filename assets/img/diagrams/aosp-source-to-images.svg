<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From source code to a running Android</title>
  <desc id="d">Four stages. Get the code with repo and the manifest. Choose what to build with envsetup and lunch. Build with the m command. The result is a set of images that the emulator or a phone starts.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker>
  </defs>

  <!-- stage 1 -->
  <rect x="16" y="40" width="190" height="250" rx="14" fill="#f2efe8" stroke="#9aa0ab" stroke-width="1.5"/>
  <circle cx="111" cy="40" r="16" fill="#1c2230"/><text x="111" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="111" y="82" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2230">Get the code</text>
  <rect x="36" y="100" width="150" height="46" rx="8" fill="#ffffff" stroke="#cfc9bb"/>
  <text x="111" y="120" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c2230">Manifest</text>
  <text x="111" y="137" font-size="11" text-anchor="middle" fill="#4a5263">the list of all projects</text>
  <rect x="36" y="156" width="150" height="46" rx="8" fill="#ffffff" stroke="#cfc9bb"/>
  <text x="111" y="176" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c2230">repo</text>
  <text x="111" y="193" font-size="11" text-anchor="middle" fill="#4a5263">downloads each project</text>
  <g fill="#c2552d"><rect x="46" y="222" width="22" height="22" rx="4"/><rect x="72" y="222" width="22" height="22" rx="4" opacity=".8"/><rect x="98" y="222" width="22" height="22" rx="4" opacity=".6"/><rect x="124" y="222" width="22" height="22" rx="4" opacity=".45"/><rect x="150" y="222" width="22" height="22" rx="4" opacity=".3"/></g>
  <text x="111" y="268" font-size="11.5" text-anchor="middle" fill="#4a5263">more than 1,000 Git projects</text>

  <!-- stage 2 -->
  <rect x="236" y="40" width="190" height="250" rx="14" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
  <circle cx="331" cy="40" r="16" fill="#1c2230"/><text x="331" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="331" y="82" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2230">Choose the target</text>
  <rect x="256" y="100" width="150" height="34" rx="8" fill="#ffffff" stroke="#e0c58f"/>
  <text x="331" y="122" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="middle" fill="#1c2230">lunch</text>
  <rect x="256" y="146" width="150" height="34" rx="8" fill="#ffffff" stroke="#e0c58f"/>
  <text x="331" y="168" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">Product:</tspan> which device</text>
  <rect x="256" y="188" width="150" height="34" rx="8" fill="#ffffff" stroke="#e0c58f"/>
  <text x="331" y="210" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">Release:</tspan> which features</text>
  <rect x="256" y="230" width="150" height="34" rx="8" fill="#ffffff" stroke="#e0c58f"/>
  <text x="331" y="252" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">Variant:</tspan> user or debug</text>

  <!-- stage 3 -->
  <rect x="456" y="40" width="190" height="250" rx="14" fill="#e5ecfb" stroke="#2f62c8" stroke-width="1.5"/>
  <circle cx="551" cy="40" r="16" fill="#1c2230"/><text x="551" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="551" y="82" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2230">Build</text>
  <rect x="476" y="100" width="150" height="34" rx="8" fill="#ffffff" stroke="#b9cbf3"/>
  <text x="551" y="122" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="middle" fill="#1c2230">m</text>
  <text x="551" y="160" font-size="12" text-anchor="middle" fill="#1f448f">reads the recipes</text>
  <text x="551" y="178" font-size="12" text-anchor="middle" fill="#1f448f">(Android.bp files),</text>
  <text x="551" y="196" font-size="12" text-anchor="middle" fill="#1f448f">makes a build plan,</text>
  <text x="551" y="214" font-size="12" text-anchor="middle" fill="#1f448f">then compiles</text>
  <text x="551" y="232" font-size="12" text-anchor="middle" fill="#1f448f">in parallel</text>
  <text x="551" y="268" font-size="11.5" text-anchor="middle" fill="#4a5263">first build: some hours</text>

  <!-- stage 4 -->
  <rect x="676" y="40" width="190" height="250" rx="14" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
  <circle cx="771" cy="40" r="16" fill="#1c2230"/><text x="771" y="46" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">4</text>
  <text x="771" y="82" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2230">Run</text>
  <g font-size="11.5" font-family="JetBrains Mono, monospace" text-anchor="middle" fill="#0b5e48">
    <rect x="701" y="100" width="140" height="26" rx="6" fill="#ffffff" stroke="#9fd8c4"/><text x="771" y="118">boot.img</text>
    <rect x="701" y="132" width="140" height="26" rx="6" fill="#ffffff" stroke="#9fd8c4"/><text x="771" y="150">system.img</text>
    <rect x="701" y="164" width="140" height="26" rx="6" fill="#ffffff" stroke="#9fd8c4"/><text x="771" y="182">vendor.img</text>
    <rect x="701" y="196" width="140" height="26" rx="6" fill="#ffffff" stroke="#9fd8c4"/><text x="771" y="214">super.img</text>
  </g>
  <text x="771" y="252" font-size="12" text-anchor="middle" fill="#0b5e48">The emulator or a</text>
  <text x="771" y="270" font-size="12" text-anchor="middle" fill="#0b5e48">phone starts them</text>

  <!-- arrows -->
  <line x1="208" y1="165" x2="232" y2="165" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="428" y1="165" x2="452" y2="165" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="648" y1="165" x2="672" y2="165" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
</svg>
