<text x="66" y="407.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Output</text>
<rect x="126" y="380" width="680" height="65" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<rect x="126" y="380" width="6" height="65" rx="3" fill="#0f8a6a"/>
<text x="146" y="408" font-size="13.6" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">result[&quot;draft&quot;], result[&quot;critique&quot;], result[&quot;revised&quot;]</text>
<text x="146" y="430" font-size="12.2" fill="#4a5263" text-anchor="start">One invoke() gives back every part</text>
<text x="466" y="467" font-size="12.2" fill="#4a5263" text-anchor="middle" font-style="italic">Each step sees all the keys of the steps before it.</text>
