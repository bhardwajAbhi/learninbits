<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 692" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the persona calls of Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, llm, Gemini API. Step 1, Your code to Your code, messages_analyst = [...], SystemMessage with the analyst role, HumanMessage with the question. Step 2, Your code to llm, llm.invoke(messages_analyst), a list of two messages, not a string. Step 3, llm to Gemini API, Request with a system and a human message, temperature 0, no length limit. Step 4, Gemini API to llm, Analyst answer, 51 in, 621 out. Step 5, llm to Your code, AIMessage, the code prints .text, .response_metadata and .usage_metadata. Step 6, Your code to llm, llm.invoke(messages_ciso), the same question, the CISO role. Step 7, Gemini API to Your code, CISO answer, 56 in, 712 out. Step 8, Your code to llm, llm.invoke(messages_teacher), the same question, the teacher role in Hindi. Step 9, Gemini API to Your code, Teacher answer, 121 in, 484 out. Steps 1 to 5 repeat, Persona 1, analyst. Steps 6 to 9 repeat, Personas 2 and 3, the same steps.</desc>
