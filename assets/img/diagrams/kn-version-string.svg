<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The parts of a GKI kernel version string</title>
  <desc id="d">The string 6.18.16-android17-1-gb61cd7ae4209-ab15097451-4k from kernel_version.mk splits into six parts. 6.18.16 is LTS 6.18 at patch level 16. android17 is the ACK branch for Android 17. 1 is the first release of the branch. gb61cd7ae4209 is the git commit. ab15097451 is the Android build ID. 4k means 4 KB pages, and a 16 KB build has no suffix.</desc>
