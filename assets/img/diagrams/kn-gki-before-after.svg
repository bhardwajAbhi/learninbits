<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kernel fragmentation before GKI and the shared core with GKI</title>
  <desc id="d">Before GKI, the Android Common Kernel forked into a kernel for each SoC vendor, and each of those forked again for each device. Every device ran its own kernel binary, a security fix needed every vendor tree, and no two devices could be tested the same way. With GKI, one core kernel built by Google sits on top of a stable Kernel Module Interface. Each SoC vendor ships only modules. The same core runs on every device, Google can ship a kernel fix directly, and vendor code lives only in modules.</desc>
