  <title id="t">Sources of research ideas</title>
  <desc id="d">Curiosity leads to six sources of ideas, namely workplace problems, experimental anomalies, comparisons and benchmarks, performance improvements, gaps in the literature and new frameworks or datasets. They reveal a gap that nobody solved, which becomes a hypothesis to test.</desc>
