<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Binder as a post office</title>
  <desc id="d">An app process and a service process cannot see each other. The Binder driver in the kernel carries a parcel from the app to the service, adds the sender identity and carries the reply back.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f7d55"/></marker>
  </defs>

  <!-- user space label -->
  <text x="20" y="24" font-size="11" font-weight="700" letter-spacing="1.2" fill="#7b8292">USER SPACE (EACH APP IN ITS OWN LOCKED HOUSE)</text>

  <!-- App process -->
  <rect x="20" y="38" width="250" height="132" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="2"/>
  <text x="40" y="66" font-size="16" font-weight="700" fill="#0b5e48">Your app</text>
  <text x="40" y="86" font-size="12" fill="#4a5263">Process A, user ID u0_a142</text>
  <text x="40" y="118" font-size="13" fill="#1c2230">Wants to copy text</text>
  <text x="40" y="136" font-size="13" fill="#1c2230">to the clipboard</text>
  <rect x="196" y="112" width="52" height="40" rx="4" fill="#f6d48a" stroke="#b7791f" stroke-width="1.5"/>
  <path d="M196 124h52M222 112v12" stroke="#b7791f" stroke-width="1.5"/>
  <text x="222" y="146" font-size="10" text-anchor="middle" fill="#7a4f10">Parcel</text>

  <!-- Wall -->
  <line x1="380" y1="36" x2="380" y2="186" stroke="#c0453f" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="318" y="94" width="124" height="38" rx="6" fill="#fbecec"/>
  <text x="380" y="110" font-size="11.5" font-weight="700" text-anchor="middle" fill="#a3322d">Process wall</text>
  <text x="380" y="125" font-size="10.5" text-anchor="middle" fill="#a3322d">No direct access</text>

  <!-- Service process -->
  <rect x="490" y="38" width="250" height="132" rx="12" fill="#e5ecfb" stroke="#2f62c8" stroke-width="2"/>
  <text x="510" y="66" font-size="16" font-weight="700" fill="#1f448f">system_server</text>
  <text x="510" y="86" font-size="12" fill="#4a5263">Process B, user ID system</text>
  <text x="510" y="118" font-size="13" fill="#1c2230">ClipboardService does</text>
  <text x="510" y="136" font-size="13" fill="#1c2230">the real work</text>

  <!-- kernel line -->
  <line x1="20" y1="214" x2="740" y2="214" stroke="#cfc9bb" stroke-width="1.5"/>
  <text x="20" y="236" font-size="11" font-weight="700" letter-spacing="1.2" fill="#7b8292">KERNEL</text>

  <!-- Post office -->
  <rect x="150" y="250" width="460" height="120" rx="12" fill="#fbe8e0" stroke="#c2552d" stroke-width="2"/>
  <path d="M170 286l22-16 22 16v24h-44z" fill="#c2552d"/>
  <rect x="186" y="294" width="12" height="16" fill="#fbe8e0"/>
  <text x="230" y="282" font-size="16" font-weight="700" fill="#8e3618">Binder driver: the post office</text>
  <text x="230" y="304" font-size="13" fill="#1c2230">Carries the parcel to the right process.</text>
  <text x="230" y="324" font-size="13" fill="#1c2230">Stamps the true sender ID on it.</text>
  <text x="230" y="344" font-size="13" fill="#1c2230">The sender cannot change this stamp.</text>

  <!-- arrows -->
  <path d="M120 172 C120 230 140 290 148 300" fill="none" stroke="#1c2230" stroke-width="2.2" marker-end="url(#a1)"/>
  <circle cx="104" cy="214" r="13" fill="#1c2230"/><text x="104" y="219" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="40" y="200" font-size="12" fill="#1c2230">Send</text>

  <path d="M612 300 C630 280 640 230 640 174" fill="none" stroke="#1c2230" stroke-width="2.2" marker-end="url(#a1)"/>
  <circle cx="656" cy="214" r="13" fill="#1c2230"/><text x="656" y="219" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="676" y="200" font-size="12" fill="#1c2230">Deliver</text>

  <path d="M580 174 C570 210 560 236 525 250" fill="none" stroke="#2f7d55" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
  <path d="M235 250 C215 236 205 210 200 174" fill="none" stroke="#2f7d55" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
  <circle cx="320" cy="236" r="13" fill="#2f7d55"/><text x="320" y="241" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="342" y="241" font-size="12" fill="#1f5c3d">Reply comes back</text>
</svg>
