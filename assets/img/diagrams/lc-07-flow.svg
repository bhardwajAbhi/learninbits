<rect x="126" y="380" width="6" height="65" rx="3" fill="#2f62c8"/>
<text x="146" y="408" font-size="13.6" fill="#1f4a9e" text-anchor="start" font-weight="700">compliance_check_chain.invoke({&quot;logs&quot;: logs})</text>
<text x="146" y="430" font-size="12.2" fill="#4a5263" text-anchor="start">Runs after a click on Analyze</text>
