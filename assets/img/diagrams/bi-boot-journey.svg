<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The eight stages of an Android boot across four layers</title>
  <desc id="d">Four columns show the layers of the system. Time flows from top to bottom. In the firmware, the Boot ROM runs fixed code in the chip, and the bootloader verifies and loads the images. The Linux kernel starts the drivers and then runs /init. In native user space, the first stage of init mounts the partitions, and the second stage starts services and properties. In the Java framework, Zygote preloads and forks, system_server starts more than 100 services, and the home screen appears when sys.boot_completed is 1.</desc>
