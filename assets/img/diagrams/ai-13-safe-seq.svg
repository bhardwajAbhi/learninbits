<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one safe run</title>
  <desc id="d">A sequence diagram with the lanes Your code, check_code, subprocess.run, Child Python, Operating system. Step 1, Your code to check_code, check_code(code), ast.parse turns the text into a syntax tree, nothing runs. Step 2, check_code to check_code, ast.walk(tree), rules for imports, blocked names and _ attributes. Step 3, check_code to Your code, passes, or ValueError, a ValueError becomes Code rejected. Step 4, Your code to Operating system, tempfile.TemporaryDirectory(), an empty folder, deleted at the end of the with block. Step 5, Your code to subprocess.run, subprocess.run([sys.executable, &quot;-I&quot;, &quot;-c&quot;, code], ...), env={}, cwd=workdir, timeout=5, capture_output=True. Step 6, subprocess.run to Child Python, start python -I -c, a new process, no environment variables. Step 7, Child Python to Child Python, the model&#x27;s code runs, print(...), or answer = ... plus the footer. Step 8, Child Python to subprocess.run, stdout, stderr and the exit code, or TimeoutExpired after 5 seconds. Step 9, subprocess.run to Your code, CompletedProcess, returncode, stdout and stderr as text. Steps 1 to 9 repeat, Repeated for each code block.</desc>
