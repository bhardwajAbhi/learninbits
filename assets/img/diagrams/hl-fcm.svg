<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Levels of the framework compatibility matrix</title>
  <desc id="d">A timeline of framework compatibility matrix levels. Level 7 for Android 13, level 8 for Android 14, level 202404 for Android 15, level 202504 for Android 16 and level 202604 for Android 17. From Android 15, levels use the form year and month. A device declares its target level in the device manifest.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<line x1="40" y1="90" x2="840" y2="90" stroke="#d9d4c7" stroke-width="3"/>
<circle cx="80" cy="90" r="9" fill="#fff" stroke="#2f62c8" stroke-width="2.2"/>
<text x="80" y="62" font-size="13" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">7</text>
<text x="80" y="124" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Android 13</text>
<circle cx="260" cy="90" r="9" fill="#fff" stroke="#2f62c8" stroke-width="2.2"/>
<text x="260" y="62" font-size="13" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">8</text>
<text x="260" y="124" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Android 14</text>
<circle cx="440" cy="90" r="9" fill="#fff" stroke="#2f62c8" stroke-width="2.2"/>
<text x="440" y="62" font-size="13" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">202404</text>
<text x="440" y="124" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Android 15</text>
<circle cx="620" cy="90" r="9" fill="#fff" stroke="#2f62c8" stroke-width="2.2"/>
<text x="620" y="62" font-size="13" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">202504</text>
<text x="620" y="124" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Android 16</text>
<circle cx="800" cy="90" r="9" fill="#0b6650" stroke="#0f8a6a" stroke-width="2.2"/>
<text x="800" y="62" font-size="13" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">202604</text>
<text x="800" y="124" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Android 17</text>
<text x="440" y="162" font-size="11.4" fill="#4a5263" text-anchor="middle">From Android 15, levels use the form YYYYMM. A device declares its target level in the device manifest.</text>
</svg>
