<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Exported components and who can reach them</title>
  <desc id="d">Your app has three components. PaymentService and NotesProvider set exported to false, so an unknown app cannot reach them. SyncService is exported with a signature permission, so your other app signed with the same key can call it, while an unknown app without the permission is blocked. Android 12 and later require an explicit exported value for components with intent filters.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="330" y="30" width="250" height="250" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<text x="455" y="56" font-size="14" fill="#1f4a9e" text-anchor="middle" font-weight="700">Your app</text>
<rect x="350" y="74" width="210" height="54" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="364" y="96" font-size="12.4" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">PaymentService</text>
<text x="364" y="115" font-size="11.2" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="500">exported=false</text>
<rect x="350" y="140" width="210" height="54" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.3"/>
<text x="364" y="162" font-size="12.4" fill="#8a5a12" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">SyncService</text>
<text x="364" y="181" font-size="11.2" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="500">signature permission</text>
<rect x="350" y="206" width="210" height="54" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="364" y="228" font-size="12.4" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">NotesProvider</text>
<text x="364" y="247" font-size="11.2" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="500">exported=false</text>
<rect x="20" y="77" width="160" height="48" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.4"/>
<text x="100" y="98" font-size="12.2" fill="#963f1f" text-anchor="middle" font-weight="700">Unknown app</text>
<text x="100" y="115" font-size="10.6" fill="#4a5263" text-anchor="middle">Blocked, not exported</text>
<path d="M180 101 L 344 101" fill="none" stroke="#c2552d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m7)"/>
<text x="262" y="95" font-size="14" fill="#c2552d" text-anchor="middle" font-weight="800">x</text>
<rect x="700" y="143" width="160" height="48" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="780" y="164" font-size="12.2" fill="#0b6650" text-anchor="middle" font-weight="700">Your other app</text>
<text x="780" y="181" font-size="10.6" fill="#4a5263" text-anchor="middle">Allowed, same signing key</text>
