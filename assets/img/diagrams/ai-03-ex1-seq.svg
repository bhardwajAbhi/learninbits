<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 734" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the nine calls of Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, llm_zero, llm_balanced, llm_creative, Gemini API. Step 1, Your code to llm_zero, invoke(prompt), temperature 0. Step 2, llm_zero to Gemini API, Request, the most likely token each time. Step 3, Gemini API to Your code, response.text, three identical sentences. Step 4, Your code to llm_balanced, invoke(prompt), temperature 0.7. Step 5, llm_balanced to Gemini API, Request, likely tokens, with some chance. Step 6, Gemini API to Your code, response.text, a few words change. Step 7, Your code to llm_creative, invoke(prompt), temperature 1.5. Step 8, llm_creative to Gemini API, Request, unlikely tokens get a real chance. Step 9, Gemini API to Your code, response.text, more variety, still correct. Steps 1 to 3 repeat, 3 runs at 0. Steps 4 to 6 repeat, 3 runs at 0.7. Steps 7 to 9 repeat, 3 runs at 1.5.</desc>
