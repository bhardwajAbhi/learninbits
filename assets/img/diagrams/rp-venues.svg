<text x="56" y="46" font-size="12.5" fill="#4a5263" text-anchor="end" font-weight="600">Deep</text>
<text x="56" y="63.25" font-size="12.5" fill="#4a5263" text-anchor="end" font-weight="600">review</text>
<text x="56" y="388" font-size="12.5" fill="#4a5263" text-anchor="end" font-weight="600">Light</text>
<text x="56" y="405.25" font-size="12.5" fill="#4a5263" text-anchor="end" font-weight="600">review</text>
<rect x="150" y="70" width="190" height="96" rx="14" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.8"/>
<text x="168" y="102" font-size="15.5" fill="#1f4a9e" text-anchor="start" font-weight="700">Journals</text>
<text x="168" y="126" font-size="12.5" fill="#1c2230" text-anchor="start">Rigorous review,</text>
<text x="168" y="145" font-size="12.5" fill="#1c2230" text-anchor="start">long archival work</text>
