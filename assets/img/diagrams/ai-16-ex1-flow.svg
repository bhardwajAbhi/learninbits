<rect x="20" y="301" width="92" height="26" rx="13" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="66" y="318.32" font-size="12" fill="#58378f" text-anchor="middle" font-weight="700">Critique</text>
<rect x="126" y="291" width="680" height="65" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<rect x="126" y="291" width="6" height="65" rx="3" fill="#7a4fc2"/>
<text x="146" y="319" font-size="13.6" fill="#58378f" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">critique_chain.invoke({..., &quot;draft&quot;: draft})</text>
<text x="146" y="341" font-size="12.2" fill="#4a5263" text-anchor="start">A review against four criteria, with improvements</text>
<path d="M466 358 L 466 376" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="390" width="92" height="26" rx="13" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="66" y="407.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Revise</text>
<rect x="126" y="380" width="680" height="65" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<rect x="126" y="380" width="6" height="65" rx="3" fill="#0f8a6a"/>
<text x="146" y="408" font-size="13.6" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">revise_chain.invoke({..., &quot;critique&quot;: critique})</text>
<text x="146" y="430" font-size="12.2" fill="#4a5263" text-anchor="start">The better answer</text>
<path d="M466 447 L 466 465" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="479" width="92" height="26" rx="13" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="66" y="496.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Output</text>
<rect x="126" y="469" width="680" height="65" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<rect x="126" y="469" width="6" height="65" rx="3" fill="#0f8a6a"/>
<text x="146" y="497" font-size="13.6" fill="#0b6650" text-anchor="start" font-weight="700">print(...)</text>
<text x="146" y="519" font-size="12.2" fill="#4a5263" text-anchor="start">The draft, the critique and the revised answer</text>
<path d="M806 516 h30 V 131 h-24" fill="none" stroke="#5d6b7e" stroke-width="1.8"/>
<path d="M820 131 L 810 131" fill="none" stroke="#5d6b7e" stroke-width="1.8" marker-end="url(#m8)"/>
<text x="852" y="315.5" font-size="11.5" fill="#3f4a59" text-anchor="middle" font-weight="700">next</text>
<text x="852" y="331.5" font-size="11.5" fill="#3f4a59" text-anchor="middle" font-weight="700">question</text>
<text x="466" y="556" font-size="12.2" fill="#4a5263" text-anchor="middle" font-style="italic">Three prompts, one model and three calls for each question.</text>
