<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The innovation chart of privacy</title>
  <desc id="d">A two by two chart of market and technology. Incremental innovation, with an existing market and existing technology, holds static notice and consent, template-based DPIA, masking and pseudonymization, and PII found by column name. This is privacy in 2016. Architectural innovation holds NER-based LLM security. Disruptive innovation holds agentic DPIA, privacy enhancing technologies and privacy threat modeling. Radical innovation holds SLMs that guard LLMs, prevention of adversarial AI attacks, RAG privacy and security, pseudonymous inference, agentic responsible AI operations and agentic AI red teaming. Privacy in 2025 moves toward the disruptive and radical quadrants.</desc>
