<text x="844" y="191" font-size="11.4" fill="#3f4a59" text-anchor="end" font-weight="600">Chapter 5</text>
<rect x="20" y="218" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
