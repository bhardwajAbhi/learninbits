<text x="427" y="264.14" font-size="11.5" fill="#963f1f" text-anchor="middle" font-weight="600">outliers</text>
<rect x="496" y="248" width="118" height="24" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="555" y="264.14" font-size="11.5" fill="#963f1f" text-anchor="middle" font-weight="600">hidden inferences</text>
<text x="626" y="264" font-size="11.5" fill="#0b6650" text-anchor="start" font-weight="700">Threat modeling finds them.</text>
