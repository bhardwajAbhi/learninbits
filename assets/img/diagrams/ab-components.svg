<text x="100" y="247" font-size="10.6" fill="#4a5263" text-anchor="middle">Blocked, no permission</text>
<path d="M180 233 L 344 233" fill="none" stroke="#c2552d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m7)"/>
<text x="262" y="227" font-size="14" fill="#c2552d" text-anchor="middle" font-weight="800">x</text>
<text x="455" y="304" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic">Android 12 and later require an explicit exported value for components with intent filters.</text>
