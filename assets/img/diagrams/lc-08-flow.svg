<rect x="20" y="301" width="92" height="26" rx="13" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="66" y="318.32" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Call</text>
<rect x="126" y="291" width="680" height="65" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<rect x="126" y="291" width="6" height="65" rx="3" fill="#2f62c8"/>
<text x="146" y="319" font-size="13.6" fill="#1f4a9e" text-anchor="start" font-weight="700">chat_with_history.stream({&quot;input&quot;: question}, config=...)</text>
<text x="146" y="341" font-size="12.2" fill="#4a5263" text-anchor="start">Runs when the user sends a message in st.chat_input</text>
<path d="M466 358 L 466 376" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="390" width="92" height="26" rx="13" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="66" y="407.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Stream</text>
<rect x="126" y="380" width="680" height="65" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<rect x="126" y="380" width="6" height="65" rx="3" fill="#0f8a6a"/>
<text x="146" y="408" font-size="13.6" fill="#0b6650" text-anchor="start" font-weight="700">st.write_stream(response)</text>
<text x="146" y="430" font-size="12.2" fill="#4a5263" text-anchor="start">The answer appears piece by piece</text>
