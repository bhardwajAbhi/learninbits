<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 706" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one run of Example 2</title>
  <desc id="d">A sequence diagram with the lanes Your code, chain, OpenRouter API, extract_and_run_code, exec. Step 1, Your code to chain, chain.invoke({&quot;problem&quot; problem}), prompt, model and parser in one call. Step 2, chain to OpenRouter API, Request with the program of thought prompt, assign the result to answer, do not print. Step 3, OpenRouter API to chain, Reply, approach in words plus Python code. Step 4, chain to Your code, response, a plain string, printed as ORIGINAL MODEL RESPONSE. Step 5, Your code to extract_and_run_code, extract_and_run_code(response). Step 6, extract_and_run_code to extract_and_run_code, re.search(...), code = the text between the fences. Step 7, extract_and_run_code to exec, exec(code, {...}, namespace), collects the new variables. Step 8, exec to exec, answer = confirmed_malicious_apks, the last line of the model&#x27;s code. Step 9, exec to extract_and_run_code, namespace, holds answer and helpers. Step 10, extract_and_run_code to Your code, &quot;CODE ... ANSWER 440.0&quot;, 2250.0 for problem 2. Steps 1 to 10 repeat, Repeated for each of the 2 problems.</desc>
