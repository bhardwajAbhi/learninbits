<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cross-border transfers under the DPDP Act and the GDPR</title>
  <desc id="d">On the left, the DPDP Act is open by default. Data can go from India to any country, except a country that the government restricts under Section 16. Rule 15 adds conditions about access by foreign states, and sector laws and data of Significant Data Fiduciaries can be stricter. On the right, the GDPR is closed by default. Data can go to a country with an adequacy decision, to other countries with Standard Contractual Clauses or Binding Corporate Rules and a Transfer Impact Assessment, and otherwise only under narrow derogations, in Chapter V, Articles 44 to 49. India has no adequacy decision.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="34" width="410" height="250" rx="16" fill="#fdf4e3" fill-opacity="0.55"/>
<rect x="20" y="34" width="410" height="250" rx="16" fill="none" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="36" y="21" width="218" height="26" rx="13" fill="#fff" stroke="#b7791f" stroke-width="1.2"/>
<text x="145" y="38.5" font-size="12.5" fill="#8a5a12" text-anchor="middle" font-weight="700">DPDP Act, open by default</text>
<rect x="40" y="64" width="120" height="50" rx="10" fill="#b7791f"/>
<text x="100" y="94" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">India</text>
<rect x="270" y="60" width="140" height="40" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="340" y="85" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Country A</text>
<path d="M160 89 C 210 89, 220 80, 266 80" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<rect x="270" y="114" width="140" height="40" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="340" y="139" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Country B</text>
<path d="M160 89 C 210 89, 220 134, 266 134" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<rect x="270" y="168" width="140" height="40" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.3"/>
<text x="340" y="193" font-size="11.6" fill="#963f1f" text-anchor="middle" font-weight="700">Listed country</text>
<path d="M160 89 C 210 89, 220 188, 266 188" fill="none" stroke="#c2552d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m7)"/>
<text x="40" y="236" font-size="11" fill="#4a5263" text-anchor="start">Section 16 lets the government restrict named countries.</text>
<text x="40" y="251" font-size="11" fill="#4a5263" text-anchor="start">Rule 15 adds conditions for access by foreign states.</text>
<text x="40" y="266" font-size="11" fill="#4a5263" text-anchor="start">Sector laws and SDF data can be stricter.</text>
<rect x="450" y="34" width="410" height="250" rx="16" fill="#eef3fb" fill-opacity="0.55"/>
<rect x="450" y="34" width="410" height="250" rx="16" fill="none" stroke="#2f62c8" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="466" y="21" width="202.8" height="26" rx="13" fill="#fff" stroke="#2f62c8" stroke-width="1.2"/>
<text x="567.4" y="38.5" font-size="12.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">GDPR, closed by default</text>
<rect x="470" y="64" width="120" height="50" rx="10" fill="#2f62c8"/>
<text x="530" y="94" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">EU and EEA</text>
<rect x="680" y="60" width="160" height="40" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="760" y="77" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="700">Adequate country</text>
<text x="760" y="92" font-size="9.8" fill="#4a5263" text-anchor="middle" font-weight="500">Adequacy decision</text>
<path d="M590 89 C 630 89, 640 80, 676 80" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<rect x="680" y="114" width="160" height="40" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.3"/>
<text x="760" y="131" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="700">Other country</text>
<text x="760" y="146" font-size="9.8" fill="#4a5263" text-anchor="middle" font-weight="500">SCCs or BCRs and a TIA</text>
<path d="M590 89 C 630 89, 640 134, 676 134" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m6)"/>
<rect x="680" y="168" width="160" height="40" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.3"/>
<text x="760" y="185" font-size="11.4" fill="#963f1f" text-anchor="middle" font-weight="700">No safeguard</text>
<text x="760" y="200" font-size="9.8" fill="#4a5263" text-anchor="middle" font-weight="500">Only narrow derogations</text>
<path d="M590 89 C 630 89, 640 188, 676 188" fill="none" stroke="#c2552d" stroke-width="1.5" marker-end="url(#m7)"/>
<text x="470" y="236" font-size="11" fill="#4a5263" text-anchor="start">Chapter V, Articles 44 to 49.</text>
<text x="470" y="251" font-size="11" fill="#4a5263" text-anchor="start">India has no adequacy decision.</text>
</svg>
