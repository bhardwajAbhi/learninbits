<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Personal data under the DPDP Act</title>
  <desc id="d">The definition has three parts, namely any data about an individual, who is identifiable, by or in relation to such data. A name is a direct identifier. Pincode, age and gender together can also point to one person, so they are personal data too.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="30" y="24" width="260" height="78" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.6"/>
<text x="160" y="56" font-size="16" fill="#1f4a9e" text-anchor="middle" font-weight="700">Any data</text>
<text x="160" y="80" font-size="16" fill="#1f4a9e" text-anchor="middle" font-weight="700">about an individual</text>
<rect x="310" y="24" width="260" height="78" rx="12" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.6"/>
<text x="440" y="56" font-size="16" fill="#58378f" text-anchor="middle" font-weight="700">who is</text>
<text x="440" y="80" font-size="16" fill="#58378f" text-anchor="middle" font-weight="700">identifiable</text>
<rect x="590" y="24" width="260" height="78" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="720" y="56" font-size="16" fill="#0b6650" text-anchor="middle" font-weight="700">by or in relation</text>
<text x="720" y="80" font-size="16" fill="#0b6650" text-anchor="middle" font-weight="700">to such data</text>
<text x="440" y="128" font-size="11.5" fill="#7b8292" text-anchor="middle" font-weight="600">DPDP Act, Section 2(t)</text>
<rect x="30" y="150" width="380" height="150" rx="12" fill="#fff" stroke="#d9d4c7" stroke-width="1.5"/>
<text x="50" y="178" font-size="13" fill="#1c2230" text-anchor="start" font-weight="700">A direct identifier</text>
<rect x="50" y="194" width="340" height="40" rx="8" fill="#f2efe8"/>
<text x="66" y="219" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">Name = Priya Sharma</text>
<text x="50" y="260" font-size="12" fill="#4a5263" text-anchor="start">Points to one person on its own.</text>
<rect x="470" y="150" width="380" height="150" rx="12" fill="#fff" stroke="#d9d4c7" stroke-width="1.5"/>
<text x="490" y="178" font-size="13" fill="#1c2230" text-anchor="start" font-weight="700">Data “in relation to” a person</text>
<rect x="490" y="194" width="108" height="40" rx="8" fill="#f2efe8"/>
<text x="544" y="211" font-size="10.5" fill="#7b8292" text-anchor="middle" font-weight="600">Pincode</text>
<text x="544" y="227" font-size="12.5" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">560072</text>
<rect x="608" y="194" width="108" height="40" rx="8" fill="#f2efe8"/>
<text x="662" y="211" font-size="10.5" fill="#7b8292" text-anchor="middle" font-weight="600">Age</text>
<text x="662" y="227" font-size="12.5" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">18</text>
<rect x="726" y="194" width="108" height="40" rx="8" fill="#f2efe8"/>
<text x="780" y="211" font-size="10.5" fill="#7b8292" text-anchor="middle" font-weight="600">Gender</text>
<text x="780" y="227" font-size="12.5" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">Female</text>
<text x="490" y="260" font-size="12" fill="#4a5263" text-anchor="start">No name, but together these can point</text>
<text x="490" y="276.56" font-size="12" fill="#4a5263" text-anchor="start">to one person. It is personal data too.</text>
</svg>
