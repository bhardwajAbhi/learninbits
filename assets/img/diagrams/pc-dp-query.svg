<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Exact counts leak, noisy counts do not</title>
  <desc id="d">With exact answers, the count is 1002 and the same query without one person is 1001, so you learn that person&#x27;s salary and purchase. With differential privacy, each answer has noise, so one person&#x27;s row does not show. Each query spends part of a privacy budget.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="410" height="260" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.6"/>
<text x="40" y="48" font-size="14" fill="#963f1f" text-anchor="start" font-weight="700">Exact answers</text>
<rect x="450" y="20" width="410" height="260" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="470" y="48" font-size="14" fill="#0b6650" text-anchor="start" font-weight="700">Differentially private answers</text>
<rect x="40" y="70" width="370" height="54" rx="10" fill="#f2efe8"/>
<text x="56" y="92" font-size="11.5" fill="#4a5263" text-anchor="start">All buyers of model A, salary over 2 lakh</text>
<text x="56" y="112" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">COUNT = 1002</text>
<rect x="470" y="70" width="370" height="54" rx="10" fill="#f2efe8"/>
<text x="486" y="92" font-size="11.5" fill="#4a5263" text-anchor="start">All buyers of model A, salary over 2 lakh</text>
<text x="486" y="112" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">COUNT = 1002 ± noise</text>
<rect x="40" y="140" width="370" height="54" rx="10" fill="#f2efe8"/>
<text x="56" y="162" font-size="11.5" fill="#4a5263" text-anchor="start">Same query, without Ravi</text>
<text x="56" y="182" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">COUNT = 1001</text>
<rect x="470" y="140" width="370" height="54" rx="10" fill="#f2efe8"/>
<text x="486" y="162" font-size="11.5" fill="#4a5263" text-anchor="start">Same query, without Ravi</text>
<text x="486" y="182" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">COUNT = 1001 ± noise</text>
<rect x="40" y="214" width="370" height="50" rx="10" fill="#fbecec"/>
<text x="56" y="236" font-size="12.5" fill="#963f1f" text-anchor="start" font-weight="700">1002 − 1001 = 1, so now you know Ravi</text>
<text x="56" y="254" font-size="11.5" fill="#1c2230" text-anchor="start">earns over 2 lakh and bought model A.</text>
<rect x="470" y="214" width="370" height="50" rx="10" fill="#e3f4ee"/>
<text x="486" y="236" font-size="12.5" fill="#0b6650" text-anchor="start" font-weight="700">The noise hides one person’s row.</text>
<text x="486" y="254" font-size="11.5" fill="#1c2230" text-anchor="start">Each query spends part of a privacy budget.</text>
</svg>
