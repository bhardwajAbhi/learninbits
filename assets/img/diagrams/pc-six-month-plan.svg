<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A six-month privacy implementation plan</title>
  <desc id="d">Twenty-one activities over six months. Month 1 has governance and platform. Month 2 has the sample team, security, notice, consent and cookies. Month 3 has risk discovery, DPIA and safeguards for consented flows. Months 4 and 5 have safeguards for analytics, testing, call center, marketing and third-party data, and application changes. Month 6 has AI chatbot protection, AI governance, customizations, rights, sign-off and go live. Most money at risk sits in the safeguards, at up to 250 crore rupees each.</desc>
