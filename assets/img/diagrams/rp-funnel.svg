<text x="580" y="352" font-size="12.5" fill="#4a5263" text-anchor="middle" font-weight="700">Inaccurate</text>
<text x="760" y="352" font-size="12.5" fill="#4a5263" text-anchor="middle" font-weight="700">Accurate</text>
