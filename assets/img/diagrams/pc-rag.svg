<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Retrieval-augmented generation</title>
  <desc id="d">Documents and the user query go through an embedding model. The vector database finds close matches. The prompt holds the question and the retrieved context, and goes to the LLM, which answers the user. Personal data from the documents can travel to an external LLM in the prompt.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="130" height="56" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="85" y="54" font-size="12.5" fill="#3f4a59" text-anchor="middle" font-weight="700">Documents</text>
<text x="85" y="72" font-size="10" fill="#4a5263" text-anchor="middle">may hold personal data</text>
<rect x="20" y="150" width="130" height="56" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="85" y="174" font-size="12.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">User query</text>
<text x="85" y="192" font-size="10" fill="#4a5263" text-anchor="middle">a question</text>
<rect x="200" y="86" width="140" height="64" rx="12" fill="#1c2230"/>
<text x="270" y="114" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">Embedding</text>
<text x="270" y="132" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">model</text>
<path d="M150 58 Q175 58 175 90 H194" fill="none" stroke="#5d6b7e" stroke-width="1.6" marker-end="url(#m8)"/>
<path d="M150 178 Q175 178 175 140 H194" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<rect x="390" y="86" width="140" height="64" rx="12" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="460" y="114" font-size="12.5" fill="#58378f" text-anchor="middle" font-weight="700">Vector DB</text>
<text x="460" y="132" font-size="10.5" fill="#4a5263" text-anchor="middle">finds close matches</text>
<path d="M340 118 H384" fill="none" stroke="#1c2230" stroke-width="2" marker-end="url(#m0)"/>
<rect x="580" y="86" width="140" height="64" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="650" y="110" font-size="12.5" fill="#8a5a12" text-anchor="middle" font-weight="700">Prompt</text>
<text x="650" y="128" font-size="10.5" fill="#4a5263" text-anchor="middle">question +</text>
<text x="650" y="142" font-size="10.5" fill="#4a5263" text-anchor="middle">retrieved context</text>
<path d="M530 118 H574" fill="none" stroke="#1c2230" stroke-width="2" marker-end="url(#m0)"/>
<rect x="760" y="86" width="100" height="64" rx="12" fill="#1c2230"/>
<text x="810" y="114" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">LLM</text>
<text x="810" y="132" font-size="10.5" fill="#ffffffcc" text-anchor="middle">answers</text>
<path d="M720 118 H754" fill="none" stroke="#c2552d" stroke-width="2.4" marker-end="url(#m7)"/>
<path d="M810 150 V200 H160" fill="none" stroke="#0f8a6a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m4)"/>
<text x="480" y="194" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="600">response to the user</text>
<rect x="560" y="220" width="300" height="48" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.5"/>
<text x="576" y="241" font-size="11.5" fill="#963f1f" text-anchor="start" font-weight="700">Personal data from the documents can</text>
<text x="576" y="258" font-size="11.5" fill="#963f1f" text-anchor="start" font-weight="700">travel to an external LLM in the prompt.</text>
</svg>
