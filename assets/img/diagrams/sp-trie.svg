<rect x="560" y="350" width="200" height="52" rx="8" fill="#1f2633"/>
<text x="660" y="372" font-size="11.4" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">prop_info</text>
<text x="660" y="392" font-size="11" fill="#e8ecf3" text-anchor="middle" font-family="JetBrains Mono, monospace">ro.build.type = user</text>
<path d="M625 322 L 640 348" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<rect x="20" y="200" width="250" height="150" rx="12" fill="#f2efe8"/>
<text x="36" y="226" font-size="11.6" fill="#1c2230" text-anchor="start">Finding ro.build.type</text>
<text x="36" y="248" font-size="11.6" fill="#1c2230" text-anchor="start">1. under root, find ro</text>
<text x="36" y="270" font-size="11.6" fill="#1c2230" text-anchor="start">2. under ro, find build</text>
<text x="36" y="292" font-size="11.6" fill="#1c2230" text-anchor="start">3. under build, find type</text>
<text x="36" y="314" font-size="11.6" fill="#1c2230" text-anchor="start">4. read its prop_info</text>
</svg>
