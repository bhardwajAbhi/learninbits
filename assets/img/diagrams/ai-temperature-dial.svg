<rect x="394" y="166" width="21.08" height="20" rx="5" fill="#7a4fc2" fill-opacity="0.85"/>
<text x="560" y="181" font-size="12" fill="#58378f" text-anchor="end" font-weight="700">17%</text>
<text x="324" y="224" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">email</text>
<rect x="394" y="210" width="124" height="20" rx="5" fill="#f3f1ec"/>
<rect x="394" y="210" width="11.16" height="20" rx="5" fill="#7a4fc2" fill-opacity="0.85"/>
<text x="560" y="225" font-size="12" fill="#58378f" text-anchor="end" font-weight="700">9%</text>
<text x="324" y="268" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">details</text>
<rect x="394" y="254" width="124" height="20" rx="5" fill="#f3f1ec"/>
