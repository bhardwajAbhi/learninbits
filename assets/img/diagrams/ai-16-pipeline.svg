<text x="146" y="141" font-size="13.6" fill="#095a61" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">RunnablePassthrough.assign(draft=draft_chain)</text>
<text x="146" y="163" font-size="12.2" fill="#4a5263" text-anchor="start">Adds draft and keeps question</text>
