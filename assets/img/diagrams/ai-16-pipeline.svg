<rect x="20" y="212" width="92" height="26" rx="13" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.2"/>
<text x="66" y="229.32" font-size="12" fill="#095a61" text-anchor="middle" font-weight="700">Add</text>
<rect x="126" y="202" width="680" height="65" rx="12" fill="#fff" stroke="#0e7c86" stroke-width="1.6"/>
<rect x="126" y="202" width="6" height="65" rx="3" fill="#0e7c86"/>
