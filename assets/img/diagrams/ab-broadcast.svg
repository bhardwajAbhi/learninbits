<text x="660" y="186" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="600">StateFlow, SharedFlow or LiveData</text>
<text x="660" y="208" font-size="11.4" fill="#4a5263" text-anchor="middle">Data never leaves the process.</text>
