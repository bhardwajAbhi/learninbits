<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Choosing a privacy technology, the start</title>
  <desc id="d">Start with personal data that you want to use. If the notice and the consent do not cover the use, and the use cannot work with unrelatable data, give a new notice and get fresh consent. If the use can work with unrelatable data, go to lane B. If the notice and consent cover the use, select a lane. Lane A is to store and process the data inside your organization. Lane B is to share or publish it. Lane C is to compute or prove something with other parties or the cloud. Lane D is to use it with AI or an LLM.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="240" y="20" width="400" height="54" rx="27" fill="#1c2230"/>
<text x="440" y="44" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">You hold personal data and want to</text>
<text x="440" y="62" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">use it for something</text>
<path d="M440 74 V104" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<path d="M440 108 L640 168 L440 228 L240 168 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="440" y="162" font-size="12.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">Do the notice and the consent</text>
<text x="440" y="179" font-size="12.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">cover this use?</text>
<path d="M240 168 H150 V260" fill="none" stroke="#c2552d" stroke-width="1.8" marker-end="url(#m7)"/>
<text x="196" y="160" font-size="11" fill="#963f1f" text-anchor="middle" font-weight="800">No</text>
<path d="M150 266 L270 316 L150 366 L30 316 Z" fill="#fff" stroke="#c2552d" stroke-width="2"/>
<text x="150" y="310" font-size="11.5" fill="#963f1f" text-anchor="middle" font-weight="700">Can the use work with</text>
<text x="150" y="326" font-size="11.5" fill="#963f1f" text-anchor="middle" font-weight="700">unrelatable data?</text>
<path d="M150 366 V400" fill="none" stroke="#c2552d" stroke-width="1.6" marker-end="url(#m7)"/>
<text x="166" y="386" font-size="11" fill="#963f1f" text-anchor="middle" font-weight="800">No</text>
<rect x="20" y="404" width="260" height="66" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.5"/>
<text x="150" y="428" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="700">Give a new notice and get</text>
<text x="150" y="444" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="700">fresh consent first (Part 2)</text>
<path d="M270 316 H310 V533 H286" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="292" y="308" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="800">Yes</text>
<rect x="20" y="500" width="260" height="66" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="150" y="524" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Go to lane B and make the</text>
<text x="150" y="540" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">data unrelatable first</text>
<path d="M440 228 V262" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<text x="458" y="248" font-size="11" fill="#1c2230" text-anchor="middle" font-weight="800">Yes</text>
<rect x="340" y="266" width="200" height="46" rx="10" fill="#f2efe8" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="440" y="294" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">What must happen to the data?</text>
<rect x="560" y="350" width="300" height="66" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.8"/>
<rect x="560" y="350" width="52" height="66" rx="12" fill="#5d6b7e"/>
<rect x="596" y="350" width="16" height="66" rx="0" fill="#5d6b7e"/>
<text x="586" y="390" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">A</text>
<text x="628" y="376" font-size="13" fill="#3f4a59" text-anchor="start" font-weight="700">Store and process it inside</text>
<text x="628" y="394" font-size="11" fill="#4a5263" text-anchor="start">your organization</text>
<path d="M440 312 V372 Q440 383 452 383 H554" fill="none" stroke="#5d6b7e" stroke-width="1.6" marker-end="url(#m8)"/>
<rect x="560" y="440" width="300" height="66" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<rect x="560" y="440" width="52" height="66" rx="12" fill="#0f8a6a"/>
<rect x="596" y="440" width="16" height="66" rx="0" fill="#0f8a6a"/>
<text x="586" y="480" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">B</text>
<text x="628" y="466" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">Share or publish it</text>
<text x="628" y="484" font-size="11" fill="#4a5263" text-anchor="start">records or insights</text>
<path d="M440 312 V462 Q440 473 452 473 H554" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<rect x="560" y="530" width="300" height="66" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<rect x="560" y="530" width="52" height="66" rx="12" fill="#7a4fc2"/>
<rect x="596" y="530" width="16" height="66" rx="0" fill="#7a4fc2"/>
<text x="586" y="570" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">C</text>
<text x="628" y="556" font-size="13" fill="#58378f" text-anchor="start" font-weight="700">Compute or prove something</text>
<text x="628" y="574" font-size="11" fill="#4a5263" text-anchor="start">with other parties or the cloud</text>
<path d="M440 312 V552 Q440 563 452 563 H554" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<rect x="560" y="620" width="300" height="66" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<rect x="560" y="620" width="52" height="66" rx="12" fill="#c2552d"/>
<rect x="596" y="620" width="16" height="66" rx="0" fill="#c2552d"/>
<text x="586" y="660" font-size="22" fill="#fff" text-anchor="middle" font-weight="800">D</text>
<text x="628" y="646" font-size="13" fill="#963f1f" text-anchor="start" font-weight="700">Use it with AI or an LLM</text>
<text x="628" y="664" font-size="11" fill="#4a5263" text-anchor="start">train, prompt, retrieve, deploy</text>
<path d="M440 312 V642 Q440 653 452 653 H554" fill="none" stroke="#c2552d" stroke-width="1.6" marker-end="url(#m7)"/>
</svg>
