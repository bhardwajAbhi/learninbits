<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of Example 2 flows</title>
  <desc id="d">Setup, load_dotenv(), Reads OPENROUTER_API_KEY from the .env file. Model, llm = ChatOpenRouter(...), model=&quot;qwen/qwen-2.5-7b-instruct&quot;, temperature=0, max_tokens=128. Call, llm.invoke(&quot;What is the capital of France?&quot;), One request to the provider. Reply, AIMessage, content, a plain string, usage_metadata, 36 input, 8 output tokens. Model, short_model = ChatOpenRouter(..., max_tokens=5), A second model object that can write only 5 tokens. Call, short_model.invoke(&quot;Tell me a very long story ...&quot;), The model wants to write much more than 5 tokens. Output, The answer is cut, content “The history of the universe”, finish_reason length.</desc>
