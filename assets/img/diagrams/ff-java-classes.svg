<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 638" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Java classes that aconfig generates for one package</title>
  <desc id="d">Your code calls Flags.mountBeforeData(). Flags is a final class with FLAG_ name constants, one static getter per flag and a private static FEATURE_FLAGS field. That field points to one implementation of the FeatureFlags interface. FeatureFlagsImpl is the production class that reads storage once and returns constants for read-only flags. CustomFeatureFlags asks a BiPredicate for each value. FakeFeatureFlagsImpl extends CustomFeatureFlags for tests, with setFlag and resetAll. Below, ExportedFlags is a separate class for exported libraries that reads values through AconfigPackage and checks the SDK version for finalized flags.</desc>
