<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The life of a lazy HAL</title>
  <desc id="d">Six states. Not running after boot. A client asks, and servicemanager tells init to start the HAL. Started, the HAL registers as lazy. In use, clients hold the binder. No clients, checked every 5 seconds. Exits, and the memory is free again. The next request starts the cycle again.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="40" width="128" height="70" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="84" y="72" font-size="12.2" fill="#3f4a59" text-anchor="middle" font-weight="700">Not running</text>
<text x="84" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">after boot</text>
<path d="M149 75 L 161 75" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="163" y="40" width="128" height="70" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="227" y="72" font-size="12.2" fill="#1f4a9e" text-anchor="middle" font-weight="700">A client asks</text>
<text x="227" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">servicemanager tells init</text>
<path d="M292 75 L 304 75" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="306" y="40" width="128" height="70" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="370" y="72" font-size="12.2" fill="#7d2a55" text-anchor="middle" font-weight="700">Started</text>
<text x="370" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">registers as lazy</text>
<path d="M435 75 L 447 75" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="449" y="40" width="128" height="70" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="513" y="72" font-size="12.2" fill="#0b6650" text-anchor="middle" font-weight="700">In use</text>
<text x="513" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">clients hold the binder</text>
<path d="M578 75 L 590 75" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="592" y="40" width="128" height="70" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="656" y="72" font-size="12.2" fill="#8a5a12" text-anchor="middle" font-weight="700">No clients</text>
<text x="656" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">checked every 5 seconds</text>
<path d="M721 75 L 733 75" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="735" y="40" width="128" height="70" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="799" y="72" font-size="12.2" fill="#3f4a59" text-anchor="middle" font-weight="700">Exits</text>
<text x="799" y="90" font-size="9.4" fill="#4a5263" text-anchor="middle">memory is free again</text>
<path d="M796 112 C 796 150, 84 150, 84 112" fill="none" stroke="#5d6b7e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="440" y="168" font-size="11.2" fill="#4a5263" text-anchor="middle" font-weight="600">The next request starts the cycle again.</text>
</svg>
