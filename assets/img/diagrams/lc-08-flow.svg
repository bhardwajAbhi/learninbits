<text x="146" y="230" font-size="13.6" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">for message in st.session_state[&quot;langchain_messages&quot;]</text>
<text x="146" y="252" font-size="12.2" fill="#4a5263" text-anchor="start">Shows the earlier messages as chat bubbles after every rerun</text>
