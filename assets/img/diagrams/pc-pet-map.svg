<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Input PETs and output PETs</title>
  <desc id="d">A two by two map. For data sharing, input PETs are confidential computing, fully homomorphic encryption and ZKP, and output PETs are k-anonymity, t-closeness, differential privacy and synthetic data. For data querying, input PETs are private set intersection, secure multi-party computation, pseudonymous inference and threshold cryptography, and output PETs are differential querying, synthetic prompts and federated learning.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="330" y="26" font-size="14" fill="#1f4a9e" text-anchor="middle" font-weight="700">Input PETs</text>
<text x="330" y="44" font-size="11" fill="#4a5263" text-anchor="middle">protect data while it is computed on</text>
<text x="660" y="26" font-size="14" fill="#0b6650" text-anchor="middle" font-weight="700">Output PETs</text>
<text x="660" y="44" font-size="11" fill="#4a5263" text-anchor="middle">protect what is released</text>
<rect x="180" y="60" width="310" height="166" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<circle cx="204" cy="88" r="4" fill="#2f62c8"/>
<text x="218" y="92" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Confidential computing</text>
<circle cx="204" cy="114" r="4" fill="#2f62c8"/>
<text x="218" y="118" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Fully homomorphic encryption</text>
<circle cx="204" cy="140" r="4" fill="#2f62c8"/>
<text x="218" y="144" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">ZKP and verifiable claims</text>
<rect x="510" y="60" width="310" height="166" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<circle cx="534" cy="88" r="4" fill="#0f8a6a"/>
<text x="548" y="92" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">k-anonymity</text>
<circle cx="534" cy="114" r="4" fill="#0f8a6a"/>
<text x="548" y="118" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">t-closeness</text>
<circle cx="534" cy="140" r="4" fill="#0f8a6a"/>
<text x="548" y="144" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Differential privacy</text>
<circle cx="534" cy="166" r="4" fill="#0f8a6a"/>
<text x="548" y="170" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Synthetic data</text>
<text x="534" y="210" font-size="11" fill="#0b6650" text-anchor="start" font-style="italic" font-weight="600">measured by threat modeling</text>
<rect x="180" y="240" width="310" height="166" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<circle cx="204" cy="268" r="4" fill="#2f62c8"/>
<text x="218" y="272" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Private set intersection</text>
<circle cx="204" cy="294" r="4" fill="#2f62c8"/>
<text x="218" y="298" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Secure multi-party computation</text>
<circle cx="204" cy="320" r="4" fill="#2f62c8"/>
<text x="218" y="324" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Pseudonymous inference</text>
<circle cx="204" cy="346" r="4" fill="#2f62c8"/>
<text x="218" y="350" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Threshold cryptography</text>
<text x="204" y="390" font-size="11" fill="#1f4a9e" text-anchor="start" font-style="italic" font-weight="600">guarded by small-model guards</text>
<rect x="510" y="240" width="310" height="166" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<circle cx="534" cy="268" r="4" fill="#0f8a6a"/>
<text x="548" y="272" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Differential querying</text>
<circle cx="534" cy="294" r="4" fill="#0f8a6a"/>
<text x="548" y="298" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Synthetic prompts</text>
<circle cx="534" cy="320" r="4" fill="#0f8a6a"/>
<text x="548" y="324" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Federated learning</text>
<text x="20" y="130" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">Data sharing</text>
<text x="20" y="146.56" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">high volume,</text>
<text x="20" y="163.12" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">low frequency</text>
<text x="20" y="310" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">Data querying</text>
<text x="20" y="326.56" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">low volume,</text>
<text x="20" y="343.12" font-size="12" fill="#1c2230" text-anchor="start" font-weight="700">high frequency</text>
</svg>
