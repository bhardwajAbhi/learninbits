<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two security changes in Android 17</title>
  <desc id="d">At the top, keystore2 and system_server ask servicemanager for a security HAL, and servicemanager returns an IAccessor proxy with an accessor_trusty type that forwards to a security VM. The VM hosts KeyMint, Gatekeeper, SecureClock, SharedSecret and the RKP component. Below, ML-DSA, the first post-quantum key in KeyMint. The algorithm value is ML_DSA = 4, with the tag ML_DSA_VARIANT number 11. The variants are ML-DSA-65 and ML-DSA-87, with no KEY_SIZE. It works in the TEE only, not in StrongBox, with the purpose SIGN or ATTEST_KEY. A key can be imported as a 32-byte seed, and attestation version 500 records the variant.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="180" height="60" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="110" y="56" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">keystore2 and</text>
<text x="110" y="73" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">system_server</text>
<rect x="240" y="30" width="160" height="60" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.6"/>
<text x="320" y="66" font-size="12.4" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">servicemanager</text>
<rect x="440" y="30" width="170" height="60" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.6"/>
<text x="525" y="56" font-size="11.6" fill="#8a5a12" text-anchor="middle" font-weight="700">IAccessor proxy</text>
<text x="525" y="73" font-size="11.6" fill="#8a5a12" text-anchor="middle" font-weight="700">accessor_trusty_*</text>
<path d="M200 60 L 236 60" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M400 60 L 436 60" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M610 60 L 646 60" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="650" y="24" width="210" height="250" rx="16" fill="#f3f0fa" fill-opacity="0.55"/>
<rect x="650" y="24" width="210" height="250" rx="16" fill="none" stroke="#7a4fc2" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="732.4" y="11" width="111.6" height="26" rx="13" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="788.2" y="28.5" font-size="12.5" fill="#58378f" text-anchor="middle" font-weight="700">Security VM</text>
<rect x="670" y="52" width="170" height="32" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="755" y="73" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">KeyMint</text>
<rect x="670" y="94" width="170" height="32" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="755" y="115" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">Gatekeeper</text>
<rect x="670" y="136" width="170" height="32" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="755" y="157" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">SecureClock</text>
<rect x="670" y="178" width="170" height="32" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="755" y="199" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">SharedSecret</text>
<rect x="670" y="220" width="170" height="32" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="755" y="241" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">RKP component</text>
<rect x="20" y="130" width="590" height="144" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.5"/>
<text x="36" y="156" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">ML-DSA, the first post-quantum key in KeyMint</text>
<text x="36" y="180" font-size="11.6" fill="#1c2230" text-anchor="start">Algorithm ML_DSA = 4, with the tag ML_DSA_VARIANT (11)</text>
<text x="36" y="202" font-size="11.6" fill="#1c2230" text-anchor="start">Variants ML-DSA-65 and ML-DSA-87, no KEY_SIZE</text>
<text x="36" y="224" font-size="11.6" fill="#1c2230" text-anchor="start">TEE only, not StrongBox. Purpose SIGN or ATTEST_KEY</text>
<text x="36" y="246" font-size="11.6" fill="#1c2230" text-anchor="start">Import as a 32-byte seed. Attestation version 500 records the variant</text>
</svg>
