<text x="90" y="43" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">keystore2</text>
<line x1="90" y1="56" x2="90" y2="470" stroke="#e3f4ee" stroke-width="3"/>
<rect x="240" y="20" width="160" height="36" rx="10" fill="#b7791f"/>
<text x="320" y="43" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">rkpd app</text>
<line x1="320" y1="56" x2="320" y2="470" stroke="#fdf4e3" stroke-width="3"/>
<rect x="470" y="20" width="160" height="36" rx="10" fill="#7a4fc2"/>
<text x="550" y="43" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">KeyMint HAL and TA</text>
<line x1="550" y1="56" x2="550" y2="470" stroke="#f3f0fa" stroke-width="3"/>
<rect x="700" y="20" width="160" height="36" rx="10" fill="#c2552d"/>
<text x="780" y="43" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">RKP server</text>
<line x1="780" y1="56" x2="780" y2="470" stroke="#fbecec" stroke-width="3"/>
<path d="M324 90 L 544 90" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="435" y="83" font-size="10.8" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">generateEcdsaP256KeyPair()</text>
<path d="M546 122 L 326 122" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<text x="435" y="115" font-size="10.8" fill="#58378f" text-anchor="middle" font-weight="600">MACed public keys</text>
<path d="M324 160 L 774 160" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="550" y="153" font-size="10.8" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">fetchEekChain</text>
<path d="M776 192 L 326 192" fill="none" stroke="#c2552d" stroke-width="1.6" marker-end="url(#m7)"/>
<text x="550" y="185" font-size="10.8" fill="#963f1f" text-anchor="middle" font-weight="600">GEEK chain and challenge</text>
<path d="M324 230 L 544 230" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="435" y="223" font-size="10.8" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">generateCertificateRequestV2()</text>
<path d="M546 262 L 326 262" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<text x="435" y="255" font-size="10.8" fill="#58378f" text-anchor="middle" font-weight="600">CSR with the DICE chain, CBOR</text>
<path d="M324 300 L 774 300" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="550" y="293" font-size="10.8" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">signCertificates (CSR)</text>
<path d="M776 332 L 326 332" fill="none" stroke="#c2552d" stroke-width="1.6" marker-end="url(#m7)"/>
<text x="550" y="325" font-size="10.8" fill="#963f1f" text-anchor="middle" font-weight="600">X.509 chain for each key</text>
<path d="M94 400 L 314 400" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="205" y="393" font-size="10.8" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">getKey() for an app key</text>
<path d="M316 432 L 96 432" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<text x="205" y="425" font-size="10.8" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">pooled key and chain</text>
<rect x="330" y="346" width="220" height="34" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="440" y="368" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="700">Store in the key pool</text>
<text x="440" y="466" font-size="11.2" fill="#4a5263" text-anchor="middle" font-style="italic">The pool refills on a schedule, so a new app key gets a chain without a network round trip.</text>
</svg>
