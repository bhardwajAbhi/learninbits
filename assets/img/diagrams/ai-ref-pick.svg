<text x="584" y="713" font-size="12.8" fill="#7d2a55" text-anchor="start" font-weight="700">Self-consistency</text>
<text x="844" y="713" font-size="11.4" fill="#7d2a55" text-anchor="end" font-weight="600">Chapter 14</text>
</svg>
