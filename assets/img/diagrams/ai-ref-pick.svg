<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 746" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pick a prompting pattern for your task</title>
  <desc id="d">A guide to pick a prompting pattern. Look at your task and find the line that describes it best. A fixed role, tone or set of rules for every answer leads to System message, chapter 4. A simple task that you can describe clearly leads to Zero-shot, chapter 5. Your own labels or rules, easier to show than to explain leads to Few-shot, chapter 6. An answer that your code must read leads to Structured output, chapter 7. One clear path to the answer, with several steps leads to Chain of thought, chapter 8. Several possible options to compare leads to Tree of thought, chapter 9. Parts that depend on each other leads to Graph of thought, chapter 10. A specific case of a general rule leads to Step-back, chapter 11. A long problem with many simple parts leads to Least-to-most, chapter 12. An exact number from a formula leads to Program of thought, chapter 13. A short answer that you want to confirm with several tries leads to Self-consistency, chapter 14.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="840" height="44" rx="12" fill="#f2efe8"/>
<text x="440" y="48" font-size="13.2" fill="#1c2230" text-anchor="middle" font-weight="700">Look at your task. Find the line that describes it best.</text>
<text x="20" y="98" font-size="11.2" fill="#4a5263" text-anchor="start" letter-spacing="1" font-weight="700">TALK TO THE MODEL WELL</text>
<rect x="20" y="110" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="137" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">A fixed role, tone or set of rules for every answer</text>
<path d="M494 132 L 560 132" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="566" y="110" width="294" height="44" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="584" y="137" font-size="12.8" fill="#7d2a55" text-anchor="start" font-weight="700">System message</text>
<text x="844" y="137" font-size="11.4" fill="#7d2a55" text-anchor="end" font-weight="600">Chapter 4</text>
<rect x="20" y="164" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="191" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">A simple task that you can describe clearly</text>
