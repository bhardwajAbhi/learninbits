<text x="844" y="299" font-size="11.4" fill="#1f4a9e" text-anchor="end" font-weight="600">Chapter 7</text>
<text x="20" y="350" font-size="11.2" fill="#4a5263" text-anchor="start" letter-spacing="1" font-weight="700">MAKE THE MODEL THINK</text>
<rect x="20" y="362" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="389" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">One clear path to the answer, with several steps</text>
<path d="M494 384 L 560 384" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="566" y="362" width="294" height="44" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="584" y="389" font-size="12.8" fill="#3f4a59" text-anchor="start" font-weight="700">Chain of thought</text>
<text x="844" y="389" font-size="11.4" fill="#3f4a59" text-anchor="end" font-weight="600">Chapter 8</text>
