<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Keystore stack from an app to secure hardware</title>
  <desc id="d">From top to bottom. An app uses KeyPairGenerator and KeyStore with the AndroidKeyStore provider and calls keystore2 over Binder. keystore2 is a Rust service in system/security/keystore2 with modules for SELinux checks, the key database, grants, enforcements, operations, super keys, the garbage collector and the RKP client. It calls the KeyMint HAL interfaces over Binder, namely IKeyMintDevice, ISharedSecret, ISecureClock and IRemotelyProvisionedComponent. These reach the KeyMint TA in the TEE at the TRUSTED_ENVIRONMENT level, or KeyMint on an optional StrongBox, through TIPC and SMC. On the right, the com.android.rkpd mainline module fills a pool of attestation keys signed by the Google RKP server and hands them to keystore2, and it talks to IRemotelyProvisionedComponent.</desc>
