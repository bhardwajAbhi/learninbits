<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How properties fill up at boot</title>
  <desc id="d">Five stages in order. First, androidboot values from the kernel command line, bootconfig and device tree become ro.boot properties. Second, init loads the build.prop files of system, system_ext, vendor, odm and product, and a later file wins for the same name. Third, init derives values such as ro.product, ro.build.fingerprint, ro.product.cpu.abilist and ro.vendor.api_level. Fourth, the property service opens its two sockets, so other processes can ask to set values. Fifth, after /data mounts, persist properties load, next_boot values apply and ro.persistent_properties.ready becomes true. All of this happens in second-stage init, before most other processes start.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="156" height="180" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.5"/>
<rect x="20" y="30" width="156" height="34" rx="12" fill="#eef0f3"/>
<text x="98" y="52" font-size="11.8" fill="#3f4a59" text-anchor="middle" font-weight="700">Kernel and bootloader</text>
<text x="32" y="88" font-size="10.6" fill="#1c2230" text-anchor="start">androidboot.* from the</text>
<text x="32" y="108" font-size="10.6" fill="#1c2230" text-anchor="start">command line, bootconfig</text>
<text x="32" y="128" font-size="10.6" fill="#1c2230" text-anchor="start">and device tree</text>
<text x="32" y="148" font-size="10.6" fill="#1c2230" text-anchor="start">become ro.boot.*</text>
<path d="M178 120 L 190 120" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="192" y="30" width="156" height="180" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.5"/>
<rect x="192" y="30" width="156" height="34" rx="12" fill="#eef3fb"/>
<text x="270" y="52" font-size="11.8" fill="#1f4a9e" text-anchor="middle" font-weight="700">build.prop files</text>
<text x="204" y="88" font-size="10.6" fill="#1c2230" text-anchor="start">system, system_ext,</text>
<text x="204" y="108" font-size="10.6" fill="#1c2230" text-anchor="start">vendor, odm, product</text>
<text x="204" y="128" font-size="10.6" fill="#1c2230" text-anchor="start">a later file wins</text>
<text x="204" y="148" font-size="10.6" fill="#1c2230" text-anchor="start">for the same name</text>
<path d="M350 120 L 362 120" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="364" y="30" width="156" height="180" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.5"/>
<rect x="364" y="30" width="156" height="34" rx="12" fill="#f3f0fa"/>
<text x="442" y="52" font-size="11.8" fill="#58378f" text-anchor="middle" font-weight="700">Derived values</text>
<text x="376" y="88" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">ro.product.*</text>
<text x="376" y="108" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">ro.build.fingerprint</text>
<text x="376" y="128" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">ro.product.cpu.abilist</text>
<text x="376" y="148" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">ro.vendor.api_level</text>
<path d="M522 120 L 534 120" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="536" y="30" width="156" height="180" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<rect x="536" y="30" width="156" height="34" rx="12" fill="#fdf4e3"/>
<text x="614" y="52" font-size="11.8" fill="#8a5a12" text-anchor="middle" font-weight="700">Property service</text>
<text x="548" y="88" font-size="10.6" fill="#1c2230" text-anchor="start">the two sockets open</text>
<text x="548" y="108" font-size="10.6" fill="#1c2230" text-anchor="start">other processes can</text>
<text x="548" y="128" font-size="10.6" fill="#1c2230" text-anchor="start">now ask to set values</text>
<text x="548" y="148" font-size="10.6" fill="#1c2230" text-anchor="start"></text>
<path d="M694 120 L 706 120" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="708" y="30" width="156" height="180" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.5"/>
<rect x="708" y="30" width="156" height="34" rx="12" fill="#e3f4ee"/>
<text x="786" y="52" font-size="11.8" fill="#0b6650" text-anchor="middle" font-weight="700">After /data mounts</text>
<text x="720" y="88" font-size="10.6" fill="#1c2230" text-anchor="start">persist.* loaded</text>
<text x="720" y="108" font-size="10.6" fill="#1c2230" text-anchor="start">next_boot.* applied</text>
<text x="720" y="128" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">ro.persistent_</text>
<text x="720" y="148" font-size="10.6" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">properties.ready=true</text>
<text x="440" y="240" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic">All of this happens in second-stage init, before most other processes start.</text>
</svg>
