<rect x="496" y="46" width="162" height="132" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="577" y="104" font-size="15.5" fill="#8a5a12" text-anchor="middle" font-weight="700">Method A</text>
<text x="577" y="128" font-size="12.5" fill="#4a5263" text-anchor="middle">fast, inaccurate</text>
<rect x="676" y="196" width="162" height="132" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="757" y="254" font-size="15.5" fill="#58378f" text-anchor="middle" font-weight="700">Method B</text>
<text x="757" y="278" font-size="12.5" fill="#4a5263" text-anchor="middle">slow, accurate</text>
