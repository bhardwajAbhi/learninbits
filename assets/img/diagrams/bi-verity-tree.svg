<text x="230" y="316" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">A read of block B5 hashes the block and walks up to the root.</text>
<text x="230" y="334" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">The root hash itself comes from the signed vbmeta.</text>
<text x="480" y="34" font-size="13" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">MANAGED_RESTART_AND_EIO</text>
<text x="480" y="54" font-size="12" fill="#4a5263" text-anchor="start">The usual mode on production devices</text>
<rect x="480" y="74" width="170" height="76" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.7"/>
