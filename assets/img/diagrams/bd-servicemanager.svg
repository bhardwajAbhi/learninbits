<text x="323.333" y="44" font-size="11.8" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">servicemanager</text>
<line x1="323.333" y1="60" x2="323.333" y2="592" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="481.667" y="18" width="150" height="42" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.4"/>
<text x="556.667" y="44" font-size="12.3" fill="#963f1f" text-anchor="middle" font-weight="700">SELinux policy</text>
<line x1="556.667" y1="60" x2="556.667" y2="592" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="715" y="18" width="150" height="42" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="790" y="44" font-size="12.3" fill="#1f4a9e" text-anchor="middle" font-weight="700">Client process</text>
