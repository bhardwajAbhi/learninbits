<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What asInterface returns</title>
  <desc id="d">IFoo.Stub.asInterface of a binder has two outcomes. In the same process, queryLocalInterface finds the object, the caller gets the real Java object, and calls are normal method calls with no Parcel and no driver. In another process, the binder is a BinderProxy, the caller gets a new IFoo.Stub.Proxy, and each call writes a Parcel and goes through the driver.</desc>
