<text x="440" y="30" font-size="14" fill="#1c2230" text-anchor="middle" font-weight="700">Next word after “Always pause and verify the sender&#x27;s ...”</text>
<text x="440" y="50" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">Example numbers, to show the effect</text>
<rect x="24" y="70" width="268" height="300" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="158" y="98" font-size="14.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">Temperature 0</text>
<text x="40" y="136" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">address</text>
<rect x="110" y="122" width="124" height="20" rx="5" fill="#f3f1ec"/>
<rect x="110" y="122" width="124" height="20" rx="5" fill="#2f62c8" fill-opacity="0.85"/>
<text x="276" y="137" font-size="12" fill="#1f4a9e" text-anchor="end" font-weight="700">100%</text>
<text x="40" y="180" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">identity</text>
<rect x="110" y="166" width="124" height="20" rx="5" fill="#f3f1ec"/>
<text x="276" y="181" font-size="12" fill="#1f4a9e" text-anchor="end" font-weight="700">0%</text>
<text x="40" y="224" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">email</text>
