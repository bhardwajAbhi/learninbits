<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one run of Example 2</title>
  <desc id="d">A sequence diagram with the lanes main(), two chains, OpenRouter API. Step 1, main() to two chains, (unconstrained_prompt | llm | parser).invoke(...), the plain request. Step 2, two chains to OpenRouter API, call 1. Step 3, OpenRouter API to main(), answer, 420 words. Step 4, main() to main(), len(result.split()), 420 words. Step 5, main() to two chains, (constrained_prompt | llm | parser).invoke(...), the request with limits. Step 6, two chains to OpenRouter API, call 2. Step 7, OpenRouter API to main(), answer, 90 words, one paragraph. Step 8, main() to main(), len(result.split()), 90 words, over the limit of 80.</desc>
