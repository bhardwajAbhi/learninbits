<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Venues for publication</title>
  <desc id="d">A map of venues by speed of publication and depth of review. Journals are slower with deep review and suit long archival work. Conferences are faster, with talks, feedback and networking. Workshops and symposia suit early ideas and niche topics. Book chapters are invited and give broader context. Major publishers include IEEE, ACM, Springer and Elsevier. Open access venues can charge an article processing charge, and many subscription journals are free.</desc>
