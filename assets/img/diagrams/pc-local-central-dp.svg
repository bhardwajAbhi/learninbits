<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 266" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Local and central differential privacy</title>
  <desc id="d">In local DP, each phone adds noise before it sends data, so the collector sees only noisy data. Privacy is stronger, but utility is lower. In central DP, a trusted curator collects the data and adds noise to the result. This gives a better balance of privacy and accuracy.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="410" height="230" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<text x="40" y="48" font-size="14" fill="#58378f" text-anchor="start" font-weight="700">Local DP</text>
<text x="130" y="48" font-size="12" fill="#4a5263" text-anchor="start">noise at the source</text>
<rect x="450" y="20" width="410" height="230" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="470" y="48" font-size="14" fill="#1f4a9e" text-anchor="start" font-weight="700">Central DP</text>
<text x="570" y="48" font-size="12" fill="#4a5263" text-anchor="start">noise after collection</text>
<rect x="40" y="72" width="90" height="36" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="85" y="95" font-size="11" fill="#58378f" text-anchor="middle" font-weight="600">Phone 1</text>
<rect x="146" y="76" width="54" height="28" rx="6" fill="#b7791f"/>
<text x="173" y="95" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">noise</text>
<path d="M130 90 H142" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<path d="M200 90 L262 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="40" y="122" width="90" height="36" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="85" y="145" font-size="11" fill="#58378f" text-anchor="middle" font-weight="600">Phone 2</text>
<rect x="146" y="126" width="54" height="28" rx="6" fill="#b7791f"/>
<text x="173" y="145" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">noise</text>
<path d="M130 140 H142" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<path d="M200 140 L262 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="40" y="172" width="90" height="36" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="85" y="195" font-size="11" fill="#58378f" text-anchor="middle" font-weight="600">Phone 3</text>
<rect x="146" y="176" width="54" height="28" rx="6" fill="#b7791f"/>
<text x="173" y="195" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">noise</text>
<path d="M130 190 H142" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<path d="M200 190 L262 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="266" y="120" width="140" height="56" rx="10" fill="#f2efe8" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="336" y="144" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">Collector</text>
<text x="336" y="162" font-size="10.5" fill="#4a5263" text-anchor="middle">sees only noisy data</text>
<text x="40" y="238" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">Stronger privacy, but lower utility</text>
<rect x="470" y="72" width="90" height="36" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="515" y="95" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="600">Phone 1</text>
<path d="M560 90 L604 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="470" y="122" width="90" height="36" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="515" y="145" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="600">Phone 2</text>
<path d="M560 140 L604 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="470" y="172" width="90" height="36" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="515" y="195" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="600">Phone 3</text>
<path d="M560 190 L604 147" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="608" y="120" width="110" height="56" rx="10" fill="#f2efe8" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="663" y="144" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">Trusted</text>
<text x="663" y="162" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">curator</text>
<path d="M718 148 H736" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<rect x="740" y="134" width="54" height="28" rx="6" fill="#b7791f"/>
<text x="767" y="153" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">noise</text>
<path d="M794 148 H812" fill="none" stroke="#1c2230" stroke-width="1.2" marker-end="url(#m0)"/>
<text x="838" y="152" font-size="10.5" fill="#1c2230" text-anchor="middle" font-weight="700">result</text>
<text x="470" y="238" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">A better balance of privacy and accuracy</text>
</svg>
