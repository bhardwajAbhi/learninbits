<text x="218.96" y="56" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="600">APK signing</text>
<rect x="277.92" y="36" width="158.4" height="30" rx="15" fill="#fff" stroke="#2f62c8" stroke-width="1.2"/>
<text x="357.12" y="56" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="600">Declared permissions</text>
<rect x="446.32" y="36" width="124.8" height="30" rx="15" fill="#fff" stroke="#2f62c8" stroke-width="1.2"/>
<text x="508.72" y="56" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="600">Per-app sandbox</text>
<rect x="20" y="90" width="840" height="54" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="40" y="123" font-size="14" fill="#0b6650" text-anchor="start" font-weight="700">Framework</text>
<rect x="170" y="102" width="151.68" height="30" rx="15" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="245.84" y="122" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">Runtime permissions</text>
<rect x="331.68" y="102" width="84.48" height="30" rx="15" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="373.92" y="122" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">Keystore2</text>
<rect x="426.16" y="102" width="91.2" height="30" rx="15" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
