<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of Example 2 flows</title>
  <desc id="d">Setup, llm = ChatOpenRouter(model=&quot;qwen/qwen-2.5-7b-instruct&quot;, ...), temperature=0, so that the same fact gets the same check result. Draft, generate_chain.invoke({&quot;question&quot; question}), A question about Heartbleed, its CVE, date, versions, cause and leak size. List, extract_chain.invoke({&quot;response&quot; initial_response}), One fact per line, split into a Python list. Check, verify_chain.invoke({&quot;claim&quot; claim}), Each fact alone, VERIFIED, INCORRECT or UNCERTAIN. Decide, if &quot;INCORRECT&quot; in verification_text, Otherwise keep the first answer. Fix, revise_chain.invoke({...}), The final answer, built from the first answer and the check results. A loop goes back from stage 4 to stage 4, next fact.</desc>
