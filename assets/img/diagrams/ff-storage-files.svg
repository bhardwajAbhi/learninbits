<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the four storage files find the value of one flag</title>
  <desc id="d">An example lookup of the flag dump_improvements in the package android.provider.flags, with example numbers. Step one, the package_map hash table gives package_id 3, start index 120 and the fingerprint. Step two, the flag_map hash table gives flag_index 2 and the type ReadWriteBoolean for the pair of package 3 and the flag name. The offset is 120 plus 2, that is 122. Step three, the flag_val file holds one byte for each flag, and the byte at offset 122 holds the value. The flag_info file holds bit flags for the same index, namely HasServerOverride, IsReadWrite and HasLocalOverride.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="440" y="30" font-size="13.5" fill="#1c2230" text-anchor="middle" font-weight="700">An example lookup of android.provider.flags / dump_improvements</text>
<rect x="24" y="56" width="260" height="144" rx="12" fill="#1f2633"/>
<path d="M36 56 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="40" y="79" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">package_map</text>
<text x="40" y="112" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">android.provider.flags</text>
<text x="40" y="130" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  package_id   3</text>
<text x="40" y="148" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  start_index  120</text>
<text x="40" y="166" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  fingerprint  SipHash13</text>
<text x="40" y="184" font-size="11.8" fill="#9aa6b8" text-anchor="start" font-family="JetBrains Mono, monospace">// hash table of packages</text>
<rect x="310" y="56" width="260" height="144" rx="12" fill="#1f2633"/>
<path d="M322 56 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#7a4fc2"/>
<text x="326" y="79" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">flag_map</text>
<text x="326" y="112" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">(3, dump_improvements)</text>
<text x="326" y="130" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  flag_index  2</text>
<text x="326" y="148" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  flag_type</text>
<text x="326" y="166" font-size="11.8" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  ReadWriteBoolean</text>
<text x="326" y="184" font-size="11.8" fill="#9aa6b8" text-anchor="start" font-family="JetBrains Mono, monospace">// hash table of flags</text>
<path d="M284 120 L 306 120" fill="none" stroke="#2f62c8" stroke-width="2" marker-end="url(#m3)"/>
<circle cx="295" cy="104" r="10" fill="#2f62c8"/>
<text x="295" y="107.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="596" y="56" width="260" height="144" rx="12" fill="#fbfaf6" stroke="#d9d4c7" stroke-width="1.2"/>
<text x="612" y="84" font-size="14" fill="#1c2230" text-anchor="start" font-weight="700">The offset</text>
<text x="612" y="116" font-size="15" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">120 + 2 = 122</text>
<text x="612" y="146" font-size="12.3" fill="#4a5263" text-anchor="start">start_index of the package</text>
<text x="612" y="164" font-size="12.3" fill="#4a5263" text-anchor="start">plus flag_index of the flag.</text>
<text x="612" y="182" font-size="12.3" fill="#4a5263" text-anchor="start">flag_info uses the same index.</text>
<path d="M570 120 L 592 120" fill="none" stroke="#7a4fc2" stroke-width="2" marker-end="url(#m5)"/>
<circle cx="581" cy="104" r="10" fill="#7a4fc2"/>
<text x="581" y="107.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="24" y="260" font-size="14" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">flag_val</text>
<text x="110" y="260" font-size="12.3" fill="#4a5263" text-anchor="start">one byte for each flag, so a read needs no bit shifts</text>
<rect x="24" y="274" width="64" height="52" rx="8" fill="#fff" stroke="#d9d4c7" stroke-width="1.4"/>
<text x="56" y="298" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">0</text>
<text x="56" y="317" font-size="10.5" fill="#7b8292" text-anchor="middle" font-family="JetBrains Mono, monospace">116</text>
