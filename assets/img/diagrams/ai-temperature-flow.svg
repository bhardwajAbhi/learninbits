<rect x="20" y="140" width="200" height="96" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<text x="36" y="167" font-size="14" fill="#3f4a59" text-anchor="start" font-weight="700">One prompt</text>
<text x="36" y="190" font-size="11.8" fill="#4a5263" text-anchor="start">A one-sentence security</text>
<text x="36" y="208" font-size="11.8" fill="#4a5263" text-anchor="start">message about phishing</text>
<path d="M220 188 C 250 188, 250 74, 280 74" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<rect x="284" y="30" width="210" height="88" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.7"/>
<text x="300" y="57" font-size="14" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">llm_zero</text>
<text x="300" y="80" font-size="11.8" fill="#4a5263" text-anchor="start">temperature=0</text>
<text x="300" y="98" font-size="11.8" fill="#4a5263" text-anchor="start">max 64 output tokens</text>
<path d="M494 74 L 530 74" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
