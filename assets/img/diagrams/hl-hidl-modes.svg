<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two modes of a HIDL HAL</title>
  <desc id="d">Left, binderized mode. The framework process calls IFoo through a proxy. The call goes through /dev/hwbinder, where hwservicemanager finds the HAL. The HAL process has its own SELinux domain and its own UID. Right, passthrough mode. The framework process calls IFoo directly, through a generated passthrough wrapper in the same process, which calls a legacy shared library loaded with dlopen. All three are in one process.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="400" height="300" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<text x="220" y="46" font-size="13.5" fill="#8a5a12" text-anchor="middle" font-weight="700">Binderized</text>
<rect x="60" y="66" width="320" height="56" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="220" y="91" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Framework process</text>
<text x="220" y="109" font-size="11" fill="#4a5263" text-anchor="middle">calls IFoo through a proxy</text>
<path d="M220 124 L 220 144" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="60" y="146" width="320" height="56" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.4"/>
<text x="220" y="171" font-size="12.6" fill="#963f1f" text-anchor="middle" font-weight="700">/dev/hwbinder</text>
<text x="220" y="189" font-size="11" fill="#4a5263" text-anchor="middle">hwservicemanager finds the HAL</text>
<path d="M220 204 L 220 224" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="60" y="226" width="320" height="56" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="220" y="251" font-size="12.6" fill="#7d2a55" text-anchor="middle" font-weight="700">HAL process</text>
<text x="220" y="269" font-size="11" fill="#4a5263" text-anchor="middle">own SELinux domain, own UID</text>
<rect x="460" y="20" width="400" height="300" rx="14" fill="#fff" stroke="#5d6b7e" stroke-width="1.6"/>
<text x="660" y="46" font-size="13.5" fill="#3f4a59" text-anchor="middle" font-weight="700">Passthrough</text>
<rect x="500" y="66" width="320" height="56" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="660" y="91" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Framework process</text>
<text x="660" y="109" font-size="11" fill="#4a5263" text-anchor="middle">calls IFoo directly</text>
<path d="M660 124 L 660 144" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="500" y="146" width="320" height="56" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="660" y="171" font-size="12.6" fill="#8a5a12" text-anchor="middle" font-weight="700">Passthrough wrapper</text>
<text x="660" y="189" font-size="11" fill="#4a5263" text-anchor="middle">generated Bs class, same process</text>
<path d="M660 204 L 660 224" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="500" y="226" width="320" height="56" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="660" y="251" font-size="12.6" fill="#7d2a55" text-anchor="middle" font-weight="700">Legacy .so</text>
<text x="660" y="269" font-size="11" fill="#4a5263" text-anchor="middle">loaded with dlopen()</text>
<rect x="488" y="56" width="344" height="236" rx="10" fill="none" stroke="#2f62c8" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="660" y="308" font-size="10.8" fill="#1f4a9e" text-anchor="middle" font-weight="700">all in one process</text>
</svg>
