<path d="M544 140 L 590 140" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="594" y="100" width="266" height="80" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="610" y="128" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">Perfetto trace</text>
<text x="610" y="150" font-size="11.2" fill="#4a5263" text-anchor="start">protobuf file, opened in</text>
<text x="610" y="166" font-size="11.2" fill="#4a5263" text-anchor="start">the Perfetto UI</text>
<rect x="594" y="206" width="266" height="50" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.3"/>
<text x="610" y="230" font-size="12.4" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">simpleperf</text>
<text x="610" y="246" font-size="10.8" fill="#4a5263" text-anchor="start">CPU profiles and flame graphs</text>
</svg>
