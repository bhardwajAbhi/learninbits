<rect x="126" y="291" width="680" height="65" rx="12" fill="#fff" stroke="#0e7c86" stroke-width="1.6"/>
<rect x="126" y="291" width="6" height="65" rx="3" fill="#0e7c86"/>
<text x="146" y="319" font-size="13.6" fill="#095a61" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">RunnablePassthrough.assign(revised=revise_chain)</text>
<text x="146" y="341" font-size="12.2" fill="#4a5263" text-anchor="start">Adds revised and keeps every earlier key</text>
<path d="M466 358 L 466 376" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
