<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 594" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one call of the zero-shot chain in Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, sentiment_prompt, llm, Gemini API, parser. Step 1, Your code to sentiment_prompt, chain.invoke({&quot;review&quot; review}), the chain starts with the template. Step 2, sentiment_prompt to sentiment_prompt, Fill {review}, one human message with the task, the item and the cue. Step 3, sentiment_prompt to llm, Prompt value, the filled messages go to the model. Step 4, llm to Gemini API, HTTPS request with the API key, temperature 0. Step 5, Gemini API to llm, One label, for example NEGATIVE. Step 6, llm to parser, AIMessage, the chain passes the reply to the parser. Step 7, parser to parser, Keep the text, StrOutputParser returns a string. Step 8, parser to Your code, The result, the code prints it with strip(). Steps 1 to 8 repeat, Repeated for each of the 5 items.</desc>
