<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 554" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of chapter 7 flows</title>
  <desc id="d">Chain 1, audit_chain = audit_prompt | llm | JsonOutputParser(), Finds the sensitive data in the logs and returns a dictionary. Chain 2, report_chain = report_prompt | llm, Two slots, {findings} and {compliance}. Join, audit_chain | (lambda findings {...}) | report_chain, The lambda adds the selected standard to the findings. Form, st.text_area and st.selectbox, The logs and one of GDPR, DPDP, HIPAA or PCI DSS. Call, compliance_check_chain.invoke({&quot;logs&quot; logs}), Runs after a click on Analyze. Page, st.write(response.content), The Privacy Assessment Report.</desc>
