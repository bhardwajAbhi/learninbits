<rect x="466" y="21" width="88.8" height="26" rx="13" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="510.4" y="38.5" font-size="12.5" fill="#0b6650" text-anchor="middle" font-weight="700">With GKI</text>
<rect x="560" y="64" width="190" height="54" rx="10" fill="#0f8a6a"/>
<text x="655" y="88" font-size="12.6" fill="#fff" text-anchor="middle" font-weight="700">One GKI core kernel</text>
<text x="655" y="106" font-size="11" fill="#ffffffdd" text-anchor="middle">built by Google</text>
<rect x="480" y="134" width="350" height="30" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.3"/>
<text x="655" y="154" font-size="11.8" fill="#8a5a12" text-anchor="middle" font-weight="700">Stable Kernel Module Interface (KMI)</text>
