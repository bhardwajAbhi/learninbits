<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How temperature changes the choice of the next word</title>
  <desc id="d">Example numbers for the next word after Always pause and verify the sender&#x27;s. At temperature 0, the top word address always wins with 100 percent. At temperature 0.7, address has 70 percent, identity 17, email 9 and details 4, so the top word wins most often. At temperature 1.5, address has 45 percent, identity 23, email 18, details 12 and even banana 2, so weak words get a real chance.</desc>
