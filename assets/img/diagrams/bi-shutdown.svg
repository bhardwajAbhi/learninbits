<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How init shuts down the device</title>
  <desc id="d">Two threads at the top. On the property thread, setprop sys.powerctl reboot,recovery makes PropertyChanged call TriggerShutdown, which stores the command under a lock and wakes init. On the main thread, CheckShutdown at the top of the loop takes the command once, and HandlePowerctlMessage runs the shutdown sequence. The steps descend from left to right. The shutdown trigger runs actions in rc files. SIGTERM goes to services, critical ones last. init waits with a time limit, sends SIGKILL to the rest, unmounts file systems, calls sync to flush buffers and finally calls reboot. Services with shutdown critical stop last, so their final writes can finish.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="24" width="400" height="120" rx="12" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.3"/>
<text x="36" y="48" font-size="13" fill="#58378f" text-anchor="start" font-weight="700">Property thread</text>
<text x="36" y="72" font-size="11.4" fill="#4a5263" text-anchor="start">setprop sys.powerctl reboot,recovery</text>
<text x="36" y="89" font-size="11.4" fill="#4a5263" text-anchor="start">PropertyChanged() calls</text>
<text x="36" y="106" font-size="11.4" fill="#4a5263" text-anchor="start">TriggerShutdown(), which stores the</text>
<text x="36" y="123" font-size="11.4" fill="#4a5263" text-anchor="start">command under a lock and wakes init.</text>
<rect x="460" y="24" width="400" height="120" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.3"/>
<text x="476" y="48" font-size="13" fill="#8a5a12" text-anchor="start" font-weight="700">Main thread</text>
<text x="476" y="72" font-size="11.4" fill="#4a5263" text-anchor="start">CheckShutdown() at the top of the</text>
<text x="476" y="89" font-size="11.4" fill="#4a5263" text-anchor="start">loop takes the command once, then</text>
<text x="476" y="106" font-size="11.4" fill="#4a5263" text-anchor="start">HandlePowerctlMessage() runs the</text>
<text x="476" y="123" font-size="11.4" fill="#4a5263" text-anchor="start">shutdown sequence.</text>
<path d="M420 84 L 456 84" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="20" y="180" width="112" height="62" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.5"/>
<text x="76" y="206" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="700">shutdown</text>
<text x="76" y="226" font-size="10.6" fill="#4a5263" text-anchor="middle">Trigger in rc files</text>
<path d="M132 211 L 140 233" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="142" y="202" width="112" height="62" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.5"/>
<text x="198" y="228" font-size="12" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">SIGTERM</text>
<text x="198" y="248" font-size="10.6" fill="#4a5263" text-anchor="middle">Critical ones last</text>
<path d="M254 233 L 262 255" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="264" y="224" width="112" height="62" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="320" y="250" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="700">Wait</text>
<text x="320" y="270" font-size="10.6" fill="#4a5263" text-anchor="middle">With a time limit</text>
<path d="M376 255 L 384 277" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="386" y="246" width="112" height="62" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.5"/>
<text x="442" y="272" font-size="12" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">SIGKILL</text>
<text x="442" y="292" font-size="10.6" fill="#4a5263" text-anchor="middle">To the rest</text>
<path d="M498 277 L 506 299" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="508" y="268" width="112" height="62" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="564" y="294" font-size="12" fill="#3f4a59" text-anchor="middle" font-weight="700">Unmount</text>
<text x="564" y="314" font-size="10.6" fill="#4a5263" text-anchor="middle">File systems</text>
<path d="M620 299 L 628 321" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="630" y="290" width="112" height="62" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="686" y="316" font-size="12" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">sync()</text>
<text x="686" y="336" font-size="10.6" fill="#4a5263" text-anchor="middle">Flush buffers</text>
<path d="M742 321 L 750 343" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="752" y="312" width="112" height="62" rx="10" fill="#1c2230" stroke="#1c2230" stroke-width="1.5"/>
<text x="808" y="338" font-size="12" fill="#fff" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">reboot()</text>
<text x="808" y="358" font-size="10.6" fill="#ffffffcc" text-anchor="middle">System call</text>
<path d="M660 144 L 660 160 L 76 160 L 76 176" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="440" y="420" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">Services with shutdown critical stop last, so their final writes can finish.</text>
</svg>
