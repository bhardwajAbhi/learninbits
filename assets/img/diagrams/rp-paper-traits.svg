<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six traits of a research paper</title>
  <desc id="d">A research paper in the center with six traits around it. It is formal and structured, built on existing work, offers new insight, has validated claims, is peer reviewed and shares knowledge.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<circle cx="440" cy="250" r="86" fill="#1c2230"/>
<text x="440" y="244" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">A research</text>
<text x="440" y="268" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">paper</text>
<rect x="24" y="30" width="280" height="116" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<rect x="24" y="30" width="7" height="116" rx="3" fill="#2f62c8"/>
<text x="48" y="64" font-size="15.5" fill="#1f4a9e" text-anchor="start" font-weight="700">Formal and structured</text>
<text x="48" y="90" font-size="13.5" fill="#4a5263" text-anchor="start">A real technical problem,</text>
<text x="48" y="110" font-size="13.5" fill="#4a5263" text-anchor="start">in a standard format</text>
<line x1="304" y1="88" x2="360" y2="210" stroke="#2f62c8" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="24" y="182" width="280" height="116" rx="14" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<rect x="24" y="182" width="7" height="116" rx="3" fill="#7a4fc2"/>
<text x="48" y="216" font-size="15.5" fill="#58378f" text-anchor="start" font-weight="700">Built on existing work</text>
<text x="48" y="242" font-size="13.5" fill="#4a5263" text-anchor="start">Reviews prior studies and</text>
<text x="48" y="262" font-size="13.5" fill="#4a5263" text-anchor="start">credits them by citation</text>
<line x1="304" y1="240" x2="360" y2="250" stroke="#7a4fc2" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="24" y="334" width="280" height="116" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<rect x="24" y="334" width="7" height="116" rx="3" fill="#0f8a6a"/>
<text x="48" y="368" font-size="15.5" fill="#0b6650" text-anchor="start" font-weight="700">New insight</text>
<text x="48" y="394" font-size="13.5" fill="#4a5263" text-anchor="start">A solution, an improvement</text>
<text x="48" y="414" font-size="13.5" fill="#4a5263" text-anchor="start">or a new perspective</text>
<line x1="304" y1="392" x2="360" y2="290" stroke="#0f8a6a" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="576" y="30" width="280" height="116" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<rect x="576" y="30" width="7" height="116" rx="3" fill="#b7791f"/>
<text x="600" y="64" font-size="15.5" fill="#8a5a12" text-anchor="start" font-weight="700">Validated claims</text>
<text x="600" y="90" font-size="13.5" fill="#4a5263" text-anchor="start">Data, experiments, analysis</text>
<text x="600" y="110" font-size="13.5" fill="#4a5263" text-anchor="start">or mathematical proof</text>
<line x1="576" y1="88" x2="520" y2="210" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="576" y="182" width="280" height="116" rx="14" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<rect x="576" y="182" width="7" height="116" rx="3" fill="#c2552d"/>
<text x="600" y="216" font-size="15.5" fill="#963f1f" text-anchor="start" font-weight="700">Peer reviewed</text>
<text x="600" y="242" font-size="13.5" fill="#4a5263" text-anchor="start">Experts check quality</text>
<text x="600" y="262" font-size="13.5" fill="#4a5263" text-anchor="start">before acceptance</text>
<line x1="576" y1="240" x2="520" y2="250" stroke="#c2552d" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="576" y="334" width="280" height="116" rx="14" fill="#fff" stroke="#5d6b7e" stroke-width="1.8"/>
<rect x="576" y="334" width="7" height="116" rx="3" fill="#5d6b7e"/>
<text x="600" y="368" font-size="15.5" fill="#3f4a59" text-anchor="start" font-weight="700">Shared knowledge</text>
<text x="600" y="394" font-size="13.5" fill="#4a5263" text-anchor="start">Others can build on</text>
<text x="600" y="414" font-size="13.5" fill="#4a5263" text-anchor="start">the findings</text>
<line x1="576" y1="392" x2="520" y2="290" stroke="#5d6b7e" stroke-width="1.6" stroke-dasharray="5 5"/>
</svg>
