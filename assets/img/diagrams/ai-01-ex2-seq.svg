<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 608" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the two calls of Example 2</title>
  <desc id="d">A sequence diagram with the lanes Your code, llm, short_model, OpenRouter API. Step 1, Your code to Your code, load_dotenv(), OPENROUTER_API_KEY goes into the environment. Step 2, Your code to llm, invoke(&quot;What is the capital of France?&quot;), a plain string becomes one human message. Step 3, llm to OpenRouter API, HTTPS request with the API key, temperature 0, at most 128 output tokens. Step 4, OpenRouter API to llm, Reply with the answer, 36 input, 8 output tokens. Step 5, llm to Your code, AIMessage, the code prints content and usage_metadata. Step 6, Your code to short_model, invoke(&quot;Tell me a very long story ...&quot;), the second model object. Step 7, short_model to OpenRouter API, HTTPS request, at most 5 output tokens. Step 8, OpenRouter API to short_model, The model stops at the limit, finish_reason length. Step 9, short_model to Your code, AIMessage with a cut answer, content “The history of the universe”.</desc>
