<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the generated code differs in Java, C++ and Rust</title>
  <desc id="d">A table with Java, C++ and Rust as columns. For a fixed read-only flag, the Java getter returns a constant with an R8 annotation, C++ uses a constexpr inline function that returns a macro value, and Rust returns a literal. For a read-write flag, Java FeatureFlagsImpl reads storage once and keeps the value, C++ asks the provider_ object and Rust asks the PROVIDER, which read the storage files. In test mode, Java tests inject FakeFeatureFlagsImpl, C++ gets a setter for each flag and reset_flags, and Rust uses a Mutex provider with set functions and reset_flags.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="176" y="20" width="216" height="62" rx="12" fill="#2f62c8"/>
<text x="284" y="46" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Java</text>
<text x="284" y="68" font-size="11.5" fill="#ffffffdd" text-anchor="middle" font-family="JetBrains Mono, monospace">java_aconfig_library</text>
<rect x="404" y="20" width="216" height="62" rx="12" fill="#0f8a6a"/>
<text x="512" y="46" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">C++</text>
<text x="512" y="68" font-size="11.5" fill="#ffffffdd" text-anchor="middle" font-family="JetBrains Mono, monospace">cc_aconfig_library</text>
<rect x="632" y="20" width="216" height="62" rx="12" fill="#7a4fc2"/>
<text x="740" y="46" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Rust</text>
<text x="740" y="68" font-size="11.5" fill="#ffffffdd" text-anchor="middle" font-family="JetBrains Mono, monospace">rust_aconfig_library</text>
<rect x="20" y="96" width="144" height="100" rx="12" fill="#f2efe8"/>
<text x="36" y="140" font-size="13.5" fill="#1c2230" text-anchor="start" font-weight="700">Fixed</text>
<text x="36" y="159" font-size="13.5" fill="#1c2230" text-anchor="start" font-weight="700">read-only flag</text>
<rect x="176" y="96" width="216" height="100" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.4"/>
<text x="190" y="126" font-size="12.3" fill="#1c2230" text-anchor="start">Getter returns a constant.</text>
<text x="190" y="145" font-size="12.3" fill="#4a5263" text-anchor="start">An R8 annotation lets the</text>
<text x="190" y="164" font-size="12.3" fill="#4a5263" text-anchor="start">optimizer drop dead code.</text>
<rect x="404" y="96" width="216" height="100" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="418" y="126" font-size="12.3" fill="#1c2230" text-anchor="start">constexpr inline function</text>
<text x="418" y="145" font-size="12.3" fill="#4a5263" text-anchor="start">returns a macro value.</text>
<text x="418" y="164" font-size="12.3" fill="#4a5263" text-anchor="start">The compiler drops dead code.</text>
<rect x="632" y="96" width="216" height="100" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="646" y="126" font-size="12.3" fill="#1c2230" text-anchor="start">Function returns a literal</text>
<text x="646" y="145" font-size="12.3" fill="#4a5263" text-anchor="start">true or false.</text>
<rect x="20" y="208" width="144" height="100" rx="12" fill="#f2efe8"/>
<text x="36" y="252" font-size="13.5" fill="#1c2230" text-anchor="start" font-weight="700">Read-write</text>
<text x="36" y="271" font-size="13.5" fill="#1c2230" text-anchor="start" font-weight="700">flag</text>
<rect x="176" y="208" width="216" height="100" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.4"/>
<text x="190" y="238" font-size="12.3" fill="#1c2230" text-anchor="start">FeatureFlagsImpl reads</text>
<text x="190" y="257" font-size="12.3" fill="#4a5263" text-anchor="start">storage once, then keeps</text>
<text x="190" y="276" font-size="12.3" fill="#4a5263" text-anchor="start">the value in a field.</text>
<rect x="404" y="208" width="216" height="100" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="418" y="238" font-size="12.3" fill="#1c2230" text-anchor="start">Inline function asks the</text>
<text x="418" y="257" font-size="12.3" fill="#4a5263" text-anchor="start">provider_ object, which</text>
<text x="418" y="276" font-size="12.3" fill="#4a5263" text-anchor="start">reads the storage files.</text>
<rect x="632" y="208" width="216" height="100" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="646" y="238" font-size="12.3" fill="#1c2230" text-anchor="start">Function asks the PROVIDER,</text>
<text x="646" y="257" font-size="12.3" fill="#4a5263" text-anchor="start">which reads the storage</text>
<text x="646" y="276" font-size="12.3" fill="#4a5263" text-anchor="start">files.</text>
<rect x="20" y="320" width="144" height="100" rx="12" fill="#f2efe8"/>
<text x="36" y="364" font-size="13.5" fill="#1c2230" text-anchor="start" font-weight="700">Test mode</text>
<rect x="176" y="320" width="216" height="100" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.4"/>
<text x="190" y="350" font-size="12.3" fill="#1c2230" text-anchor="start">Impl throws. Tests inject</text>
<text x="190" y="369" font-size="12.3" fill="#4a5263" text-anchor="start">FakeFeatureFlagsImpl</text>
<text x="190" y="388" font-size="12.3" fill="#4a5263" text-anchor="start">through setFeatureFlags().</text>
<rect x="404" y="320" width="216" height="100" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="418" y="350" font-size="12.3" fill="#1c2230" text-anchor="start">A setter for each flag</text>
<text x="418" y="369" font-size="12.3" fill="#4a5263" text-anchor="start">and reset_flags() to</text>
<text x="418" y="388" font-size="12.3" fill="#4a5263" text-anchor="start">clear the values.</text>
<rect x="632" y="320" width="216" height="100" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="646" y="350" font-size="12.3" fill="#1c2230" text-anchor="start">A Mutex provider with</text>
<text x="646" y="369" font-size="12.3" fill="#4a5263" text-anchor="start">set_&lt;flag&gt;() functions</text>
<text x="646" y="388" font-size="12.3" fill="#4a5263" text-anchor="start">and reset_flags().</text>
</svg>
