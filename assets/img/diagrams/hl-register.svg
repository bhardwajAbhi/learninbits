<text x="357.333" y="146" font-size="12" fill="#7d2a55" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">AServiceManager_addService(...)</text>
<text x="357.333" y="170" font-size="11.3" fill="#4a5263" text-anchor="start">name IFoo/default</text>
<path d="M556.667 200 h34 v18 h-30" fill="none" stroke="#7a4fc2" stroke-width="1.6"/>
<path d="M564.667 218 L 558.667 218" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<circle cx="612.667" cy="209" r="10" fill="#7a4fc2"/>
<text x="612.667" y="212.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="628.667" y="213" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">is the name in the VINTF manifest?</text>
<text x="628.667" y="229" font-size="11.3" fill="#4a5263" text-anchor="start">and can this domain add it?</text>
<path d="M552.667 266 L 329.333 266" fill="none" stroke="#7a4fc2" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m5)"/>
<circle cx="341.333" cy="253" r="10" fill="#7a4fc2"/>
<text x="341.333" y="256.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="357.333" y="258" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">STATUS_OK</text>
<text x="357.333" y="282" font-size="11.3" fill="#4a5263" text-anchor="start">or an error if not declared</text>
<path d="M323.333 312 h34 v18 h-30" fill="none" stroke="#b0457a" stroke-width="1.6"/>
<path d="M331.333 330 L 325.333 330" fill="none" stroke="#b0457a" stroke-width="1.6" marker-end="url(#m0)"/>
<circle cx="379.333" cy="321" r="10" fill="#b0457a"/>
<text x="379.333" y="324.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="395.333" y="325" font-size="12" fill="#7d2a55" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">ABinderProcess_joinThreadPool()</text>
<text x="395.333" y="341" font-size="11.3" fill="#4a5263" text-anchor="start">wait for calls</text>
<path d="M786 378 L 562.667 378" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="574.667" cy="365" r="10" fill="#2f62c8"/>
<text x="574.667" y="368.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<text x="590.667" y="370" font-size="12" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">AServiceManager_waitForService(...)</text>
<path d="M560.667 434 L 784 434" fill="none" stroke="#7a4fc2" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m5)"/>
<circle cx="574.667" cy="421" r="10" fill="#7a4fc2"/>
<text x="574.667" y="424.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text>
<text x="590.667" y="426" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">binder of the HAL</text>
<path d="M786 490 L 329.333 490" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="341.333" cy="477" r="10" fill="#2f62c8"/>
<text x="341.333" y="480.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text>
<text x="357.333" y="482" font-size="12" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">setLightState(...)</text>
<text x="357.333" y="506" font-size="11.3" fill="#4a5263" text-anchor="start">a normal Binder call</text>
</svg>
