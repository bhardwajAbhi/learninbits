<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 608" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Reading while init writes</title>
  <desc id="d">A sequence diagram with the lanes init, the writer, prop_info in memory, a reader. Step 1, init, the writer to prop_info in memory, copy the old value to the backup area, readers can still use it. Step 2, init, the writer to prop_info in memory, set the dirty bit in serial, a write is in progress. Step 3, a reader to prop_info in memory, read serial, dirty bit is set. Step 4, prop_info in memory to a reader, old value from the backup area, never a half-written value. Step 5, init, the writer to prop_info in memory, copy the new value. Step 6, init, the writer to prop_info in memory, new serial, dirty bit clear, length and counter updated. Step 7, a reader to prop_info in memory, read serial again, it changed, so read once more. Step 8, prop_info in memory to a reader, new value, serial unchanged, the read is done. Step 9, init, the writer to a reader, futex wake, wake processes that wait for a change.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="15" y="18" width="150" height="42" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="90" y="44" font-size="11.8" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">init, the writer</text>
<line x1="90" y1="60" x2="90" y2="592" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="365" y="18" width="150" height="42" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="440" y="44" font-size="11.8" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">prop_info in memory</text>
<line x1="440" y1="60" x2="440" y2="592" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="715" y="18" width="150" height="42" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="790" y="44" font-size="11.8" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">a reader</text>
<line x1="790" y1="60" x2="790" y2="592" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<path d="M94 98 L 434 98" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="108" cy="85" r="10" fill="#2f62c8"/>
<text x="108" y="88.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="124" y="90" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">copy the old value to the backup area</text>
<text x="124" y="114" font-size="11.3" fill="#4a5263" text-anchor="start">readers can still use it</text>
<path d="M94 154 L 434 154" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="108" cy="141" r="10" fill="#2f62c8"/>
<text x="108" y="144.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="124" y="146" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">set the dirty bit in serial</text>
<text x="124" y="170" font-size="11.3" fill="#4a5263" text-anchor="start">a write is in progress</text>
<path d="M786 210 L 446 210" fill="none" stroke="#5d6b7e" stroke-width="1.7" marker-end="url(#m8)"/>
<circle cx="458" cy="197" r="10" fill="#5d6b7e"/>
<text x="458" y="200.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="474" y="202" font-size="12" fill="#3f4a59" text-anchor="start" font-weight="700">read serial</text>
<text x="474" y="226" font-size="11.3" fill="#4a5263" text-anchor="start">dirty bit is set</text>
<path d="M444 266 L 784 266" fill="none" stroke="#0f8a6a" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m4)"/>
<circle cx="458" cy="253" r="10" fill="#0f8a6a"/>
<text x="458" y="256.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="474" y="258" font-size="12" fill="#0b6650" text-anchor="start" font-weight="700">old value from the backup area</text>
<text x="474" y="282" font-size="11.3" fill="#4a5263" text-anchor="start">never a half-written value</text>
<path d="M94 322 L 434 322" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="108" cy="309" r="10" fill="#2f62c8"/>
<text x="108" y="312.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="124" y="314" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">copy the new value</text>
<path d="M94 378 L 434 378" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="108" cy="365" r="10" fill="#2f62c8"/>
<text x="108" y="368.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<text x="124" y="370" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">new serial, dirty bit clear</text>
<text x="124" y="394" font-size="11.3" fill="#4a5263" text-anchor="start">length and counter updated</text>
<path d="M786 434 L 446 434" fill="none" stroke="#5d6b7e" stroke-width="1.7" marker-end="url(#m8)"/>
<circle cx="458" cy="421" r="10" fill="#5d6b7e"/>
<text x="458" y="424.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text>
<text x="474" y="426" font-size="12" fill="#3f4a59" text-anchor="start" font-weight="700">read serial again</text>
<text x="474" y="450" font-size="11.3" fill="#4a5263" text-anchor="start">it changed, so read once more</text>
<path d="M444 490 L 784 490" fill="none" stroke="#0f8a6a" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m4)"/>
<circle cx="458" cy="477" r="10" fill="#0f8a6a"/>
<text x="458" y="480.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text>
<text x="474" y="482" font-size="12" fill="#0b6650" text-anchor="start" font-weight="700">new value</text>
<text x="474" y="506" font-size="11.3" fill="#4a5263" text-anchor="start">serial unchanged, the read is done</text>
<path d="M94 546 L 784 546" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<circle cx="108" cy="533" r="10" fill="#2f62c8"/>
<text x="108" y="536.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">9</text>
<text x="124" y="538" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">futex wake</text>
<text x="124" y="562" font-size="11.3" fill="#4a5263" text-anchor="start">wake processes that wait for a change</text>
</svg>
