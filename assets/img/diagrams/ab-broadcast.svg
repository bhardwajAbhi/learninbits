<text x="115" y="100" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Your app</text>
<text x="115" y="146" font-size="11" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">sendBroadcast(intent)</text>
<text x="115" y="164" font-size="11" fill="#4a5263" text-anchor="middle">with the user token</text>
