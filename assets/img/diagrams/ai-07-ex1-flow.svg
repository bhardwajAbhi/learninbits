<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the privacy policy analysis of Example 1 flows</title>
  <desc id="d">Schema, class PrivacyPolicyAnalysis(BaseModel), app_name, data_practices, third_party_sharing, retention_periods, user_controls, security_measures, privacy_concerns, overall_transparency (LOW, MEDIUM, HIGH), summary, data_practices holds DataCollectionPractice objects. Parser, parser = JsonOutputParser(pydantic_object=...), get_format_instructions() writes the JSON schema as text. Template, privacy_policy_prompt, 5 rules, then {format_instructions} and {privacy_policy}. Data, privacy_policy, The QuickRide policy, about 60 lines. Model, llm = ChatGoogleGenerativeAI(model=&quot;gemini-3.1-flash-lite&quot;, temperature=0), Writes one JSON object. Parser, JsonOutputParser, Turns the JSON text into a Python dict, without validation. Output, result[&#x27;app_name&#x27;], for practice in result[&#x27;data_practices&#x27;], QuickRide, transparency MEDIUM, 5 data categories, 4 concerns.</desc>
