<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A tree of name parts</title>
  <desc id="d">Property names are split at each dot, and each part becomes a node in a tree. Under the root are debug, persist, ro and sys, and siblings at one level form a binary search tree. Under ro are boot, build and product. Under build are fingerprint and type. The node type points to a prop_info that holds ro.build.type equals user. To find ro.build.type, the reader finds ro under the root, build under ro and type under build, then reads its prop_info.</desc>
