<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fully homomorphic encryption and a credit score on locked data</title>
  <desc id="d">The applicant, the bank and the credit bureau send encrypted data to a cloud service provider. The provider computes the credit score on the encrypted data and sends back an encrypted score. Each party decrypts it with its own key. The provider never sees the data or the result.</desc>
