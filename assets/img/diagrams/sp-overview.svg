<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 334" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Many readers, one writer</title>
  <desc id="d">Apps, native daemons and the shell read properties directly from shared memory under /dev/__properties__, with no inter-process communication. Examples of values there are ro.build.fingerprint, persist.sys.locale and sys.boot_completed. To change a value, they send a set request through the property_service Unix socket. SELinux checks the request, and init, process 1, is the only process that writes to the shared memory.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="180" height="62" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="110" y="58" font-size="12.8" fill="#3f4a59" text-anchor="middle" font-weight="700">App</text>
<text x="110" y="76" font-size="11" fill="#4a5263" text-anchor="middle">Java or Kotlin</text>
<rect x="20" y="116" width="180" height="62" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="110" y="144" font-size="12.8" fill="#3f4a59" text-anchor="middle" font-weight="700">Native daemon</text>
<text x="110" y="162" font-size="11" fill="#4a5263" text-anchor="middle">C, C++ or Rust</text>
<rect x="20" y="202" width="180" height="62" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="110" y="230" font-size="12.8" fill="#3f4a59" text-anchor="middle" font-weight="700">Shell</text>
<text x="110" y="248" font-size="11" fill="#4a5263" text-anchor="middle">getprop, setprop</text>
<rect x="330" y="60" width="230" height="200" rx="14" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="445" y="92" font-size="13.4" fill="#0b6650" text-anchor="middle" font-weight="700">Shared memory</text>
<text x="445" y="112" font-size="11.4" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">/dev/__properties__/</text>
<rect x="350" y="128" width="190" height="28" rx="7" fill="#fff" stroke="#0f8a6a" stroke-width="1"/>
<text x="445" y="147" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">ro.build.fingerprint</text>
<rect x="350" y="166" width="190" height="28" rx="7" fill="#fff" stroke="#0f8a6a" stroke-width="1"/>
<text x="445" y="185" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">persist.sys.locale</text>
<rect x="350" y="204" width="190" height="28" rx="7" fill="#fff" stroke="#0f8a6a" stroke-width="1"/>
<text x="445" y="223" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">sys.boot_completed</text>
<path d="M202 61 C 260 61, 270 140, 326 140" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<path d="M202 147 C 260 147, 270 160, 326 160" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<path d="M202 233 C 260 233, 270 180, 326 180" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<text x="262" y="26" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="700">read, no IPC</text>
<rect x="660" y="60" width="200" height="80" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="760" y="97" font-size="12.8" fill="#1f4a9e" text-anchor="middle" font-weight="700">init (PID 1)</text>
<text x="760" y="115" font-size="11" fill="#4a5263" text-anchor="middle">the only writer</text>
<rect x="660" y="180" width="200" height="70" rx="10" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="760" y="212" font-size="12.8" fill="#58378f" text-anchor="middle" font-weight="700">property_service</text>
<text x="760" y="230" font-size="11" fill="#4a5263" text-anchor="middle">a Unix socket</text>
<path d="M760 178 L 760 142" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M658 100 L 562 120" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<text x="612" y="96" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-weight="700">write</text>
<path d="M110 286 V 300 H 760 V 252" fill="none" stroke="#7a4fc2" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M760 258 L 760 252" fill="none" stroke="#7a4fc2" stroke-width="1.5" marker-end="url(#m5)"/>
<text x="440" y="318" font-size="11.4" fill="#58378f" text-anchor="middle" font-weight="700">set request, checked by SELinux</text>
</svg>
