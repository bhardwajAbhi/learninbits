<text x="146" y="516" font-size="13.6" fill="#0b6650" text-anchor="start" font-weight="700">FINAL ANSWER, CONFIDENCE and VOTE DISTRIBUTION</text>
<text x="146" y="538" font-size="12.2" fill="#4a5263" text-anchor="start">SUSPICIOUS, with 5 of 5 votes in the real run</text>
