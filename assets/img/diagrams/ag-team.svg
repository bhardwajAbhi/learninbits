<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A team of agents with roles and shared memory</title>
  <desc id="d">A leader sets the goal and splits the work among three workers. One worker writes the code, one searches the web and one runs the tools. A critic checks their work, finds errors and sends the errors back to the workers. Below them is a shared memory, kept by a memory keeper, so that a lesson that one agent learns helps the others. Each message from one agent is the input of the next agent.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="330" y="20" width="220" height="56" rx="11" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="440" y="45" font-size="13" fill="#58378f" text-anchor="middle" font-weight="700">Leader</text>
<text x="440" y="63" font-size="11.2" fill="#4a5263" text-anchor="middle">sets the goal, splits the work</text>
<rect x="60" y="120" width="220" height="56" rx="11" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="170" y="145" font-size="13" fill="#1f4a9e" text-anchor="middle" font-weight="700">Worker</text>
<text x="170" y="163" font-size="11.2" fill="#4a5263" text-anchor="middle">writes the code</text>
<path d="M440 78 C 440 98, 170 100, 170 118" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="330" y="120" width="220" height="56" rx="11" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="440" y="145" font-size="13" fill="#1f4a9e" text-anchor="middle" font-weight="700">Worker</text>
<text x="440" y="163" font-size="11.2" fill="#4a5263" text-anchor="middle">searches the web</text>
<path d="M440 78 C 440 98, 440 100, 440 118" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="600" y="120" width="220" height="56" rx="11" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="710" y="145" font-size="13" fill="#1f4a9e" text-anchor="middle" font-weight="700">Worker</text>
<text x="710" y="163" font-size="11.2" fill="#4a5263" text-anchor="middle">runs the tools</text>
<path d="M440 78 C 440 98, 710 100, 710 118" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="330" y="216" width="220" height="56" rx="11" fill="#fbecec" stroke="#c2552d" stroke-width="1.5"/>
<text x="440" y="241" font-size="13" fill="#963f1f" text-anchor="middle" font-weight="700">Critic</text>
<text x="440" y="259" font-size="11.2" fill="#4a5263" text-anchor="middle">checks the work, finds errors</text>
<path d="M170 178 C 170 200, 440 196, 440 214" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<path d="M440 178 C 440 200, 440 196, 440 214" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<path d="M710 178 C 710 200, 440 196, 440 214" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<path d="M330 244 C 120 244, 90 210, 120 180" fill="none" stroke="#c2552d" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M124 186 L 118 178" fill="none" stroke="#c2552d" stroke-width="1.4" marker-end="url(#m7)"/>
<text x="92" y="262" font-size="11" fill="#963f1f" text-anchor="start" font-weight="700">sends errors back</text>
<rect x="60" y="300" width="760" height="48" rx="12" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.4"/>
<text x="440" y="322" font-size="12.8" fill="#095a61" text-anchor="middle" font-weight="700">Shared memory</text>
<text x="440" y="340" font-size="11" fill="#4a5263" text-anchor="middle">kept by a memory keeper, so that a lesson one agent learns helps the others</text>
<text x="440" y="376" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic">Each message from one agent is the input of the next agent.</text>
</svg>
