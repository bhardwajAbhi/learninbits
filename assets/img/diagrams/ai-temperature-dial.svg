<text x="608" y="136" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">address</text>
<rect x="678" y="122" width="124" height="20" rx="5" fill="#f3f1ec"/>
<rect x="678" y="122" width="55.8" height="20" rx="5" fill="#c2552d" fill-opacity="0.85"/>
<text x="844" y="137" font-size="12" fill="#963f1f" text-anchor="end" font-weight="700">45%</text>
