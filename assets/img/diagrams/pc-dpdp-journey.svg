<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The DPDP journey of personal data</title>
  <desc id="d">Personal data is collected and processed under the DPDP Act and Rules, with penalties up to 150 and 250 crore rupees. Privacy enhancing technologies make data unrelatable, and then the Act does not apply. The data can then be used for sharing, AI training, archiving, cross-border transfer and research.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="540" height="290" rx="16" fill="#eef3fb"/>
<text x="40" y="46" font-size="11.5" fill="#1f4a9e" text-anchor="start" letter-spacing="1.2" font-weight="700">DPDP ACT AND RULES APPLY</text>
<rect x="670" y="20" width="190" height="290" rx="16" fill="#e3f4ee"/>
<text x="765" y="46" font-size="11.5" fill="#0b6650" text-anchor="middle" letter-spacing="1.1" font-weight="700">THE ACT DOES NOT APPLY</text>
<rect x="40" y="64" width="240" height="170" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<path d="M52 64 h216 a12 12 0 0 1 12 12 v22 h-240 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="54" y="85.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">1  Collection</text>
<text x="54" y="120" font-size="12" fill="#4a5263" text-anchor="start">Notice</text>
<text x="54" y="138.6" font-size="12" fill="#4a5263" text-anchor="start">Consent that is provable,</text>
<text x="54" y="157.2" font-size="12" fill="#4a5263" text-anchor="start">verifiable, limited, withdrawable</text>
<text x="54" y="175.8" font-size="12" fill="#4a5263" text-anchor="start">Privacy risk and DPIA</text>
<text x="54" y="194.4" font-size="12" fill="#4a5263" text-anchor="start">Data principal rights</text>
<rect x="300" y="64" width="240" height="170" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<path d="M312 64 h216 a12 12 0 0 1 12 12 v22 h-240 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="314" y="85.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">2  Processing</text>
<text x="314" y="120" font-size="12" fill="#4a5263" text-anchor="start">Identifiable personal data</text>
<text x="314" y="138.6" font-size="12" fill="#4a5263" text-anchor="start">Only for the specified purpose</text>
<text x="314" y="157.2" font-size="12" fill="#4a5263" text-anchor="start">Security safeguards (Rule 6)</text>
<text x="314" y="175.8" font-size="12" fill="#4a5263" text-anchor="start">Unauthorized use is a breach (Rule 7)</text>
<text x="314" y="194.4" font-size="12" fill="#4a5263" text-anchor="start">Purpose over, so erase (Rule 8)</text>
<rect x="70" y="264" width="180" height="28" rx="14" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="160" y="282.32" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="600">Up to Rs 150 crore</text>
<rect x="330" y="264" width="180" height="28" rx="14" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="420" y="282.32" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="600">Up to Rs 250 crore</text>
<rect x="578" y="100" width="74" height="110" rx="12" fill="#1c2230"/>
<text x="615" y="146" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PETs</text>
<text x="615" y="166" font-size="10.5" fill="#ffffffcc" text-anchor="middle">make data</text>
<text x="615" y="180.49" font-size="10.5" fill="#ffffffcc" text-anchor="middle">unrelatable</text>
<path d="M540 155 H574" fill="none" stroke="#1c2230" stroke-width="2" marker-end="url(#m0)"/>
<path d="M652 155 H684" fill="none" stroke="#1c2230" stroke-width="2" marker-end="url(#m0)"/>
<rect x="688" y="64" width="156" height="170" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<path d="M700 64 h132 a12 12 0 0 1 12 12 v22 h-156 v-22 a12 12 0 0 1 12 -12z" fill="#0f8a6a"/>
<text x="702" y="85.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">3  Free use</text>
<text x="702" y="120" font-size="12" fill="#4a5263" text-anchor="start">Data sharing</text>
<text x="702" y="138.6" font-size="12" fill="#4a5263" text-anchor="start">AI training</text>
<text x="702" y="157.2" font-size="12" fill="#4a5263" text-anchor="start">Archiving</text>
<text x="702" y="175.8" font-size="12" fill="#4a5263" text-anchor="start">Cross-border</text>
<text x="702" y="194.4" font-size="12" fill="#4a5263" text-anchor="start">Research</text>
<rect x="700" y="264" width="132" height="28" rx="14" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="766" y="282.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">No penalty</text>
</svg>
