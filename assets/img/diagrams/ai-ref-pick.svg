<text x="584" y="443" font-size="12.8" fill="#58378f" text-anchor="start" font-weight="700">Tree of thought</text>
<text x="844" y="443" font-size="11.4" fill="#58378f" text-anchor="end" font-weight="600">Chapter 9</text>
<rect x="20" y="470" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="497" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">Parts that depend on each other</text>
<path d="M494 492 L 560 492" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="566" y="470" width="294" height="44" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="584" y="497" font-size="12.8" fill="#1f4a9e" text-anchor="start" font-weight="700">Graph of thought</text>
<text x="844" y="497" font-size="11.4" fill="#1f4a9e" text-anchor="end" font-weight="600">Chapter 10</text>
<rect x="20" y="524" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="551" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">A specific case of a general rule</text>
