<text x="420" y="220" font-size="12" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">post-fs</text>
<text x="420" y="268" font-size="11.2" fill="#4a5263" text-anchor="middle">/system, /vendor ready</text>
<circle cx="580" cy="240" r="11" fill="#fff" stroke="#2f62c8" stroke-width="3"/>
<text x="580" y="220" font-size="12" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">late-fs</text>
<text x="580" y="268" font-size="11.2" fill="#4a5263" text-anchor="middle">mount_all --late</text>
<circle cx="740" cy="240" r="11" fill="#fff" stroke="#c2552d" stroke-width="3"/>
<text x="740" y="220" font-size="12" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">post-fs-data</text>
<text x="740" y="268" font-size="11.2" fill="#4a5263" text-anchor="middle">/data and keys</text>
<circle cx="740" cy="340" r="11" fill="#fff" stroke="#7a4fc2" stroke-width="3"/>
<text x="740" y="370" font-size="12" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">load-bpf-programs</text>
<text x="740" y="388" font-size="11.2" fill="#4a5263" text-anchor="middle">Network programs</text>
<circle cx="580" cy="340" r="11" fill="#fff" stroke="#0f8a6a" stroke-width="3"/>
<text x="580" y="370" font-size="12" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">zygote-start</text>
<text x="580" y="388" font-size="11.2" fill="#4a5263" text-anchor="middle">Waits for odsign</text>
<circle cx="420" cy="340" r="11" fill="#fff" stroke="#5d6b7e" stroke-width="3"/>
<text x="420" y="370" font-size="10.6" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">firmware_mounts_complete</text>
<text x="420" y="388" font-size="11.2" fill="#4a5263" text-anchor="middle">Wakes firmware waiters</text>
<circle cx="260" cy="340" r="11" fill="#fff" stroke="#5d6b7e" stroke-width="3"/>
<text x="260" y="370" font-size="12" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">early-boot</text>
<text x="260" y="388" font-size="11.2" fill="#4a5263" text-anchor="middle">Before boot</text>
<circle cx="100" cy="340" r="11" fill="#fff" stroke="#0f8a6a" stroke-width="3"/>
<text x="100" y="370" font-size="12" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">boot</text>
<text x="100" y="388" font-size="11.2" fill="#4a5263" text-anchor="middle">Classes start</text>
<line x1="111" y1="240" x2="249" y2="240" stroke="#1c2230" stroke-width="4"/>
<line x1="111" y1="340" x2="249" y2="340" stroke="#1c2230" stroke-width="4"/>
<line x1="271" y1="240" x2="409" y2="240" stroke="#1c2230" stroke-width="4"/>
<line x1="271" y1="340" x2="409" y2="340" stroke="#1c2230" stroke-width="4"/>
<line x1="431" y1="240" x2="569" y2="240" stroke="#1c2230" stroke-width="4"/>
<line x1="431" y1="340" x2="569" y2="340" stroke="#1c2230" stroke-width="4"/>
<line x1="591" y1="240" x2="729" y2="240" stroke="#1c2230" stroke-width="4"/>
<line x1="591" y1="340" x2="729" y2="340" stroke="#1c2230" stroke-width="4"/>
<path d="M751 240 C 811 240, 811 340, 751 340" fill="none" stroke="#1c2230" stroke-width="4"/>
<text x="440" y="424" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">init queues each trigger in order. Every action of a trigger runs before the next trigger.</text>
</svg>
