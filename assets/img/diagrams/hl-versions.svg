<rect x="450" y="172" width="410" height="116" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.3"/>
<text x="466" y="196" font-size="12" fill="#963f1f" text-anchor="start" font-weight="700">Never allowed</text>
<text x="466" y="218" font-size="11.2" fill="#1c2230" text-anchor="start">· Remove or rename a method or field</text>
<text x="466" y="236" font-size="11.2" fill="#1c2230" text-anchor="start">· Change the order of methods</text>
<text x="466" y="254" font-size="11.2" fill="#1c2230" text-anchor="start">· Change a type or a direction</text>
<text x="466" y="272" font-size="11.2" fill="#1c2230" text-anchor="start">· Edit a frozen snapshot</text>
