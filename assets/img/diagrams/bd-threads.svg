<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 266" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Binder thread pool of a server</title>
  <desc id="d">A server process has a main binder thread that joins the pool with joinThreadPool true and never times out. Pool threads 1 and 2 are spawned when the driver sends BR_SPAWN_LOOPER, and they can retire when idle. The driver asks for a new thread when all threads are busy and the limit allows one more. setThreadPoolMaxThreadCount sets the limit, and the libbinder default is 15 extra threads. If every thread stays busy for more than 100 milliseconds, libbinder logs that the pool starved.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="840" height="230" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="40" y="46" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">A server process</text>
<rect x="40" y="64" width="248" height="90" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="164" y="88" font-size="12.4" fill="#0b6650" text-anchor="middle" font-weight="700">Main binder thread</text>
<text x="164" y="110" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">joinThreadPool(true)</text>
<text x="164" y="132" font-size="11" fill="#4a5263" text-anchor="middle">never times out</text>
<rect x="308" y="64" width="248" height="90" rx="10" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.3"/>
<text x="432" y="88" font-size="12.4" fill="#095a61" text-anchor="middle" font-weight="700">Pool thread 1</text>
<text x="432" y="110" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">spawned on BR_SPAWN_LOOPER</text>
<text x="432" y="132" font-size="11" fill="#4a5263" text-anchor="middle">can retire when idle</text>
<rect x="576" y="64" width="248" height="90" rx="10" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.3"/>
<text x="700" y="88" font-size="12.4" fill="#095a61" text-anchor="middle" font-weight="700">Pool thread 2</text>
<text x="700" y="110" font-size="10.8" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">spawned on BR_SPAWN_LOOPER</text>
<text x="700" y="132" font-size="11" fill="#4a5263" text-anchor="middle">can retire when idle</text>
<text x="40" y="186" font-size="11.6" fill="#1c2230" text-anchor="start">The driver asks for a new thread when all threads are busy and the limit allows one more.</text>
<text x="40" y="208" font-size="11.6" fill="#1c2230" text-anchor="start">setThreadPoolMaxThreadCount(n) sets the limit. The libbinder default is 15 extra threads.</text>
<text x="40" y="230" font-size="11.6" fill="#1c2230" text-anchor="start">If every thread stays busy for more than 100 ms, libbinder logs that the pool starved.</text>
</svg>
