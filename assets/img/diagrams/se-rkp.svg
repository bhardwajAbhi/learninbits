<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Remote Key Provisioning round trip</title>
  <desc id="d">Four lanes, keystore2, the rkpd app, the KeyMint HAL and TA and the RKP server. The rkpd app calls generateEcdsaP256KeyPair on KeyMint and gets MACed public keys. It calls fetchEekChain on the server and gets the GEEK chain and a challenge. It calls generateCertificateRequestV2 on KeyMint and gets a CSR in CBOR with the DICE chain. It sends the CSR to signCertificates on the server and gets an X.509 chain for each key. It stores the keys in the key pool. Later, keystore2 calls getKey for an app key and receives a pooled key and its chain. The pool refills on a schedule, so a new app key gets a chain without a network round trip.</desc>
