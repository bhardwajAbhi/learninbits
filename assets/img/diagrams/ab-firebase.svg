<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Open Firebase rules compared with rules for each user</title>
  <desc id="d">On the left, open rules set read and write to true. One request from a terminal can read, change or delete the whole database. On the right, rules under users and a user ID allow read and write only when auth.uid equals that ID. A signed-in user reaches only own data, and App Check adds proof that the call comes from your app.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="400" height="162" rx="12" fill="#1f2633"/>
<path d="M32 30 h376 a12 12 0 0 1 12 12 v22 h-400 v-22 a12 12 0 0 1 12 -12z" fill="#c2552d"/>
<text x="36" y="53" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">Open rules</text>
<text x="36" y="86" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">{</text>
<text x="36" y="104" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  &quot;rules&quot;: {</text>
<text x="36" y="122" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    &quot;.read&quot;: true,</text>
<text x="36" y="140" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    &quot;.write&quot;: true</text>
<text x="36" y="158" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  }</text>
<text x="36" y="176" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">}</text>
<rect x="460" y="30" width="400" height="180" rx="12" fill="#1f2633"/>
<path d="M472 30 h376 a12 12 0 0 1 12 12 v22 h-400 v-22 a12 12 0 0 1 12 -12z" fill="#0f8a6a"/>
<text x="476" y="53" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">Rules for each user</text>
<text x="476" y="86" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">{</text>
<text x="476" y="104" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  &quot;rules&quot;: {</text>
<text x="476" y="122" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    &quot;users&quot;: {</text>
<text x="476" y="140" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">      &quot;$uid&quot;: {</text>
<text x="476" y="158" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">        &quot;.read&quot;: &quot;auth.uid === $uid&quot;,</text>
<text x="476" y="176" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">        &quot;.write&quot;: &quot;auth.uid === $uid&quot;</text>
<text x="476" y="194" font-size="11.4" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">} } } }</text>
<rect x="20" y="230" width="400" height="70" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.3"/>
<text x="36" y="256" font-size="11.8" fill="#963f1f" text-anchor="start" font-weight="600">One request from a terminal can read,</text>
<text x="36" y="274" font-size="11.8" fill="#963f1f" text-anchor="start" font-weight="600">change or delete the whole database.</text>
<rect x="460" y="230" width="400" height="70" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="476" y="256" font-size="11.8" fill="#0b6650" text-anchor="start" font-weight="600">A signed-in user reaches only own data.</text>
<text x="476" y="274" font-size="11.8" fill="#0b6650" text-anchor="start" font-weight="600">App Check adds proof that the call is from your app.</text>
</svg>
