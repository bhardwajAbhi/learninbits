<rect x="20" y="250" width="400" height="14" rx="0" fill="#0f8a6a"/>
<text x="36" y="253" font-size="13" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">FirstStageMountAndroid</text>
<text x="36" y="288" font-size="11.4" fill="#4a5263" text-anchor="start">first_stage_mount_android.cpp</text>
<text x="36" y="306" font-size="11.4" fill="#4a5263" text-anchor="start">Logical super partitions, DSU, snapuserd,</text>
<text x="36" y="324" font-size="11.4" fill="#4a5263" text-anchor="start">overlays and dm-verity.</text>
<text x="36" y="342" font-size="11.4" fill="#4a5263" text-anchor="start">Adds the userdata device for apexd.</text>
