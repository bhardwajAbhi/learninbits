<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 762" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one run of Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, self_consistency, chain, Gemini API, vote loops. Step 1, Your code to self_consistency, self_consistency(chain, problem, n_samples=5). Step 2, self_consistency to chain, chain.invoke({&quot;problem&quot; problem}), the same problem in every round. Step 3, chain to Gemini API, Request with the reasoning prompt, temperature=0.7, so each run differs. Step 4, Gemini API to chain, Reply, reasoning, then one FINAL ANSWER line. Step 5, chain to self_consistency, response, a plain string. Step 6, self_consistency to self_consistency, extract_final_answer(response), the cleaned answer, or UNKNOWN. Step 7, self_consistency to self_consistency, answers.append(answer), prints Sample i and the answer. Step 8, self_consistency to vote loops, answers, the list of all five answers. Step 9, vote loops to vote loops, vote_counts[answer] += 1, then the loop with count &gt; highest_count. Step 10, vote loops to self_consistency, winner and its count, confidence = count / n_samples. Step 11, self_consistency to Your code, result, final_answer, confidence and vote_distribution. Steps 2 to 7 repeat, Repeated for each of the 5 samples.</desc>
