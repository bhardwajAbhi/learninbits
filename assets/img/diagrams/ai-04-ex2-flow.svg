<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the persona program of Example 2 flows</title>
  <desc id="d">Setup, llm = ChatOpenRouter(model=&quot;qwen/qwen-2.5-7b-instruct&quot;, temperature=0), One model object for all three personas. Input, question, &quot;Explain how phishing attack works and how users can avoid them.&quot;. Messages, messages_analyst, messages_ciso, messages_teacher, Each list is [SystemMessage(role), HumanMessage(question)], Only the system message changes. Call, llm.invoke(messages_...), Three calls, one for each list. Output, Three answers, Analyst, Attack stages and controls, 61 in, 503 out, CISO, Business risk, but similar to the analyst, 65 in, 503 out, Teacher, Hindi with errors, no story, 129 in, 1,267 out.</desc>
