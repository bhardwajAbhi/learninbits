<text x="146" y="52" font-size="13.6" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">{&quot;question&quot;: question}</text>
<text x="146" y="74" font-size="12.2" fill="#4a5263" text-anchor="start">One key goes in</text>
