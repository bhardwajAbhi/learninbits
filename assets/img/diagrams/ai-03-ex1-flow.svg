<text x="146" y="357" font-size="13.6" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">llm_creative = ChatGoogleGenerativeAI(..., temperature=1.5, max_output_tokens=64)</text>
<text x="146" y="379" font-size="12.2" fill="#4a5263" text-anchor="start">for i in range(3) runs invoke(prompt) three times</text>
