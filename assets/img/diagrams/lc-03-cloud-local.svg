<text x="660" y="104" font-size="13" fill="#1c2230" text-anchor="middle" font-weight="700">Your program</text>
<text x="660" y="123" font-size="11.4" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace">ChatOllama or another chat model class</text>
<path d="M660 137 L 660 162" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="490" y="164" width="340" height="56" rx="10" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.2"/>
<text x="660" y="188" font-size="13" fill="#095a61" text-anchor="middle" font-weight="700">Ollama on your computer</text>
<text x="660" y="207" font-size="11.4" fill="#4a5263" text-anchor="middle">localhost, port 11434</text>
<path d="M660 221 L 660 246" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="490" y="248" width="340" height="56" rx="10" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.2"/>
<text x="660" y="272" font-size="13" fill="#095a61" text-anchor="middle" font-weight="700">gemma:2b on your computer</text>
<text x="660" y="291" font-size="11.4" fill="#4a5263" text-anchor="middle">writes the answer</text>
<text x="660" y="324" font-size="11.6" fill="#095a61" text-anchor="middle" font-weight="600">No API key</text>
<text x="660" y="342" font-size="11.6" fill="#095a61" text-anchor="middle" font-weight="600">Data stays on your computer</text>
<text x="660" y="360" font-size="11.6" fill="#095a61" text-anchor="middle" font-weight="600">Smaller models, slower on a laptop</text>
