<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The parts of the reply object of a model</title>
  <desc id="d">The response is an AIMessage object with four useful parts. content is the answer. Qwen gives a plain string and Gemini 3 gives a list of blocks with text and a signature. text gives only the text of the answer as one string, which helps when the content is a list. usage_metadata gives input_tokens, output_tokens and total_tokens, the size of the call that decides the cost. response_metadata gives details from the provider, for example finish_reason, which is MAX_TOKENS or length when the answer was cut.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="840" height="340" rx="16" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<path d="M32 20 h816 a12 12 0 0 1 12 12 v26 h-840 v-26 a12 12 0 0 1 12 -12z" fill="#7a4fc2"/>
<text x="40" y="46" font-size="15" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">response</text>
<text x="140" y="46" font-size="13" fill="#ffffffdd" text-anchor="start">an AIMessage object</text>
<rect x="40" y="76" width="800" height="58" rx="10" fill="#eef3fb"/>
<rect x="40" y="76" width="6" height="58" rx="3" fill="#2f62c8"/>
<text x="62" y="110" font-size="14" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">.content</text>
<text x="270" y="101" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">The answer. Qwen gives a plain string.</text>
<text x="270" y="120" font-size="12.3" fill="#4a5263" text-anchor="start">Gemini 3 gives a list of blocks with text and a signature.</text>
<rect x="40" y="146" width="800" height="58" rx="10" fill="#e3f4ee"/>
<rect x="40" y="146" width="6" height="58" rx="3" fill="#0f8a6a"/>
<text x="62" y="180" font-size="14" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">.text</text>
<text x="270" y="171" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Only the text of the answer, as one string.</text>
<text x="270" y="190" font-size="12.3" fill="#4a5263" text-anchor="start">Use it when the content can be a list.</text>
<rect x="40" y="216" width="800" height="58" rx="10" fill="#fdf4e3"/>
<rect x="40" y="216" width="6" height="58" rx="3" fill="#b7791f"/>
<text x="62" y="250" font-size="14" fill="#8a5a12" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">.usage_metadata</text>
<text x="270" y="241" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">input_tokens, output_tokens, total_tokens</text>
<text x="270" y="260" font-size="12.3" fill="#4a5263" text-anchor="start">The size of the call, which decides the cost.</text>
<rect x="40" y="286" width="800" height="58" rx="10" fill="#fbecec"/>
<rect x="40" y="286" width="6" height="58" rx="3" fill="#c2552d"/>
<text x="62" y="320" font-size="14" fill="#963f1f" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">.response_metadata</text>
<text x="270" y="311" font-size="12.5" fill="#1c2230" text-anchor="start" font-weight="600">Details from the provider, for example</text>
<text x="270" y="330" font-size="12.3" fill="#4a5263" text-anchor="start">finish_reason (MAX_TOKENS or length when cut).</text>
</svg>
