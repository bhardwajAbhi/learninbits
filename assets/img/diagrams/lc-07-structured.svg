<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Structured data passes from one chain to the next</title>
  <desc id="d">The app logs from the text box go into audit_chain, which finds the sensitive data. The model returns JSON text with a list of findings, each with type, value, activity, widget and severity, and a consent review. JsonOutputParser turns this text into a Python dictionary. A lambda function adds the compliance standard that the user selected in the drop-down list, such as GDPR. The result goes into report_chain, which writes the assessment. The report is shown on the page.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="170" height="70" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="105" y="58" font-size="13" fill="#3f4a59" text-anchor="middle" font-weight="700">App logs</text>
<text x="105" y="78" font-size="11" fill="#4a5263" text-anchor="middle">from the text box</text>
<path d="M192 65 L 222 65" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="226" y="30" width="190" height="70" rx="10" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="321" y="58" font-size="13" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">audit_chain</text>
<text x="321" y="78" font-size="11" fill="#4a5263" text-anchor="middle">finds the sensitive data</text>
<path d="M418 65 L 448 65" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="452" y="20" width="408" height="160" rx="10" fill="#1f2633"/>
<text x="470" y="42" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">{</text>
<text x="470" y="59" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  &quot;findings&quot;: [</text>
<text x="470" y="76" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">    {&quot;type&quot;: &quot;Financial Information&quot;,</text>
<text x="470" y="93" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">     &quot;value&quot;: &quot;...&quot;, &quot;activity&quot;: &quot;...&quot;,</text>
<text x="470" y="110" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">     &quot;widget&quot;: &quot;et_cvv&quot;, &quot;severity&quot;: &quot;High&quot;}</text>
<text x="470" y="127" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  ],</text>
<text x="470" y="144" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">  &quot;consent_review&quot;: {...}</text>
<text x="470" y="161" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">}</text>
<text x="656" y="172" font-size="10.6" fill="#ffffffcc" text-anchor="middle">JsonOutputParser turns this text into a Python dictionary</text>
<path d="M656 182 L 656 212" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="452" y="216" width="408" height="64" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="656" y="240" font-size="11" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">lambda findings: {&quot;findings&quot;: ..., &quot;compliance&quot;: ...}</text>
<text x="656" y="262" font-size="11" fill="#4a5263" text-anchor="middle">adds the standard that the user selected, such as GDPR</text>
<rect x="20" y="216" width="170" height="64" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="105" y="242" font-size="12" fill="#3f4a59" text-anchor="middle" font-weight="700">Compliance standard</text>
<text x="105" y="262" font-size="11" fill="#4a5263" text-anchor="middle">from the drop-down list</text>
<path d="M192 248 L 448 248" fill="none" stroke="#5d6b7e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m8)"/>
<path d="M656 282 L 656 306" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="452" y="310" width="196" height="64" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="550" y="336" font-size="13" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">report_chain</text>
<text x="550" y="356" font-size="11" fill="#4a5263" text-anchor="middle">writes the assessment</text>
<path d="M650 342 L 676 342" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="680" y="310" width="180" height="64" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="770" y="336" font-size="13" fill="#0b6650" text-anchor="middle" font-weight="700">Report</text>
<text x="770" y="356" font-size="11" fill="#4a5263" text-anchor="middle">shown on the page</text>
</svg>
