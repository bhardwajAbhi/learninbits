<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a tree of thought compares three paths</title>
  <desc id="d">A decision, an app that asks for the SMS permission with no feature that needs it, branches into three paths. Path A, flag it as malicious, which is fast but risky if wrong. Path B, ask the developer, which is fair but slow. Path C, dynamic analysis, which gets evidence first. All three paths go to an evaluation that compares risk and outcome, and then to a final recommendation. In this chapter one call writes all branches, while full tree-of-thought systems use many calls.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="330" y="20" width="220" height="70" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<text x="440" y="47" font-size="14" fill="#3f4a59" text-anchor="middle" font-weight="700">Decision</text>
<text x="440" y="70" font-size="12" fill="#4a5263" text-anchor="middle">SMS permission, no feature</text>
<path d="M440 90 C 440 120, 150 110, 150 140" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<rect x="40" y="144" width="240" height="96" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.7"/>
<text x="56" y="171" font-size="14" fill="#1f4a9e" text-anchor="start" font-weight="700">Path A</text>
<text x="56" y="194" font-size="12" fill="#4a5263" text-anchor="start">Flag as malicious</text>
<text x="56" y="212" font-size="12" fill="#4a5263" text-anchor="start">fast, but risky if wrong</text>
<path d="M160 240 C 160 280, 440 270, 440 300" fill="none" stroke="#2f62c8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m3)"/>
<path d="M440 90 C 440 120, 430 110, 430 140" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<rect x="320" y="144" width="240" height="96" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.7"/>
<text x="336" y="171" font-size="14" fill="#58378f" text-anchor="start" font-weight="700">Path B</text>
<text x="336" y="194" font-size="12" fill="#4a5263" text-anchor="start">Ask the developer</text>
<text x="336" y="212" font-size="12" fill="#4a5263" text-anchor="start">fair, but slow</text>
<path d="M440 240 C 440 280, 440 270, 440 300" fill="none" stroke="#7a4fc2" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m5)"/>
<path d="M440 90 C 440 120, 710 110, 710 140" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<rect x="600" y="144" width="240" height="96" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<text x="616" y="171" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">Path C</text>
<text x="616" y="194" font-size="12" fill="#4a5263" text-anchor="start">Dynamic analysis</text>
<text x="616" y="212" font-size="12" fill="#4a5263" text-anchor="start">evidence first</text>
<path d="M720 240 C 720 280, 440 270, 440 300" fill="none" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m6)"/>
<rect x="300" y="304" width="280" height="70" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.7"/>
<text x="440" y="331" font-size="14" fill="#963f1f" text-anchor="middle" font-weight="700">Evaluation</text>
<text x="440" y="354" font-size="12" fill="#4a5263" text-anchor="middle">Compare risk and outcome</text>
<path d="M440 374 L 440 400" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="300" y="404" width="280" height="46" rx="12" fill="#0f8a6a"/>
<text x="440" y="433" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Final recommendation</text>
<text x="440" y="476" font-size="12.2" fill="#4a5263" text-anchor="middle" font-style="italic">In this chapter, one call writes all branches. Full tree-of-thought systems use many calls.</text>
</svg>
