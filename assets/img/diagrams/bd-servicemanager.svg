<circle cx="379.333" cy="265" r="10" fill="#7a4fc2"/>
<text x="379.333" y="268.96" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="395.333" y="269" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">store name and binder</text>
<text x="395.333" y="285" font-size="11.3" fill="#4a5263" text-anchor="start">and link to its death</text>
<path d="M786 322 L 329.333 322" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
