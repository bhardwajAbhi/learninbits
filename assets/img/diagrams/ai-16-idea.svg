<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Draft, critique and revise</title>
  <desc id="d">Three steps in a row. First, draft_chain writes a first answer. Second, critique_chain reviews it like a teacher, against four criteria, namely correct, clear and concise, complete and well structured. Third, revise_chain writes a better answer. The question goes into all three steps. The draft also goes to step 3, and the critique says what to fix.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="62" width="256" height="100" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="148" y="96" font-size="15" fill="#1f4a9e" text-anchor="middle" font-weight="700">1. Draft</text>
<text x="148" y="117" font-size="12" fill="#4a5263" text-anchor="middle">write a first answer</text>
<text x="148" y="143" font-size="11.6" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">draft_chain</text>
<path d="M278 112 L 310 112" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="312" y="62" width="256" height="100" rx="12" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="440" y="96" font-size="15" fill="#58378f" text-anchor="middle" font-weight="700">2. Critique</text>
<text x="440" y="117" font-size="12" fill="#4a5263" text-anchor="middle">review it like a teacher</text>
<text x="440" y="143" font-size="11.6" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">critique_chain</text>
<path d="M570 112 L 602 112" fill="none" stroke="#1c2230" stroke-width="1.8" marker-end="url(#m0)"/>
<rect x="604" y="62" width="256" height="100" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="732" y="96" font-size="15" fill="#0b6650" text-anchor="middle" font-weight="700">3. Revise</text>
<text x="732" y="117" font-size="12" fill="#4a5263" text-anchor="middle">write a better answer</text>
<text x="732" y="143" font-size="11.6" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">revise_chain</text>
<path d="M148 60 V 30 H 744" fill="none" stroke="#5d6b7e" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M744 30 L 744 58" fill="none" stroke="#5d6b7e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m8)"/>
<rect x="330" y="18" width="220" height="24" rx="8" fill="#fff"/>
<text x="440" y="35" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="600">the draft goes to step 3 too</text>
<rect x="312" y="182" width="256" height="112" rx="10" fill="#f2efe8"/>
<text x="440" y="204" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="700">Four criteria</text>
<text x="440" y="226" font-size="11.6" fill="#1c2230" text-anchor="middle">correct</text>
<text x="440" y="243" font-size="11.6" fill="#1c2230" text-anchor="middle">clear and concise</text>
<text x="440" y="260" font-size="11.6" fill="#1c2230" text-anchor="middle">complete</text>
<text x="440" y="277" font-size="11.6" fill="#1c2230" text-anchor="middle">well structured</text>
<text x="148" y="196" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="600">the question</text>
<text x="148" y="214" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="600">goes into all three</text>
<text x="732" y="196" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="600">the critique says</text>
<text x="732" y="214" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="600">what to fix</text>
</svg>
