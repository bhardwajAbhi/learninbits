<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A plain request and a request with limits</title>
  <desc id="d">One topic for one reader goes into two prompts. The plain request gives only the task and the reader, and gets a long answer of any length, any format and any words. The request with limits adds REQUIREMENTS, what to do, and DO NOT, what to avoid. It gets a short answer fitted to one reader and one purpose. Pair every DO NOT with a requirement, so that the model knows what to write instead.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="108" width="150" height="72" rx="12" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="95" y="138" font-size="14" fill="#3f4a59" text-anchor="middle" font-weight="700">One topic</text>
<text x="95" y="158" font-size="11.8" fill="#4a5263" text-anchor="middle">one reader</text>
<rect x="220" y="30" width="300" height="92" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="370" y="60" font-size="14" fill="#1f4a9e" text-anchor="middle" font-weight="700">Plain request</text>
<text x="370" y="82" font-size="11.8" fill="#4a5263" text-anchor="middle">the task and the reader</text>
<text x="370" y="104" font-size="11.8" fill="#4a5263" text-anchor="middle">nothing else</text>
<rect x="580" y="30" width="280" height="92" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.2"/>
<text x="720" y="60" font-size="13.6" fill="#1c2230" text-anchor="middle" font-weight="700">A long answer</text>
<text x="720" y="82" font-size="11.8" fill="#4a5263" text-anchor="middle">any length, any format</text>
<text x="720" y="104" font-size="11.8" fill="#4a5263" text-anchor="middle">and any words</text>
<rect x="220" y="166" width="300" height="120" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="370" y="194" font-size="14" fill="#8a5a12" text-anchor="middle" font-weight="700">Request with limits</text>
<rect x="240" y="208" width="260" height="26" rx="13" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="370" y="225.104" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="700">REQUIREMENTS, what to do</text>
<rect x="240" y="244" width="260" height="26" rx="13" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="370" y="261.104" font-size="11.4" fill="#963f1f" text-anchor="middle" font-weight="700">DO NOT, what to avoid</text>
<rect x="580" y="180" width="280" height="92" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.2"/>
<text x="720" y="210" font-size="13.6" fill="#1c2230" text-anchor="middle" font-weight="700">A short answer</text>
<text x="720" y="232" font-size="11.8" fill="#4a5263" text-anchor="middle">fitted to one reader</text>
<text x="720" y="254" font-size="11.8" fill="#4a5263" text-anchor="middle">and one purpose</text>
