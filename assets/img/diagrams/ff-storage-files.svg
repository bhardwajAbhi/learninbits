<text x="38" y="432" font-size="12.2" fill="#4a5263" text-anchor="start">A server value is active</text>
<rect x="304" y="378" width="268" height="66" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.4"/>
<rect x="316" y="390" width="56" height="22" rx="11" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
