<rect x="527.36" y="102" width="91.2" height="30" rx="15" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="572.96" y="122" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="600">Biometrics</text>
