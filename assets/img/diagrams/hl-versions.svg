<path d="M282 99 L 308 99" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="310" y="44" width="260" height="110" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="326" y="68" font-size="13" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">2/</text>
<text x="554" y="68" font-size="11" fill="#3f4a59" text-anchor="end" font-weight="600">frozen</text>
