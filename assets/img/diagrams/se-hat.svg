<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One token for three ways to authenticate</title>
  <desc id="d">At the top, at boot, ISharedSecret lets KeyMint, Gatekeeper and the biometric TAs each add a nonce and derive the same HMAC key. Below, three sources. A PIN, pattern or password goes through LockSettings to the Gatekeeper TA. A fingerprint goes through BiometricService to the Fingerprint TA. A face goes to the Face TA. Each TA produces a HardwareAuthToken with the user ID, the authenticator, the time and an HMAC. keystore2 and KeyMint check the HMAC with the shared key and then release auth-bound keys for the timeout of each key. All three factors produce the same token.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="840" height="64" rx="12" fill="#f2efe8"/>
<text x="40" y="44" font-size="12.8" fill="#1c2230" text-anchor="start" font-weight="700">At boot, ISharedSecret</text>
<text x="40" y="66" font-size="11.6" fill="#1c2230" text-anchor="start">KeyMint, Gatekeeper and the biometric TAs each add a nonce and derive the same HMAC key.</text>
<rect x="20" y="108" width="190" height="54" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.4"/>
<text x="36" y="132" font-size="12" fill="#1f4a9e" text-anchor="start" font-weight="700">PIN, pattern or password</text>
<text x="36" y="151" font-size="10.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">LockSettingsService</text>
<path d="M210 135 L 240 135" fill="none" stroke="#2f62c8" stroke-width="1.5" marker-end="url(#m3)"/>
<rect x="244" y="116" width="130" height="38" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="309" y="140" font-size="11.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Gatekeeper TA</text>
<path d="M374 135 C 410 135, 410 199, 440 199" fill="none" stroke="#2f62c8" stroke-width="1.5" marker-end="url(#m3)"/>
<rect x="20" y="178" width="190" height="54" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="36" y="202" font-size="12" fill="#0b6650" text-anchor="start" font-weight="700">Fingerprint</text>
<text x="36" y="221" font-size="10.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">BiometricService</text>
<path d="M210 205 L 240 205" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<rect x="244" y="186" width="130" height="38" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="309" y="210" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Fingerprint TA</text>
<path d="M374 205 C 410 205, 410 199, 440 199" fill="none" stroke="#0f8a6a" stroke-width="1.5" marker-end="url(#m4)"/>
<rect x="20" y="248" width="190" height="54" rx="10" fill="#fff" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="36" y="272" font-size="12" fill="#58378f" text-anchor="start" font-weight="700">Face</text>
<text x="36" y="291" font-size="10.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">BiometricService</text>
<path d="M210 275 L 240 275" fill="none" stroke="#7a4fc2" stroke-width="1.5" marker-end="url(#m5)"/>
<rect x="244" y="256" width="130" height="38" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="309" y="280" font-size="11.6" fill="#58378f" text-anchor="middle" font-weight="700">Face TA</text>
<path d="M374 275 C 410 275, 410 199, 440 199" fill="none" stroke="#7a4fc2" stroke-width="1.5" marker-end="url(#m5)"/>
<rect x="444" y="160" width="170" height="78" rx="12" fill="#c2552d"/>
<text x="529" y="186" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">HardwareAuthToken</text>
<text x="529" y="206" font-size="10.8" fill="#ffffffdd" text-anchor="middle">user ID, authenticator,</text>
<text x="529" y="221" font-size="10.8" fill="#ffffffdd" text-anchor="middle">time, HMAC</text>
<path d="M614 199 L 646 199" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="650" y="128" width="210" height="140" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="666" y="152" font-size="12.6" fill="#0b6650" text-anchor="start" font-weight="700">keystore2 and KeyMint</text>
<text x="666" y="176" font-size="11.4" fill="#1c2230" text-anchor="start">Check the HMAC with the</text>
<text x="666" y="194" font-size="11.4" fill="#1c2230" text-anchor="start">shared key, then release</text>
<text x="666" y="212" font-size="11.4" fill="#1c2230" text-anchor="start">auth-bound keys for the</text>
<text x="666" y="230" font-size="11.4" fill="#1c2230" text-anchor="start">timeout of each key</text>
<text x="440" y="330" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic">All three factors produce the same token, so a key does not care how the user proved presence.</text>
</svg>
