<rect x="652" y="40" width="47.6" height="40" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.5"/>
<text x="675.8" y="66" font-size="15" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">4k</text>
<line x1="675.8" y1="80" x2="675.8" y2="142" stroke="#c2552d" stroke-width="1.4"/>
<text x="675.8" y="156" font-size="11.4" fill="#963f1f" text-anchor="middle" font-weight="600">4 KB pages. A 16 KB build has no suffix</text>
<text x="20" y="26" font-size="12" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">BOARD_KERNEL_VERSION in kernel/prebuilts/6.18/arm64/kernel_version.mk</text>
