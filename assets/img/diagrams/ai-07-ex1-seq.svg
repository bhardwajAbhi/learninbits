<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the call of Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, prompt, llm, Gemini API, parser. Step 1, Your code to parser, get_format_instructions(), the parser turns the Pydantic classes into a JSON schema text. Step 2, parser to Your code, Format instructions, a plain string. Step 3, Your code to prompt, chain.invoke({&quot;privacy_policy&quot; ..., &quot;format_instructions&quot; ...}), two placeholders. Step 4, prompt to llm, Prompt value, rules, schema and the full policy. Step 5, llm to Gemini API, HTTPS request, temperature 0. Step 6, Gemini API to llm, JSON text, app_name, data_practices, ... summary. Step 7, llm to parser, AIMessage, the chain passes the reply to the parser. Step 8, parser to parser, Parse the JSON, no check of the types or the allowed values. Step 9, parser to Your code, dict, the code reads values by key and prints each section. Steps 3 to 9 repeat, One call of the chain.</desc>
