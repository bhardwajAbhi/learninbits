<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The parts of a generative AI app</title>
  <desc id="d">Four parts from left to right. The user types a question and reads the answer. The web page, made with Streamlit, has a text box, buttons and a chat window, and is added in chapter 4. Your program uses LangChain for the prompt template, the chain, the parser and the memory, and grows in chapters 5 to 14. The language model is in the cloud, such as Gemini or OpenAI, or local with Ollama, and is covered in chapters 1 to 3. The question travels to the right and the answer travels back to the left.</desc>
