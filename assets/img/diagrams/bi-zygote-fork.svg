<text x="32" y="72" font-size="11.8" fill="#3f4a59" text-anchor="start" font-weight="600">ART runtime and boot class path</text>
<rect x="20" y="86" width="270" height="30" rx="6" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="32" y="106" font-size="11.8" fill="#1f4a9e" text-anchor="start" font-weight="600">About 19,000 preloaded classes</text>
<rect x="20" y="120" width="270" height="30" rx="6" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="32" y="140" font-size="11.8" fill="#1f4a9e" text-anchor="start" font-weight="600">Class loaders for old libraries</text>
<rect x="20" y="154" width="270" height="30" rx="6" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="32" y="174" font-size="11.8" fill="#58378f" text-anchor="start" font-weight="600">System resources</text>
<rect x="20" y="188" width="270" height="30" rx="6" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="32" y="208" font-size="11.8" fill="#8a5a12" text-anchor="start" font-weight="600">App HALs and the graphics driver</text>
<rect x="20" y="222" width="270" height="30" rx="6" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="32" y="242" font-size="11.8" fill="#0b6650" text-anchor="start" font-weight="600">libandroid and libjnigraphics</text>
<rect x="20" y="256" width="270" height="30" rx="6" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="32" y="276" font-size="11.8" fill="#963f1f" text-anchor="start" font-weight="600">WebView and crypto providers</text>
<rect x="20" y="296" width="270" height="46" rx="8" fill="#1c2230"/>
<text x="32" y="315" font-size="11.8" fill="#fff" text-anchor="start" font-weight="600">runSelectLoop() on</text>
<text x="32" y="332" font-size="11.8" fill="#ffffffcc" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">/dev/socket/zygote</text>
