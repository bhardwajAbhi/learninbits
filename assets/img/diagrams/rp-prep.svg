<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six steps of preparation before writing</title>
  <desc id="d">Six steps. Gather materials in one place. Create a master outline. Use the publisher template from the start. Choose a writing tool, Word for teamwork or LaTeX and Overleaf for math. Use a reference manager such as Zotero, Mendeley or EndNote. Use version control and daily backups. Tip, start with the figures and tables.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="24" y="24" width="264" height="168" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<circle cx="52" cy="54" r="15" fill="#2f62c8"/>
<text x="52" y="59.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="78" y="60" font-size="15.5" fill="#1f4a9e" text-anchor="start" font-weight="700">Gather materials</text>
<text x="48" y="100" font-size="13.5" fill="#4a5263" text-anchor="start">Data, results, figures,</text>
<text x="48" y="122" font-size="13.5" fill="#4a5263" text-anchor="start">logs in one place</text>
<rect x="48" y="146" width="170" height="30" rx="15" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="133" y="165.5" font-size="12.5" fill="#1f4a9e" text-anchor="middle" font-weight="600">Consolidate first</text>
<rect x="308" y="24" width="264" height="168" rx="14" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<circle cx="336" cy="54" r="15" fill="#7a4fc2"/>
<text x="336" y="59.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="362" y="60" font-size="15.5" fill="#58378f" text-anchor="start" font-weight="700">Master outline</text>
<text x="332" y="100" font-size="13.5" fill="#4a5263" text-anchor="start">Each section, each figure</text>
<text x="332" y="122" font-size="13.5" fill="#4a5263" text-anchor="start">and table placed</text>
<rect x="332" y="146" width="170" height="30" rx="15" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="417" y="165.5" font-size="12.5" fill="#58378f" text-anchor="middle" font-weight="600">Structure thoughts</text>
<rect x="592" y="24" width="264" height="168" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<circle cx="620" cy="54" r="15" fill="#b7791f"/>
<text x="620" y="59.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="646" y="60" font-size="15.5" fill="#8a5a12" text-anchor="start" font-weight="700">Publisher template</text>
<text x="616" y="100" font-size="13.5" fill="#4a5263" text-anchor="start">IEEE, ACM or Springer,</text>
<text x="616" y="122" font-size="13.5" fill="#4a5263" text-anchor="start">from day one</text>
<rect x="616" y="146" width="170" height="30" rx="15" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="701" y="165.5" font-size="12.5" fill="#8a5a12" text-anchor="middle" font-weight="600">Format early</text>
<rect x="24" y="214" width="264" height="168" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<circle cx="52" cy="244" r="15" fill="#0f8a6a"/>
<text x="52" y="249.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="78" y="250" font-size="15.5" fill="#0b6650" text-anchor="start" font-weight="700">Writing tool</text>
<text x="48" y="290" font-size="13.5" fill="#4a5263" text-anchor="start">Word for teamwork, LaTeX</text>
<text x="48" y="312" font-size="13.5" fill="#4a5263" text-anchor="start">or Overleaf for math</text>
<rect x="48" y="336" width="170" height="30" rx="15" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="133" y="355.5" font-size="12.5" fill="#0b6650" text-anchor="middle" font-weight="600">Pick wisely</text>
<rect x="308" y="214" width="264" height="168" rx="14" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<circle cx="336" cy="244" r="15" fill="#c2552d"/>
<text x="336" y="249.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="362" y="250" font-size="15.5" fill="#963f1f" text-anchor="start" font-weight="700">Reference manager</text>
<text x="332" y="290" font-size="13.5" fill="#4a5263" text-anchor="start">Zotero, Mendeley or</text>
<text x="332" y="312" font-size="13.5" fill="#4a5263" text-anchor="start">EndNote, never by hand</text>
<rect x="332" y="336" width="170" height="30" rx="15" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="417" y="355.5" font-size="12.5" fill="#963f1f" text-anchor="middle" font-weight="600">Automate citing</text>
<rect x="592" y="214" width="264" height="168" rx="14" fill="#fff" stroke="#5d6b7e" stroke-width="1.8"/>
<circle cx="620" cy="244" r="15" fill="#5d6b7e"/>
<text x="620" y="249.04" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">6</text>
<text x="646" y="250" font-size="15.5" fill="#3f4a59" text-anchor="start" font-weight="700">Version control</text>
<text x="616" y="290" font-size="13.5" fill="#4a5263" text-anchor="start">v1_draft, v2_review,</text>
<text x="616" y="312" font-size="13.5" fill="#4a5263" text-anchor="start">daily cloud backup</text>
<rect x="616" y="336" width="170" height="30" rx="15" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="701" y="355.5" font-size="12.5" fill="#3f4a59" text-anchor="middle" font-weight="600">Back up often</text>
<rect x="24" y="410" width="832" height="58" rx="29" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="440" y="445" font-size="14.5" fill="#8a5a12" text-anchor="middle" font-weight="700">Tip. Start with the figures and tables, then write the story around them.</text>
</svg>
