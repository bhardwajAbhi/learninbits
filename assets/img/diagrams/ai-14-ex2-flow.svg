<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 597" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of Example 2 flows</title>
  <desc id="d">Setup, llm = ChatOpenRouter(..., temperature=0.7), Qwen through OpenRouter, with the same randomness. Chain, chain = cot_prompt | llm | parser, Think step by step, then one line FINAL ANSWER &lt;answer&gt;, {problem}. Loop, for i in range(n_samples), The same labeling problem, sent once for each sample. Extract, re.search(r&quot;FINAL ANSWER\s*(.+?)(?\n|$)&quot;, ...), Takes the first match, then upper case without stars and dots. Vote, Counter(answers).most_common(1), Counts in one line and returns the top answer with its count. Output, FINAL ANSWER, CONFIDENCE and VOTE DISTRIBUTION, SUSPICIOUS, with 5 of 5 votes in the real run. A loop goes back from stage 4 to stage 3, next sample.</desc>
