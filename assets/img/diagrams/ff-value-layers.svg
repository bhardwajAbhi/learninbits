<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 532" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How create-cache resolves the value of one flag</title>
  <desc id="d">Five steps from top to bottom. One, the declaration default, DISABLED and READ_WRITE. Two, the first values file. Three, later values files, where each later file overrides the earlier ones. Four, the release policy, which forces read-only or fails the build if a flag is writable. Five, the fixed read-only check, where a writable value for a fixed flag is an error. The result is the final value in the cache. On the right, the cache keeps one tracepoint record for each file that sets a value, and dump-cache with the trace field shows them.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="300" y="36" font-size="14" fill="#1c2230" text-anchor="middle" font-weight="700">Steps inside create-cache</text>
<rect x="616" y="16" width="240" height="500" rx="12" fill="#fbfaf6" stroke="#d9d4c7" stroke-width="1.2"/>
<text x="736" y="42" font-size="14" fill="#1c2230" text-anchor="middle" font-weight="700">Tracepoints in the cache</text>
<rect x="24" y="64" width="560" height="62" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<rect x="24" y="64" width="6" height="62" rx="3" fill="#5d6b7e"/>
<circle cx="54" cy="95" r="13" fill="#5d6b7e"/>
<text x="54" y="99.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="78" y="90" font-size="14" fill="#3f4a59" text-anchor="start" font-weight="700">Declaration default</text>
<text x="78" y="110" font-size="12.5" fill="#4a5263" text-anchor="start">Every flag starts as DISABLED and READ_WRITE.</text>
<path d="M300 126 L 300 140" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<line x1="584" y1="95" x2="630" y2="95" stroke="#d9d4c7" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="630" y="72" width="212" height="46" rx="8" fill="#fff" stroke="#d9d4c7" stroke-width="1"/>
<text x="644" y="91" font-size="11.5" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">flags.aconfig</text>
<text x="644" y="108" font-size="11" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">DISABLED  READ_WRITE</text>
<rect x="34" y="142" width="540" height="62" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<rect x="34" y="142" width="6" height="62" rx="3" fill="#b7791f"/>
<circle cx="64" cy="173" r="13" fill="#b7791f"/>
<text x="64" y="177.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="88" y="168" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">First values file</text>
<text x="88" y="188" font-size="12.5" fill="#4a5263" text-anchor="start">Sets state and permission for this release.</text>
<path d="M300 204 L 300 218" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<line x1="574" y1="173" x2="630" y2="173" stroke="#d9d4c7" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="630" y="150" width="212" height="46" rx="8" fill="#fff" stroke="#d9d4c7" stroke-width="1"/>
<text x="644" y="169" font-size="11.5" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">base.values</text>
<text x="644" y="186" font-size="11" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">ENABLED  READ_WRITE</text>
<rect x="44" y="220" width="520" height="62" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<rect x="44" y="220" width="6" height="62" rx="3" fill="#b7791f"/>
<circle cx="74" cy="251" r="13" fill="#b7791f"/>
<text x="74" y="255.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="98" y="246" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">Later values files</text>
<text x="98" y="266" font-size="12.5" fill="#4a5263" text-anchor="start">Each later file overrides the earlier ones.</text>
<path d="M300 282 L 300 296" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<line x1="564" y1="251" x2="630" y2="251" stroke="#d9d4c7" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="630" y="228" width="212" height="46" rx="8" fill="#fff" stroke="#d9d4c7" stroke-width="1"/>
<text x="644" y="247" font-size="11.5" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">bp4a.values</text>
<text x="644" y="264" font-size="11" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">ENABLED  READ_ONLY</text>
<rect x="54" y="298" width="500" height="62" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.7"/>
<rect x="54" y="298" width="6" height="62" rx="3" fill="#c2552d"/>
<circle cx="84" cy="329" r="13" fill="#c2552d"/>
<text x="84" y="333.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="108" y="324" font-size="14" fill="#963f1f" text-anchor="start" font-weight="700">Release policy</text>
<text x="108" y="344" font-size="12.5" fill="#4a5263" text-anchor="start">Force read-only, or fail if a flag is writable.</text>
<path d="M300 360 L 300 374" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="64" y="376" width="480" height="62" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.7"/>
<rect x="64" y="376" width="6" height="62" rx="3" fill="#7a4fc2"/>
<circle cx="94" cy="407" r="13" fill="#7a4fc2"/>
<text x="94" y="411.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="118" y="402" font-size="14" fill="#58378f" text-anchor="start" font-weight="700">Fixed read-only check</text>
<text x="118" y="422" font-size="12.5" fill="#4a5263" text-anchor="start">A writable value for a fixed flag is an error.</text>
<path d="M300 438 L 300 458" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="130" y="462" width="340" height="50" rx="12" fill="#0f8a6a"/>
<text x="300" y="492" font-size="14.5" fill="#fff" text-anchor="middle" font-weight="700">Final value in the cache</text>
<text x="736" y="328" font-size="12" fill="#4a5263" text-anchor="middle">One record for each file that</text>
<text x="736" y="346" font-size="12" fill="#4a5263" text-anchor="middle">sets a value. dump-cache with</text>
<text x="736" y="364" font-size="12" fill="#4a5263" text-anchor="middle">the {trace} field shows them.</text>
</svg>
