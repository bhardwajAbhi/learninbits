<text x="402" y="100" font-size="11" fill="#7b8292" text-anchor="start" font-style="italic">First child</text>
<rect x="402" y="110" width="124" height="86" rx="6" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="464" y="148" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="700">Shared pages</text>
<text x="464" y="166" font-size="11" fill="#4a5263" text-anchor="middle">copy-on-write</text>
<text x="402" y="220" font-size="11.2" fill="#4a5263" text-anchor="start">uid 1000, nice name</text>
<text x="402" y="238" font-size="11.2" fill="#4a5263" text-anchor="start">system_server</text>
<text x="402" y="256" font-size="11.2" fill="#4a5263" text-anchor="start">Closes the Zygote socket</text>
<path d="M464 44 L 464 57" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<rect x="550" y="60" width="148" height="230" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="562" y="82" font-size="12.8" fill="#1f4a9e" text-anchor="start" font-weight="700">App process</text>
<text x="562" y="100" font-size="11" fill="#7b8292" text-anchor="start" font-style="italic">On request of AMS</text>
<rect x="562" y="110" width="124" height="86" rx="6" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="624" y="148" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="700">Shared pages</text>
<text x="624" y="166" font-size="11" fill="#4a5263" text-anchor="middle">copy-on-write</text>
<text x="562" y="220" font-size="11.2" fill="#4a5263" text-anchor="start">uid of the app</text>
<text x="562" y="238" font-size="11.2" fill="#4a5263" text-anchor="start">Starts a binder thread</text>
<text x="562" y="256" font-size="11.2" fill="#4a5263" text-anchor="start">pool in onZygoteInit()</text>
<path d="M624 44 L 624 57" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<rect x="710" y="60" width="148" height="230" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="722" y="82" font-size="12.8" fill="#1f4a9e" text-anchor="start" font-weight="700">App process</text>
<text x="722" y="100" font-size="11" fill="#7b8292" text-anchor="start" font-style="italic">On request of AMS</text>
<rect x="722" y="110" width="124" height="86" rx="6" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="784" y="148" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="700">Shared pages</text>
<text x="784" y="166" font-size="11" fill="#4a5263" text-anchor="middle">copy-on-write</text>
<text x="722" y="220" font-size="11.2" fill="#4a5263" text-anchor="start">Another uid</text>
<text x="722" y="238" font-size="11.2" fill="#4a5263" text-anchor="start">Same shared pages</text>
<text x="722" y="256" font-size="11.2" fill="#4a5263" text-anchor="start">until it writes them</text>
<path d="M784 44 L 784 57" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<line x1="290" y1="160" x2="318" y2="160" stroke="#1c2230" stroke-width="1.8"/>
<rect x="318" y="148" width="54" height="24" rx="12" fill="#1c2230" stroke="#1c2230" stroke-width="1.2"/>
<text x="345" y="164.104" font-size="11.4" fill="#fff" text-anchor="middle" font-weight="700">fork()</text>
<path d="M372 160 L 378 160 L 378 44 L 784 44" fill="none" stroke="#1c2230" stroke-width="1.8"/>
<rect x="390" y="306" width="468" height="58" rx="10" fill="#f2efe8"/>
<text x="406" y="328" font-size="12.6" fill="#1c2230" text-anchor="start" font-weight="700">USAP pool</text>
