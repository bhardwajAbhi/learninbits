<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The plan of the temperature program</title>
  <desc id="d">One prompt asks for a one-sentence security message about phishing. It goes to three model objects: llm_zero with temperature 0, llm_balanced with temperature 0.7 and llm_creative with temperature 1.5, each with a maximum of 64 output tokens. Each model object runs the prompt three times with invoke. That makes nine calls in total, and you compare the three runs in each row.</desc>
