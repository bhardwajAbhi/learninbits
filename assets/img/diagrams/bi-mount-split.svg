<text x="616" y="46" font-size="11" fill="#ffffffcc" text-anchor="end" font-style="italic" font-weight="600">base class</text>
<text x="266" y="80" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">Create(cmdline)  DoCreateDevices()</text>
<text x="266" y="98" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">DoFirstStageMount()</text>
<text x="266" y="116" font-size="11.2" fill="#9aa6b8" text-anchor="start" font-family="JetBrains Mono, monospace">// reads the fstab, creates block devices,</text>
<text x="266" y="134" font-size="11.2" fill="#9aa6b8" text-anchor="start" font-family="JetBrains Mono, monospace">// mounts the partitions</text>
<text x="266" y="152" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">virtual hooks, MountOverlays(),</text>
<text x="266" y="170" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">UseDsuIfPresent(), GetExtraBlockDevices()</text>
<rect x="20" y="230" width="400" height="150" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
