<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Android Common Kernel as layers on top of an upstream LTS release</title>
  <desc id="d">On the left, an upstream Linux LTS release forms the base. Five layers of Android patches sit on it. They are Android drivers such as Binder, binderfs, ashmem and incremental-fs, scheduler and memory changes for interactive phones, security hardening such as CFI and shadow call stack, vendor hook points and test and debug support. Together they form an Android Common Kernel branch such as android17-6.18. On the right, five Android ideas that converge with upstream. Wakelocks are now PM_WAKELOCKS, Pressure Stall Information is a standard feature, the in-kernel low memory killer is replaced by lmkd and PSI, ashmem gives way to memfd_create and ION is replaced by DMA-BUF heaps.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="40" y="24" width="440" height="46" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="56" y="44" font-size="12.8" fill="#3f4a59" text-anchor="start" font-weight="700">Test and debug support</text>
<text x="56" y="61" font-size="11.2" fill="#4a5263" text-anchor="start">Hooks into the Android test pipeline</text>
<rect x="40" y="76" width="440" height="46" rx="10" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="56" y="96" font-size="12.8" fill="#58378f" text-anchor="start" font-weight="700">Vendor hook points</text>
<text x="56" y="113" font-size="11.2" fill="#4a5263" text-anchor="start">android_vh_* and android_rvh_* tracepoints</text>
<rect x="40" y="128" width="440" height="46" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.4"/>
<text x="56" y="148" font-size="12.8" fill="#963f1f" text-anchor="start" font-weight="700">Security hardening</text>
<text x="56" y="165" font-size="11.2" fill="#4a5263" text-anchor="start">CFI, shadow call stack, stricter defaults</text>
<rect x="40" y="180" width="440" height="46" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="56" y="200" font-size="12.8" fill="#8a5a12" text-anchor="start" font-weight="700">Scheduler and memory changes</text>
<text x="56" y="217" font-size="11.2" fill="#4a5263" text-anchor="start">Tuned for interactive phones</text>
<rect x="40" y="232" width="440" height="46" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="56" y="252" font-size="12.8" fill="#1f4a9e" text-anchor="start" font-weight="700">Android drivers</text>
<text x="56" y="269" font-size="11.2" fill="#4a5263" text-anchor="start">Binder, binderfs, ashmem, incremental-fs</text>
<rect x="40" y="284" width="440" height="56" rx="10" fill="#1c2230"/>
<text x="260" y="308" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Upstream Linux LTS</text>
<text x="260" y="327" font-size="11.4" fill="#ffffffcc" text-anchor="middle">for example 6.12 or 6.18</text>
<text x="260" y="368" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="600">Android Common Kernel (ACK) branch, for example android17-6.18</text>
<text x="530" y="34" font-size="13" fill="#1c2230" text-anchor="start" font-weight="700">Android ideas that converge with upstream</text>
<rect x="530" y="50" width="330" height="44" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="544" y="69" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">Wakelocks</text>
<text x="544" y="85" font-size="11.2" fill="#4a5263" text-anchor="start">now PM_WAKELOCKS in Linux</text>
<rect x="530" y="104" width="330" height="44" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="544" y="123" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">Pressure Stall Information</text>
<text x="544" y="139" font-size="11.2" fill="#4a5263" text-anchor="start">now a standard kernel feature</text>
<rect x="530" y="158" width="330" height="44" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="544" y="177" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">In-kernel low memory killer</text>
<text x="544" y="193" font-size="11.2" fill="#4a5263" text-anchor="start">removed, replaced by lmkd and PSI</text>
<rect x="530" y="212" width="330" height="44" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="544" y="231" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">ashmem</text>
<text x="544" y="247" font-size="11.2" fill="#4a5263" text-anchor="start">giving way to memfd_create()</text>
<rect x="530" y="266" width="330" height="44" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="544" y="285" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">ION allocator</text>
<text x="544" y="301" font-size="11.2" fill="#4a5263" text-anchor="start">replaced by DMA-BUF heaps</text>
</svg>
