<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The full-stack AI TRiSM staircase</title>
  <desc id="d">Seven steps from consent collection to responsible agents. The lower three steps answer to data privacy laws. The upper four answer to AI rules. The CIO owns all of it with the CISO, DPO and AI officer.</desc>
