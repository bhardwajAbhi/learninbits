<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stability levels of a Binder object</title>
  <desc id="d">Three stability levels. VINTF can cross the system and vendor boundary, with @VintfStability, frozen versions and a declaration in the VINTF manifest. SYSTEM or VENDOR can travel inside one side only, for example between two system processes. UNDECLARED can travel only inside its own build unit, the default for code without a stability promise.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="840" height="58" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="36" y="45" font-size="12.8" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">VINTF</text>
<text x="36" y="65" font-size="11.4" fill="#1c2230" text-anchor="start">Can cross the system and vendor boundary.</text>
<text x="844" y="56" font-size="10.8" fill="#4a5263" text-anchor="end">@VintfStability, frozen versions, declared in the VINTF manifest</text>
<rect x="20" y="90" width="720" height="58" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="36" y="115" font-size="12.8" fill="#1f4a9e" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">SYSTEM or VENDOR</text>
<text x="36" y="135" font-size="11.4" fill="#1c2230" text-anchor="start">Can travel inside one side only.</text>
<text x="724" y="126" font-size="10.8" fill="#4a5263" text-anchor="end">for example between two system processes</text>
<rect x="20" y="160" width="600" height="58" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="36" y="185" font-size="12.8" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">UNDECLARED</text>
<text x="36" y="205" font-size="11.4" fill="#1c2230" text-anchor="start">Can travel only inside its own build unit.</text>
<text x="604" y="196" font-size="10.8" fill="#4a5263" text-anchor="end">the default for code without a stability promise</text>
</svg>
