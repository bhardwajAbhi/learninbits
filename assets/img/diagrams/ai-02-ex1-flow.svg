<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the chain of Example 1 flows</title>
  <desc id="d">Input, {&quot;text&quot; &quot;Hello!, my name is Abhishek.&quot;}, The dictionary for chain.invoke(). Template, prompt = ChatPromptTemplate.from_template(...), &quot;Translate to Hindi {text}&quot;, Fills {text} and makes one human message. Prompt, The filled prompt, Translate to Hindi Hello!, my name is Abhishek.. Model, llm = ChatGoogleGenerativeAI(model=&quot;gemini-3.1-flash-lite&quot;), Default temperature and length, chain = prompt | llm. Output, AIMessage, no parser, content, Hindi, the Hindi in Latin letters and a signature, usage_metadata, 12 input, 17 output tokens.</desc>
