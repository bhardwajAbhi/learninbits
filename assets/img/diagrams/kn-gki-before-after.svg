<text x="40" y="262" font-size="11.6" fill="#963f1f" text-anchor="start">Every device runs its own kernel binary.</text>
<text x="40" y="282" font-size="11.6" fill="#963f1f" text-anchor="start">A security fix needs every vendor tree.</text>
<text x="40" y="302" font-size="11.6" fill="#963f1f" text-anchor="start">No two devices can be tested the same way.</text>
<rect x="450" y="34" width="410" height="300" rx="16" fill="#e3f4ee" fill-opacity="0.55"/>
