<text x="102" y="76" font-size="14.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">Interpret</text>
<text x="102" y="106" font-size="12.3" fill="#4a5263" text-anchor="middle">the meaning in the</text>
<text x="102" y="126" font-size="12.3" fill="#4a5263" text-anchor="middle">real world</text>
