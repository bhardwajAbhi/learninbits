<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One AIDL file, four backends</title>
  <desc id="d">One file, IFoo.aidl, goes into the aidl compiler in system/tools/aidl. The compiler writes four backends. Java, with IFoo.Stub and IFoo.Stub.Proxy, used by apps and system_server. CPP, with BnFoo and BpFoo on libbinder, used by platform native code. NDK, with BnFoo and BpFoo on libbinder_ndk, used by vendor code and APEX modules. Rust, with BnFoo and BpFoo on libbinder_rs, used by new native services.</desc>
