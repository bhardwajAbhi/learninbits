<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Same base, different build</title>
  <desc id="d">Two stacks side by side. Both stand on the same hardware and the same Linux kernel. In embedded Linux, the device maker builds the layers above the C library. In Android, the native libraries, the runtime, the framework and the app layer are ready-made.</desc>

  <!-- column titles -->
  <text x="215" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1c2230">Embedded Linux</text>
  <text x="645" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1c2230">Android</text>

  <!-- ===== left stack ===== -->
  <rect x="60" y="60" width="310" height="52" rx="10" fill="#ffffff" stroke="#9aa0ab" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="215" y="91" font-size="14" text-anchor="middle" fill="#4a5263">Your app</text>
  <rect x="60" y="120" width="310" height="52" rx="10" fill="#ffffff" stroke="#9aa0ab" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="215" y="143" font-size="14" text-anchor="middle" fill="#4a5263">Services: Wi-Fi, updates, settings</text>
  <text x="215" y="161" font-size="11.5" text-anchor="middle" fill="#7b8292">you pick them and connect them</text>
  <rect x="60" y="180" width="310" height="52" rx="10" fill="#ffffff" stroke="#9aa0ab" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="215" y="203" font-size="14" text-anchor="middle" fill="#4a5263">A screen toolkit, if you need one</text>
  <text x="215" y="221" font-size="11.5" text-anchor="middle" fill="#7b8292">for example Qt</text>
  <rect x="60" y="240" width="310" height="52" rx="10" fill="#b7791f"/>
  <text x="215" y="271" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">C library and native tools</text>
  <rect x="60" y="300" width="310" height="52" rx="10" fill="#c2552d"/>
  <text x="215" y="331" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Linux kernel</text>
  <rect x="60" y="370" width="310" height="44" rx="10" fill="#f2efe8" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="215" y="397" font-size="13.5" font-weight="600" text-anchor="middle" fill="#4a5263">Hardware</text>

  <!-- left bracket -->
  <path d="M44 62 L34 62 L34 230 L44 230" fill="none" stroke="#c0453f" stroke-width="2"/>
  <text x="24" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#a3322d" transform="rotate(-90 24 146)">You build this</text>

  <!-- ===== right stack ===== -->
  <rect x="490" y="60" width="310" height="52" rx="10" fill="#0f8a6a"/>
  <text x="645" y="83" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">Your app, and apps from a store</text>
  <text x="645" y="101" font-size="11.5" text-anchor="middle" fill="#d8f2ea">Launcher and Settings are included</text>
  <rect x="490" y="120" width="310" height="52" rx="10" fill="#2f62c8"/>
  <text x="645" y="143" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">Framework and system services</text>
  <text x="645" y="161" font-size="11.5" text-anchor="middle" fill="#dbe5fb">windows, Wi-Fi, Bluetooth, telephony, updates</text>
  <rect x="490" y="180" width="310" height="52" rx="10" fill="#7a4fc2"/>
  <text x="645" y="211" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">Android Runtime (ART)</text>
  <rect x="490" y="240" width="310" height="52" rx="10" fill="#b7791f"/>
  <text x="645" y="263" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">Bionic, native libraries and HAL</text>
  <text x="645" y="281" font-size="11.5" text-anchor="middle" fill="#fbecd3">the HAL hides the chips of each device</text>
  <rect x="490" y="300" width="310" height="52" rx="10" fill="#c2552d"/>
  <text x="645" y="324" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Linux kernel</text>
  <text x="645" y="342" font-size="11.5" text-anchor="middle" fill="#fbe0d6">with Android parts such as Binder</text>
  <rect x="490" y="370" width="310" height="44" rx="10" fill="#f2efe8" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="645" y="397" font-size="13.5" font-weight="600" text-anchor="middle" fill="#4a5263">Hardware</text>

  <!-- right bracket -->
  <path d="M816 62 L826 62 L826 290 L816 290" fill="none" stroke="#2f7d55" stroke-width="2"/>
  <text x="840" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#1f5c3d" transform="rotate(90 840 176)">Ready-made</text>

  <!-- same kernel link -->
  <line x1="372" y1="326" x2="488" y2="326" stroke="#1c2230" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="384" y="312" width="92" height="28" rx="14" fill="#1c2230"/>
  <text x="430" y="331" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Same base</text>

  <!-- footnote -->
  <text x="430" y="452" font-size="12.5" text-anchor="middle" fill="#4a5263">Dashed boxes: parts that you must choose, build and keep up to date yourself.</text>
</svg>
