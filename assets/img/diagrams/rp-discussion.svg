<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Discussion, limitations and future work</title>
  <desc id="d">Five steps. Interpret the meaning in the real world. Compare with prior work. Acknowledge limitations such as data size, scope and assumptions. Address validity threats such as biases and errors. Suggest concrete future work. Openness about what did not work builds trust.</desc>
