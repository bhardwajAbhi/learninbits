<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kernel configuration fragments and their three checks</title>
  <desc id="d">Six fragments merge into one .config through merge_config.sh. They are gki_defconfig as the architecture base, android-base.config with the options that Android must have, android-base-conditional.xml with options per architecture, recommended fragments, vendor fragments and board fragments. The result is checked three times, at build time against the VINTF compatibility matrix, at test time by VtsKernelConfig on a device and at update time by checkvintf for the OTA package. For 6.18 the base fragment is empty on purpose, because the GKI tests already prove that a GKI kernel runs.</desc>
