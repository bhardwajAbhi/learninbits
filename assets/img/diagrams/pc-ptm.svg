<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Privacy threat modeling</title>
  <desc id="d">Tables and documents go through five steps, namely attack simulation and risk classes, a risk score, qualitative and quantitative scoring, mapping to law, LINDDUN and NIST, and a technical recommendation. Data carries hidden germs such as linkages, outliers and hidden inferences.</desc>
