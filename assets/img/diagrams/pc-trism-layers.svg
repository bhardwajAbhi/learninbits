<rect x="598" y="222" width="260" height="30" rx="15" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="728" y="241.14" font-size="11.5" fill="#1f4a9e" text-anchor="middle" font-weight="600">Responsible data collection</text>
<text x="280" y="320" font-size="12" fill="#58378f" text-anchor="middle" font-weight="700">The course works in the top three layers.</text>
