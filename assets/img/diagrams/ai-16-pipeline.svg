<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 489" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One pipeline, one call</title>
  <desc id="d">Input, {&quot;question&quot; question}, One key goes in. Add, RunnablePassthrough.assign(draft=draft_chain), Adds draft and keeps question. Add, RunnablePassthrough.assign(critique=critique_chain), Adds critique and keeps question and draft. Add, RunnablePassthrough.assign(revised=revise_chain), Adds revised and keeps every earlier key. Output, result[&quot;draft&quot;], result[&quot;critique&quot;], result[&quot;revised&quot;], One invoke() gives back every part.</desc>
