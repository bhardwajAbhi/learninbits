  <title id="t">How the chain of thought program of Example 1 flows</title>
  <desc id="d">Data, for problem in problems, 3 security calculations, one at a time. Template, cot_prompt = ChatPromptTemplate.from_template(...), Role, an experienced cybersecurity analyst, {problem}, 5 steps, values, order, formula, calculation, final answer. Model, llm = ChatGoogleGenerativeAI(model=&quot;gemini-3.1-flash-lite&quot;, temperature=0), One long answer for each problem. Parser, StrOutputParser(), Keeps the text. Output, print the problem and the solution, Steps and a final answer, 3 accounts, 9 computers, 270 GB. A loop goes back from stage 5 to stage 1, next problem.</desc>
