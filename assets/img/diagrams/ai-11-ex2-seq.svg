<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 594" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the two calls of Example 2</title>
  <desc id="d">A sequence diagram with the lanes Your code, step_back_chain, apply_chain, OpenRouter API. Step 1, Your code to step_back_chain, step_back_chain.invoke({&quot;question&quot; question}), call 1. Step 2, step_back_chain to OpenRouter API, Request with the first prompt, which 2 or 3 principles answer the question?. Step 3, OpenRouter API to step_back_chain, Reply, for example data encryption, secure storage, least privilege. Step 4, step_back_chain to Your code, principles, a plain string from the parser, printed first. Step 5, Your code to apply_chain, apply_chain.invoke({&quot;question&quot; ..., &quot;principles&quot; principles}), call 2, the output of call 1 is an input. Step 6, apply_chain to OpenRouter API, Request with the second prompt, principles first, then the question. Step 7, OpenRouter API to apply_chain, Reply, risks and fixes, with two factual errors. Step 8, apply_chain to Your code, FINAL ANSWER, a plain string, printed after the principles. Steps 1 to 8 repeat, Repeated for each of the 3 questions.</desc>
