<rect x="20" y="40" width="101.6" height="40" rx="8" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="70.8" y="66" font-size="15" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">6.18.16</text>
<text x="128.6" y="66" font-size="16" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">-</text>
<line x1="70.8" y1="80" x2="70.8" y2="98" stroke="#2f62c8" stroke-width="1.4"/>
<text x="70.8" y="112" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-weight="600">LTS 6.18, patch level 16</text>
<rect x="135.6" y="40" width="123.2" height="40" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="197.2" y="66" font-size="15" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">android17</text>
<text x="265.8" y="66" font-size="16" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">-</text>
<line x1="197.2" y1="80" x2="197.2" y2="142" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="197.2" y="156" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="600">ACK branch for Android 17</text>
<rect x="272.8" y="40" width="36.8" height="40" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="291.2" y="66" font-size="15" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">1</text>
<text x="316.6" y="66" font-size="16" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">-</text>
<line x1="291.2" y1="80" x2="291.2" y2="98" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="291.2" y="112" font-size="11.4" fill="#58378f" text-anchor="middle" font-weight="600">First release of the branch</text>
<rect x="323.6" y="40" width="166.4" height="40" rx="8" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="406.8" y="66" font-size="15" fill="#3f4a59" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">gb61cd7ae4209</text>
