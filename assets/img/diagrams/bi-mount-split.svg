<text x="476" y="288" font-size="11.4" fill="#4a5263" text-anchor="start">first_stage_mount_microdroid.cpp</text>
<text x="476" y="306" font-size="11.4" fill="#4a5263" text-anchor="start">Its Create() returns the plain base class</text>
<text x="476" y="324" font-size="11.4" fill="#4a5263" text-anchor="start">over a small fstab for the virtual machine.</text>
<text x="476" y="342" font-size="11.4" fill="#4a5263" text-anchor="start">No Android-only mount code.</text>
