<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The layout of the project</title>
  <desc id="d">A folder named learning-langchain holds the files .env, .env.sample, .gitignore and requirements.txt and a folder named code. The .env file holds your real API keys and Git never uploads it. The .env.sample file has the same names with empty values, to share. The .gitignore file lists the files that Git must not upload. The requirements.txt file lists the packages and their versions. The code folder has one folder for each lesson, such as 03_using_ollama and 05_using_prompt_template, each with an app_ollama.py file. The folder number is the chapter number.</desc>
