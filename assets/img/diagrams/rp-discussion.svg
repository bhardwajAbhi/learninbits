<rect x="192" y="120" width="156" height="120" rx="14" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<text x="270" y="156" font-size="14.5" fill="#58378f" text-anchor="middle" font-weight="700">Compare</text>
<text x="270" y="186" font-size="12.3" fill="#4a5263" text-anchor="middle">with prior work, where</text>
<text x="270" y="206" font-size="12.3" fill="#4a5263" text-anchor="middle">you lead and lag</text>
<path d="M348 180 L360 100" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="360" y="40" width="156" height="120" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<text x="438" y="76" font-size="14.5" fill="#8a5a12" text-anchor="middle" font-weight="700">Limitations</text>
<text x="438" y="106" font-size="12.3" fill="#4a5263" text-anchor="middle">data size, scope,</text>
<text x="438" y="126" font-size="12.3" fill="#4a5263" text-anchor="middle">assumptions</text>
<path d="M516 100 L528 180" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="528" y="120" width="156" height="120" rx="14" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<text x="606" y="156" font-size="14.5" fill="#963f1f" text-anchor="middle" font-weight="700">Validity threats</text>
<text x="606" y="186" font-size="12.3" fill="#4a5263" text-anchor="middle">biases, errors and</text>
<text x="606" y="206" font-size="12.3" fill="#4a5263" text-anchor="middle">their mitigation</text>
