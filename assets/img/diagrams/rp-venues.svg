<rect x="620" y="226" width="240" height="184" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.6"/>
<path d="M632 226 h216 a12 12 0 0 1 12 12 v28 h-240 v-28 a12 12 0 0 1 12 -12z" fill="#c2552d"/>
<text x="634" y="251.22" font-size="14.5" fill="#fff" text-anchor="start" font-weight="700">Publication fees</text>
<text x="634" y="288" font-size="13.5" fill="#4a5263" text-anchor="start">Open access can charge</text>
