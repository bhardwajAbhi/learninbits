<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The checks before a key operation runs</title>
  <desc id="d">A call to begin or generateKey passes four checks from left to right. First, SELinux checks the keystore2_key class, and a failure returns PERMISSION_DENIED. Second, the caller must own the key or hold a grant, and a failure returns KEY_NOT_FOUND. Third, for keys that need user authentication, the auth token must be valid and fresh, and a failure returns KEY_USER_NOT_AUTHENTICATED. Fourth, the KeyMint TA runs its own checks, and a failure returns an error code from KeyMint. When all four pass, the operation runs in secure hardware and the result returns to the app.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="56" width="110" height="60" rx="12" fill="#1c2230"/>
<text x="75" y="82" font-size="11.4" fill="#fff" text-anchor="middle" font-weight="700">begin()</text>
<text x="75" y="98" font-size="11.4" fill="#fff" text-anchor="middle" font-weight="700">or generateKey()</text>
<path d="M210 44 L284 86 L210 128 L136 86 Z" fill="#fff" stroke="#7a4fc2" stroke-width="2"/>
<text x="210" y="82.5" font-size="11.6" fill="#58378f" text-anchor="middle" font-weight="700">SELinux</text>
<text x="210" y="99.5" font-size="11.6" fill="#58378f" text-anchor="middle" font-weight="700">keystore2_key</text>
<path d="M130 86 L 134 86" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M210 128 L 210 166" fill="none" stroke="#c2552d" stroke-width="1.4" marker-end="url(#m7)"/>
<text x="218" y="152" font-size="11" fill="#963f1f" text-anchor="start" font-weight="800">No</text>
<rect x="150" y="170" width="120" height="30" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="210" y="190" font-size="9.4" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">PERMISSION_DENIED</text>
<path d="M380 44 L454 86 L380 128 L306 86 Z" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="380" y="82.5" font-size="11.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Owner of the</text>
<text x="380" y="99.5" font-size="11.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">key, or a grant</text>
<path d="M276 86 L 304 86" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M380 128 L 380 166" fill="none" stroke="#c2552d" stroke-width="1.4" marker-end="url(#m7)"/>
<text x="388" y="152" font-size="11" fill="#963f1f" text-anchor="start" font-weight="800">No</text>
<rect x="320" y="170" width="120" height="30" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="380" y="190" font-size="9.4" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">KEY_NOT_FOUND</text>
<path d="M550 44 L624 86 L550 128 L476 86 Z" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<text x="550" y="82.5" font-size="11.6" fill="#8a5a12" text-anchor="middle" font-weight="700">Auth token</text>
<text x="550" y="99.5" font-size="11.6" fill="#8a5a12" text-anchor="middle" font-weight="700">valid and fresh</text>
<path d="M446 86 L 474 86" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M550 128 L 550 166" fill="none" stroke="#c2552d" stroke-width="1.4" marker-end="url(#m7)"/>
<text x="558" y="152" font-size="11" fill="#963f1f" text-anchor="start" font-weight="800">No</text>
<rect x="465.3" y="170" width="169.4" height="30" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="550" y="190" font-size="9.4" fill="#963f1f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">KEY_USER_NOT_AUTHENTICATED</text>
<path d="M720 44 L794 86 L720 128 L646 86 Z" fill="#fff" stroke="#c2552d" stroke-width="2"/>
<text x="720" y="82.5" font-size="11.6" fill="#963f1f" text-anchor="middle" font-weight="700">Checks inside</text>
<text x="720" y="99.5" font-size="11.6" fill="#963f1f" text-anchor="middle" font-weight="700">the KeyMint TA</text>
<path d="M616 86 L 644 86" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M720 128 L 720 166" fill="none" stroke="#c2552d" stroke-width="1.4" marker-end="url(#m7)"/>
<text x="728" y="152" font-size="11" fill="#963f1f" text-anchor="start" font-weight="800">No</text>
<rect x="644.15" y="170" width="151.7" height="30" rx="8" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="720" y="190" font-size="9.4" fill="#963f1f" text-anchor="middle" font-weight="700">Error code from KeyMint</text>
<path d="M794 86 L 830 86" fill="none" stroke="#0f8a6a" stroke-width="1.8" marker-end="url(#m4)"/>
<rect x="778" y="210" width="82" height="1" rx="12" fill="#fff"/>
<text x="812" y="70" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="800">Yes</text>
<rect x="20" y="222" width="840" height="50" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="440" y="245" font-size="12.4" fill="#0b6650" text-anchor="middle" font-weight="700">All four pass, so the operation runs in secure hardware and the result returns to the app.</text>
<text x="440" y="263" font-size="11" fill="#4a5263" text-anchor="middle">The third check applies only to keys that need user authentication.</text>
</svg>
