<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 597" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of Example 1 flows</title>
  <desc id="d">Setup, llm = ChatGoogleGenerativeAI(..., temperature=0.7), Some randomness, so that each run reasons in its own way. Chain, chain = cot_prompt | llm | parser, Think step by step, then one line FINAL ANSWER &lt;answer&gt;, {problem}. Loop, for i in range(n_samples), The same DPDP problem, sent once for each sample. Extract, extract_final_answer(response), Reads from the last line up, then removes the stars and the commas. Vote, vote_counts = {} and two loops, Counts each answer by hand, then keeps the highest count. Output, FINAL ANSWER, CONFIDENCE and VOTE DISTRIBUTION, 2000, with 5 of 5 votes in the real run. A loop goes back from stage 4 to stage 3, next sample.</desc>
