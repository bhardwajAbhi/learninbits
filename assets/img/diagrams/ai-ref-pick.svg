<rect x="566" y="524" width="294" height="44" rx="10" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="584" y="551" font-size="12.8" fill="#8a5a12" text-anchor="start" font-weight="700">Step-back</text>
<text x="844" y="551" font-size="11.4" fill="#8a5a12" text-anchor="end" font-weight="600">Chapter 11</text>
<rect x="20" y="578" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
