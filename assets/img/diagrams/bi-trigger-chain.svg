<text x="120" y="80" font-size="13" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">early-init</text>
<text x="120" y="136" font-size="11.4" fill="#4a5263" text-anchor="middle">Kernel settings, cgroups, bootchart</text>
<line x1="133" y1="104" x2="327" y2="104" stroke="#1c2230" stroke-width="4"/>
<circle cx="340" cy="104" r="13" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<text x="340" y="80" font-size="13" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">init</text>
<text x="340" y="136" font-size="11.4" fill="#4a5263" text-anchor="middle">Entropy, symlinks, cpuctl groups</text>
<line x1="353" y1="104" x2="547" y2="104" stroke="#1c2230" stroke-width="4"/>
<circle cx="560" cy="104" r="13" fill="#fff" stroke="#1c2230" stroke-width="3"/>
<text x="560" y="80" font-size="13" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">late-init</text>
<path d="M450 100 L 450 44 L 767 44" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="780" cy="44" r="11" fill="#fff" stroke="#b7791f" stroke-width="3"/>
<text x="798" y="49" font-size="13" fill="#8a5a12" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">charger</text>
<text x="780" y="76" font-size="11.4" fill="#8a5a12" text-anchor="middle">Charger mode only</text>
<path d="M560 117 L 560 172 L 52 172 L 52 240 L 87 240" fill="none" stroke="#1c2230" stroke-width="4"/>
<circle cx="100" cy="240" r="11" fill="#fff" stroke="#2f62c8" stroke-width="3"/>
<text x="100" y="220" font-size="12" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">early-fs</text>
<text x="100" y="268" font-size="11.2" fill="#4a5263" text-anchor="middle">Before mounts</text>
<circle cx="260" cy="240" r="11" fill="#fff" stroke="#2f62c8" stroke-width="3"/>
<text x="260" y="220" font-size="12" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">fs</text>
<text x="260" y="268" font-size="11.2" fill="#4a5263" text-anchor="middle">mount_all --early</text>
