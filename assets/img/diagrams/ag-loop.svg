<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A model that answers once compared with an agent that works in a loop</title>
  <desc id="d">Left, a model that answers once. The prompt goes to the model, the model writes from what it learned, and the answer comes out. Right or wrong, it stops there. Right, an agent that works in a loop toward a goal. It thinks and plans the next step, acts with a tool, observes what happened and adjusts the plan. Then it thinks again, and it stops when the goal is met.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="300" height="330" rx="14" fill="#fff" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="170" y="50" font-size="13.4" fill="#3f4a59" text-anchor="middle" font-weight="700">A model that answers once</text>
<rect x="60" y="76" width="220" height="58" rx="11" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="170" y="102" font-size="13" fill="#3f4a59" text-anchor="middle" font-weight="700">Prompt</text>
<text x="170" y="120" font-size="11.2" fill="#4a5263" text-anchor="middle">your question</text>
<path d="M170 136 L 170 162" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="60" y="164" width="220" height="58" rx="11" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="170" y="190" font-size="13" fill="#1f4a9e" text-anchor="middle" font-weight="700">Model</text>
<text x="170" y="208" font-size="11.2" fill="#4a5263" text-anchor="middle">writes from what it learned</text>
<path d="M170 224 L 170 250" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="60" y="252" width="220" height="58" rx="11" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="170" y="278" font-size="13" fill="#8a5a12" text-anchor="middle" font-weight="700">Answer</text>
<text x="170" y="296" font-size="11.2" fill="#4a5263" text-anchor="middle">right or wrong, it stops here</text>
<rect x="350" y="20" width="510" height="330" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="605" y="50" font-size="13.4" fill="#0b6650" text-anchor="middle" font-weight="700">An agent that works in a loop</text>
<rect x="520" y="70" width="170" height="46" rx="11" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.5"/>
<text x="605" y="97.68" font-size="13" fill="#3f4a59" text-anchor="middle" font-weight="700">Goal</text>
<path d="M605 118 L 605 140" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="530" y="140" width="150" height="50" rx="11" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="605" y="162" font-size="12.6" fill="#58378f" text-anchor="middle" font-weight="700">Think</text>
<text x="605" y="180" font-size="10.4" fill="#4a5263" text-anchor="middle">plan the next step</text>
<rect x="685" y="215" width="150" height="50" rx="11" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.5"/>
<text x="760" y="237" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Act</text>
<text x="760" y="255" font-size="10.4" fill="#4a5263" text-anchor="middle">use a tool, take a step</text>
<rect x="530" y="290" width="150" height="50" rx="11" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="605" y="312" font-size="12.6" fill="#8a5a12" text-anchor="middle" font-weight="700">Observe</text>
<text x="605" y="330" font-size="10.4" fill="#4a5263" text-anchor="middle">read what happened</text>
<rect x="375" y="215" width="150" height="50" rx="11" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.5"/>
<text x="450" y="237" font-size="12.6" fill="#095a61" text-anchor="middle" font-weight="700">Adjust</text>
<text x="450" y="255" font-size="10.4" fill="#4a5263" text-anchor="middle">keep or change the plan</text>
<path d="M682 170 C 740 175, 762 195, 762 212" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M762 268 C 762 290, 740 308, 682 312" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M528 312 C 470 308, 450 290, 450 268" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<path d="M450 212 C 450 195, 470 175, 528 170" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="560" y="226" width="90" height="28" rx="14" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="605" y="244.176" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Done?</text>
<text x="605" y="270" font-size="10.4" fill="#4a5263" text-anchor="middle">stop when the goal is met</text>
</svg>
