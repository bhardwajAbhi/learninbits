<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The move of fs_mgr to system/fs and the new mmd daemon</title>
  <desc id="d">Before Android 17, fs_mgr, liblp, libsnapshot, libdm and helper libraries lived in system/core. In Android 17 they moved to system/fs, with fs_mgr for fstab and first-stage mounts, liblp for super partition metadata, libsnapshot for Virtual A/B updates, libdm for device-mapper ioctls and a new Rust tool casefolding_remover. The new mmd daemon sets up zram devices, calls swapon, runs writeback and recompression and takes Binder calls from system_server through IMmd. Module names stay the same, so dependent code builds without changes.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="260" height="190" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="36" y="56" font-size="12.6" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">system/core (before)</text>
<text x="36" y="86" font-size="11.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">fs_mgr</text>
<text x="36" y="110" font-size="11.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">liblp</text>
<text x="36" y="134" font-size="11.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">libsnapshot</text>
<text x="36" y="158" font-size="11.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">libdm</text>
<text x="36" y="182" font-size="11.6" fill="#4a5263" text-anchor="start" font-family="JetBrains Mono, monospace">libfs_avb, libfiemap ...</text>
<path d="M280 125 L 330 125" fill="none" stroke="#0f8a6a" stroke-width="2" marker-end="url(#m4)"/>
<text x="305" y="115" font-size="10.6" fill="#0b6650" text-anchor="middle" font-weight="700">moved</text>
<rect x="334" y="30" width="260" height="190" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="350" y="56" font-size="12.6" fill="#0b6650" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">system/fs (Android 17)</text>
<text x="350" y="86" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">fs_mgr/</text>
<text x="580" y="86" font-size="10.4" fill="#4a5263" text-anchor="end">fstab, first-stage mounts</text>
<text x="350" y="110" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">fs_mgr/liblp</text>
<text x="580" y="110" font-size="10.4" fill="#4a5263" text-anchor="end">super partition metadata</text>
<text x="350" y="134" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">fs_mgr/libsnapshot</text>
<text x="580" y="134" font-size="10.4" fill="#4a5263" text-anchor="end">Virtual A/B updates</text>
<text x="350" y="158" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">fs_mgr/libdm</text>
<text x="580" y="158" font-size="10.4" fill="#4a5263" text-anchor="end">device-mapper ioctls</text>
<text x="350" y="182" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">casefolding_remover/</text>
<text x="580" y="182" font-size="10.4" fill="#4a5263" text-anchor="end">new Rust tool</text>
<rect x="630" y="30" width="230" height="190" rx="12" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.5"/>
<text x="646" y="56" font-size="15" fill="#58378f" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="800">mmd</text>
<text x="646" y="76" font-size="11.4" fill="#4a5263" text-anchor="start" font-weight="600">Memory management daemon</text>
<text x="646" y="104" font-size="11.2" fill="#1c2230" text-anchor="start">Sets up zram devices</text>
<text x="646" y="126" font-size="11.2" fill="#1c2230" text-anchor="start">and calls swapon</text>
<text x="646" y="148" font-size="11.2" fill="#1c2230" text-anchor="start">Writeback and recompression</text>
<text x="646" y="170" font-size="11.2" fill="#1c2230" text-anchor="start">Takes Binder calls from</text>
<text x="646" y="192" font-size="11.2" fill="#1c2230" text-anchor="start">system_server through IMmd</text>
<rect x="20" y="238" width="840" height="40" rx="10" fill="#f2efe8"/>
<text x="440" y="263" font-size="11.6" fill="#1c2230" text-anchor="middle" font-weight="500">Module names stay the same, so code that depends on libfs_mgr or libsnapshot builds without changes.</text>
</svg>
