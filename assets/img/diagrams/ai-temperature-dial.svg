<rect x="678" y="166" width="124" height="20" rx="5" fill="#f3f1ec"/>
<rect x="678" y="166" width="28.52" height="20" rx="5" fill="#c2552d" fill-opacity="0.85"/>
<text x="844" y="181" font-size="12" fill="#963f1f" text-anchor="end" font-weight="700">23%</text>
<text x="608" y="224" font-size="12.3" fill="#1c2230" text-anchor="start" font-weight="600">email</text>
<rect x="678" y="210" width="124" height="20" rx="5" fill="#f3f1ec"/>
