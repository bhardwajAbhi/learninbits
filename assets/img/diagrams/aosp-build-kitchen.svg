<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside the m command</title>
  <desc id="d">Android.bp files go to Soong. Old Android.mk files and the product settings go to Kati. Both make a build plan in Ninja format. The executor, Siso or Ninja, runs the compilers in parallel. The result is the images.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker>
  </defs>

  <!-- column labels -->
  <g font-size="11" font-weight="700" letter-spacing="1.2" fill="#7b8292" text-anchor="middle">
    <text x="110" y="24">RECIPES</text>
    <text x="320" y="24">PLANNERS</text>
    <text x="530" y="24">ONE PLAN</text>
    <text x="760" y="24">WORKERS AND RESULT</text>
  </g>

  <!-- recipes -->
  <rect x="20" y="50" width="180" height="96" rx="12" fill="#ffffff" stroke="#2f62c8" stroke-width="2"/>
  <text x="110" y="80" font-size="15" font-weight="700" text-anchor="middle" fill="#1f448f">Android.bp files</text>
  <text x="110" y="101" font-size="12" text-anchor="middle" fill="#4a5263">one in each project:</text>
  <text x="110" y="119" font-size="12" text-anchor="middle" fill="#4a5263">"build this library</text>
  <text x="110" y="135" font-size="12" text-anchor="middle" fill="#4a5263">from these files"</text>

  <rect x="20" y="190" width="180" height="96" rx="12" fill="#ffffff" stroke="#9aa0ab" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="110" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#4a5263">Android.mk files</text>
  <text x="110" y="241" font-size="12" text-anchor="middle" fill="#4a5263">the old format,</text>
  <text x="110" y="259" font-size="12" text-anchor="middle" fill="#4a5263">plus the product and</text>
  <text x="110" y="275" font-size="12" text-anchor="middle" fill="#4a5263">board settings</text>

  <!-- planners -->
  <rect x="240" y="62" width="160" height="72" rx="12" fill="#2f62c8"/>
  <text x="320" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Soong</text>
  <text x="320" y="114" font-size="11.5" text-anchor="middle" fill="#dbe5fb">written in Go</text>
  <rect x="240" y="202" width="160" height="72" rx="12" fill="#b7791f"/>
  <text x="320" y="233" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Kati</text>
  <text x="320" y="254" font-size="11.5" text-anchor="middle" fill="#fbecd3">reads the Make files</text>

  <!-- plan -->
  <rect x="440" y="120" width="180" height="96" rx="12" fill="#f2efe8" stroke="#1c2230" stroke-width="1.6"/>
  <text x="530" y="152" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2230">Build plan</text>
  <text x="530" y="173" font-size="12" font-family="JetBrains Mono, monospace" text-anchor="middle" fill="#4a5263">.ninja files</text>
  <text x="530" y="194" font-size="11.5" text-anchor="middle" fill="#4a5263">every step and its order</text>

  <!-- workers -->
  <rect x="660" y="62" width="200" height="80" rx="12" fill="#7a4fc2"/>
  <text x="760" y="93" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Siso or Ninja</text>
  <text x="760" y="114" font-size="11.5" text-anchor="middle" fill="#e9defa">runs the steps in parallel</text>
  <text x="760" y="130" font-size="11.5" text-anchor="middle" fill="#e9defa">(Siso in Android 17)</text>

  <g font-size="11" text-anchor="middle" fill="#1c2230">
    <rect x="660" y="156" width="62" height="28" rx="6" fill="#ffffff" stroke="#cfc9bb"/><text x="691" y="174">clang</text>
    <rect x="729" y="156" width="62" height="28" rx="6" fill="#ffffff" stroke="#cfc9bb"/><text x="760" y="174">javac</text>
    <rect x="798" y="156" width="62" height="28" rx="6" fill="#ffffff" stroke="#cfc9bb"/><text x="829" y="174">rustc</text>
  </g>

  <rect x="660" y="214" width="200" height="72" rx="12" fill="#0f8a6a"/>
  <text x="760" y="245" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Images</text>
  <text x="760" y="266" font-size="11.5" text-anchor="middle" fill="#d8f2ea">system, vendor, boot, super</text>

  <!-- arrows -->
  <line x1="202" y1="98" x2="236" y2="98" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="202" y1="238" x2="236" y2="238" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <path d="M402 98 C425 98 425 140 436 150" fill="none" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <path d="M402 238 C425 238 425 196 436 186" fill="none" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <path d="M622 160 C640 160 640 102 656 102" fill="none" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="186" x2="760" y2="210" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>

  <!-- analogy strip -->
  <rect x="20" y="320" width="840" height="60" rx="12" fill="#fdf4e3"/>
  <text x="450" y="346" font-size="13" font-weight="700" text-anchor="middle" fill="#7a4f10">Like a large kitchen</text>
  <text x="450" y="366" font-size="12.5" text-anchor="middle" fill="#4a5263">Recipe cards, two planners who write one work plan, many cooks who work at the same time and plates that leave the kitchen.</text>
</svg>
