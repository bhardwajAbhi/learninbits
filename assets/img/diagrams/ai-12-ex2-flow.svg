<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 527" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the two chains of Example 2 flow</title>
  <desc id="d">Data, for i, problem in enumerate(problems, 1), 3 app security calculations, one at a time. Chain 1, decompose_chain = decompose_prompt | llm | parser, List subproblems from simplest to most complex, {problem}. Output, subproblems, the plan already solves some problems. Chain 2, solve_chain = solve_prompt | llm | parser, Solve in order, reuse each result, {subproblems} and {problem}. Output, STEP-BY-STEP SOLUTION, 15.84% (wrong), 270 hours, 16 days (wrong). A loop goes back from stage 5 to stage 1, next problem.</desc>
