<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Guardian agents</title>
  <desc id="d">A loop of five steps, namely data ingestion, integrity assessment, operation enablement, action execution and a feedback loop. Sentinels watch, build a baseline and give insights. Operatives act when something is wrong. An orchestrator links them.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<circle cx="300" cy="205" r="150" fill="none" stroke="#d9d4c7" stroke-width="6"/>
<rect x="218" y="29" width="164" height="52" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<text x="300" y="51" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Data ingestion</text>
<text x="300" y="68" font-size="10.3" fill="#4a5263" text-anchor="middle">logs, code, threats</text>
<rect x="360.658" y="132.647" width="164" height="52" rx="10" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<text x="442.658" y="154.647" font-size="12" fill="#58378f" text-anchor="middle" font-weight="700">Integrity assessment</text>
<text x="442.658" y="171.647" font-size="10.3" fill="#4a5263" text-anchor="middle">on a schedule or a change</text>
<rect x="306.168" y="300.353" width="164" height="52" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<text x="388.168" y="322.353" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Operation enablement</text>
<text x="388.168" y="339.353" font-size="10.3" fill="#4a5263" text-anchor="middle">update the baseline, monitor</text>
<rect x="129.832" y="300.353" width="164" height="52" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.8"/>
<text x="211.832" y="322.353" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="700">Action execution</text>
<text x="211.832" y="339.353" font-size="10.3" fill="#4a5263" text-anchor="middle">an anomaly or a fix</text>
<rect x="75.3415" y="132.647" width="164" height="52" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<text x="157.342" y="154.647" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="700">Feedback loop</text>
<text x="157.342" y="171.647" font-size="10.3" fill="#4a5263" text-anchor="middle">log it, learn, repeat</text>
<circle cx="300" cy="205" r="46" fill="#1c2230"/>
<text x="300" y="202" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Guardian</text>
<text x="300" y="218" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">agents</text>
<rect x="560" y="30" width="300" height="100" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<path d="M572 30 h276 a12 12 0 0 1 12 12 v22 h-300 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="574" y="51.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">Sentinels</text>
<text x="574" y="86" font-size="12" fill="#4a5263" text-anchor="start">watch, build a baseline and</text>
<text x="574" y="104.6" font-size="12" fill="#4a5263" text-anchor="start">give real-time insights</text>
<rect x="560" y="150" width="300" height="100" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.6"/>
<path d="M572 150 h276 a12 12 0 0 1 12 12 v22 h-300 v-22 a12 12 0 0 1 12 -12z" fill="#c2552d"/>
<text x="574" y="171.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">Operatives</text>
<text x="574" y="206" font-size="12" fill="#4a5263" text-anchor="start">act when something is wrong,</text>
<text x="574" y="224.6" font-size="12" fill="#4a5263" text-anchor="start">using the baseline</text>
<rect x="560" y="270" width="300" height="76" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.6"/>
<path d="M572 270 h276 a12 12 0 0 1 12 12 v22 h-300 v-22 a12 12 0 0 1 12 -12z" fill="#5d6b7e"/>
<text x="574" y="291.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">One orchestrator</text>
<text x="574" y="326" font-size="12" fill="#4a5263" text-anchor="start">links the sentinels and operatives</text>
</svg>
