<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one call of the chain in Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, prompt, llm, Gemini API. Step 1, Your code to prompt, chain.invoke({&quot;text&quot; ...}), the chain gives the dictionary to its first part. Step 2, prompt to prompt, Fill {text}, one human message with the full sentence. Step 3, prompt to llm, Prompt value, the output of the template is the input of the model. Step 4, llm to Gemini API, HTTPS request with the API key, the provider&#x27;s default settings. Step 5, Gemini API to llm, Reply in Hindi, 12 input, 17 output tokens. Step 6, llm to Your code, AIMessage, the code prints content and usage_metadata.</desc>
