<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One question with three different system messages</title>
  <desc id="d">One question about phishing goes into three message lists. Each list has a system message with a role and a human message with the same question. The analyst role gives technical terms, attack stages, indicators and controls. The CISO role gives business risk, impact, governance and an executive tone. The teacher role gives simple Hindi, a classroom story and the rule STOP, CHECK, REPORT.</desc>
