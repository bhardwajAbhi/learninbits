<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A call through a proxy and a stub</title>
  <desc id="d">Left, the client process. Your code calls foo.getName(). The proxy BpFoo writes the arguments into a Parcel. BpBinder holds handle 7 and sends the call to the Binder driver. The driver maps handle 7 to the node in the server. Right, the server process. BBinder, the local object, receives the call. The stub BnFoo reads the Parcel and calls FooImpl, your implementation. Both sides use the same interface IFoo.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="330" height="300" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="185" y="44" font-size="13" fill="#1f4a9e" text-anchor="middle" font-weight="700">Client process</text>
<rect x="530" y="20" width="330" height="300" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="695" y="44" font-size="13" fill="#0b6650" text-anchor="middle" font-weight="700">Server process</text>
<rect x="50" y="64" width="270" height="58" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="185" y="90" font-size="12.6" fill="#3f4a59" text-anchor="middle" font-weight="700">Your code</text>
<text x="185" y="108" font-size="11" fill="#4a5263" text-anchor="middle">calls foo.getName()</text>
<path d="M185 124 L 185 144" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="50" y="146" width="270" height="58" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="185" y="172" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">BpFoo, the proxy</text>
<text x="185" y="190" font-size="11" fill="#4a5263" text-anchor="middle">writes the Parcel</text>
<path d="M185 206 L 185 226" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="50" y="228" width="270" height="58" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="185" y="254" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">BpBinder</text>
<text x="185" y="272" font-size="11" fill="#4a5263" text-anchor="middle">holds handle 7</text>
<rect x="560" y="64" width="270" height="58" rx="10" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="695" y="90" font-size="12.6" fill="#3f4a59" text-anchor="middle" font-weight="700">FooImpl</text>
<text x="695" y="108" font-size="11" fill="#4a5263" text-anchor="middle">your implementation</text>
<path d="M695 144 L 695 124" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="560" y="146" width="270" height="58" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="695" y="172" font-size="12.6" fill="#0b6650" text-anchor="middle" font-weight="700">BnFoo, the stub</text>
<text x="695" y="190" font-size="11" fill="#4a5263" text-anchor="middle">reads the Parcel</text>
<path d="M695 226 L 695 206" fill="none" stroke="#1c2230" stroke-width="1.5" marker-end="url(#m0)"/>
<rect x="560" y="228" width="270" height="58" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="695" y="254" font-size="12.6" fill="#0b6650" text-anchor="middle" font-weight="700">BBinder</text>
<text x="695" y="272" font-size="11" fill="#4a5263" text-anchor="middle">the local object</text>
<rect x="370" y="222" width="140" height="58" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.4"/>
<text x="440" y="246" font-size="12.4" fill="#963f1f" text-anchor="middle" font-weight="700">Binder driver</text>
<text x="440" y="264" font-size="10.8" fill="#4a5263" text-anchor="middle">handle 7 to node</text>
<path d="M322 251 L 368 251" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<path d="M512 251 L 558 251" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<text x="440" y="344" font-size="11.4" fill="#4a5263" text-anchor="middle" font-weight="600">Both sides implement the same interface, IFoo.</text>
</svg>
