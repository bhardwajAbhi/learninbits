<rect x="24" y="24" width="264" height="120" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.8"/>
<rect x="24" y="24" width="7" height="120" rx="3" fill="#2f62c8"/>
<text x="48" y="58" font-size="15.5" fill="#1f4a9e" text-anchor="start" font-weight="700">Credibility</text>
<text x="48" y="84" font-size="13.5" fill="#4a5263" text-anchor="start">Recognized expertise</text>
<text x="48" y="104" font-size="13.5" fill="#4a5263" text-anchor="start">in your domain</text>

<rect x="308" y="24" width="264" height="120" rx="14" fill="#fff" stroke="#7a4fc2" stroke-width="1.8"/>
<rect x="308" y="24" width="7" height="120" rx="3" fill="#7a4fc2"/>
<text x="332" y="58" font-size="15.5" fill="#58378f" text-anchor="start" font-weight="700">Structured thinking</text>
<text x="332" y="84" font-size="13.5" fill="#4a5263" text-anchor="start">Systematic, logical</text>
<text x="332" y="104" font-size="13.5" fill="#4a5263" text-anchor="start">problem solving</text>

<rect x="592" y="24" width="264" height="120" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.8"/>
<rect x="592" y="24" width="7" height="120" rx="3" fill="#b7791f"/>
<text x="616" y="58" font-size="15.5" fill="#8a5a12" text-anchor="start" font-weight="700">Recognition</text>
<text x="616" y="84" font-size="13.5" fill="#4a5263" text-anchor="start">Citations, awards</text>
<text x="616" y="104" font-size="13.5" fill="#4a5263" text-anchor="start">and visibility</text>

<rect x="24" y="170" width="264" height="120" rx="14" fill="#fff" stroke="#0f8a6a" stroke-width="1.8"/>
<rect x="24" y="170" width="7" height="120" rx="3" fill="#0f8a6a"/>
<text x="48" y="204" font-size="15.5" fill="#0b6650" text-anchor="start" font-weight="700">Career growth</text>
<text x="48" y="230" font-size="13.5" fill="#4a5263" text-anchor="start">Promotions, degrees,</text>
<text x="48" y="250" font-size="13.5" fill="#4a5263" text-anchor="start">invitations, new roles</text>
