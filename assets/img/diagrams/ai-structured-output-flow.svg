<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a Pydantic model becomes structured output</title>
  <desc id="d">A Pydantic model, for example PrivacyPolicyAnalysis with app_name, data_practices and overall_transparency of LOW, MEDIUM or HIGH, goes to a JsonOutputParser. Its get_format_instructions method writes a JSON schema and the rules as plain text. The prompt template puts them into the placeholder format_instructions, next to the privacy policy. The model writes JSON text. The JsonOutputParser turns the JSON text into a Python dictionary, and your code reads values such as result app_name. A note says that the parser checks only that the text is JSON, not the types, allowed values or limits, so your code must check them.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="230" height="150" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.7"/>
<text x="36" y="57" font-size="14" fill="#58378f" text-anchor="start" font-weight="700">Pydantic model</text>
<text x="36" y="80" font-size="11.5" fill="#4a5263" text-anchor="start">class PrivacyPolicyAnalysis</text>
<text x="36" y="98" font-size="11.5" fill="#4a5263" text-anchor="start">app_name  str</text>
<text x="36" y="116" font-size="11.5" fill="#4a5263" text-anchor="start">data_practices  list</text>
<text x="36" y="134" font-size="11.5" fill="#4a5263" text-anchor="start">overall_transparency</text>
<text x="36" y="152" font-size="11.5" fill="#4a5263" text-anchor="start">LOW, MEDIUM or HIGH</text>
<path d="M250 100 L 286 100" fill="none" stroke="#7a4fc2" stroke-width="1.6" marker-end="url(#m5)"/>
<rect x="290" y="30" width="250" height="150" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<text x="306" y="57" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">JsonOutputParser</text>
<text x="306" y="80" font-size="11.8" fill="#4a5263" text-anchor="start">get_format_instructions()</text>
<text x="306" y="98" font-size="11.8" fill="#4a5263" text-anchor="start">writes a JSON schema and</text>
<text x="306" y="116" font-size="11.8" fill="#4a5263" text-anchor="start">the rules as plain text</text>
<path d="M540 100 L 576 100" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<rect x="580" y="30" width="280" height="150" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.7"/>
<text x="596" y="57" font-size="14" fill="#1f4a9e" text-anchor="start" font-weight="700">Prompt template</text>
<text x="596" y="80" font-size="12" fill="#4a5263" text-anchor="start">Your instructions</text>
<text x="596" y="98" font-size="12" fill="#4a5263" text-anchor="start">{format_instructions}</text>
<text x="596" y="116" font-size="12" fill="#4a5263" text-anchor="start">{privacy_policy}</text>
<path d="M720 180 L 720 222" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<rect x="580" y="226" width="280" height="80" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<text x="596" y="253" font-size="14" fill="#3f4a59" text-anchor="start" font-weight="700">Model</text>
<text x="596" y="276" font-size="12" fill="#4a5263" text-anchor="start">Writes JSON text</text>
<path d="M580 266 L 544 266" fill="none" stroke="#5d6b7e" stroke-width="1.6" marker-end="url(#m8)"/>
<rect x="290" y="226" width="250" height="80" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.7"/>
<text x="306" y="253" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">JsonOutputParser</text>
<text x="306" y="276" font-size="12" fill="#4a5263" text-anchor="start">Turns the JSON text</text>
<text x="306" y="294" font-size="12" fill="#4a5263" text-anchor="start">into a Python dict</text>
<path d="M290 266 L 254 266" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<rect x="20" y="226" width="230" height="80" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.7"/>
<text x="36" y="253" font-size="14" fill="#0b6650" text-anchor="start" font-weight="700">Your code</text>
<text x="36" y="276" font-size="12" fill="#4a5263" text-anchor="start">result[&#x27;app_name&#x27;]</text>
<rect x="20" y="330" width="840" height="56" rx="10" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="40" y="354" font-size="12.5" fill="#963f1f" text-anchor="start" font-weight="600">The parser checks only that the text is JSON. It does not check the types, the allowed</text>
<text x="40" y="373" font-size="12.5" fill="#963f1f" text-anchor="start" font-weight="600">values or the limits of the Pydantic model. Your code must check them.</text>
</svg>
