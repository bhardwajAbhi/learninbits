<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The Soong modules that connect a flag to the code that uses it</title>
  <desc id="d">The release configuration variable RELEASE_ACONFIG_VALUE_SETS names aconfig_value_set modules, which hold aconfig_values modules for package A and package B. Each aconfig_declarations module with .aconfig files, a package and a container gets the matching values as an implicit dependency, and create-cache makes one cache per package. From it, java_aconfig_library, cc_aconfig_library and rust_aconfig_library generate libraries that a Java or Kotlin module uses through static_libs, a C++ module through shared_libs and a Rust module through rustlibs. Across the whole tree, all_aconfig_declarations makes one file with every flag, the storage files and the list of finalized flags, and exported_java_aconfig_library makes android-flags.jar in the SDK for apps outside the platform.</desc>
