<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The main loop of second-stage init and its event sources</title>
  <desc id="d">A ring of six steps that repeat forever on one thread. CheckShutdown looks for a pending reboot. ExecuteOneCommand runs one command of one action. HandleProcessActions handles restarts and timeouts. The loop then computes the timeout, which is now, later or never. epoll.Wait sleeps until an event. HandleControlMessages processes ctl.start and ctl.stop. On the left, four event sources wake epoll. A signalfd for SIGCHLD reports that a child process ended. An eventfd wakes the loop when the property thread has new work. A signalfd for SIGTERM exists only without CAP_SYS_BOOT. Mount events update mount properties. ReapAnyOutstandingChildren always runs as the first callback.</desc>
