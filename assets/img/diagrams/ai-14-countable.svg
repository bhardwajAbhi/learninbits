<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What a vote can count</title>
  <desc id="d">Left, a short answer of a fixed form. Three replies write FINAL ANSWER 2,000, FINAL ANSWER 2000 in bold stars and Final Answer 2000 with a dot. After the code cleans up the case, the stars, the commas and the dot, the three answers become one vote for 2000. This works for numbers, labels and yes or no. Right, a long written answer. Two replies say that the app looks suspicious, because its SMS permissions do not fit its features, and that its permissions do not match what it does, so treat it as suspicious. They mean the same, but the counter sees two different texts, so each gets one vote.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="410" height="250" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.5"/>
<text x="40" y="46" font-size="12.8" fill="#0b6650" text-anchor="start" font-weight="700">A short answer of a fixed form</text>
<rect x="40" y="62" width="220" height="30" rx="7" fill="#1f2633"/>
<text x="52" y="82" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">FINAL ANSWER: 2,000</text>
<path d="M262 77 C 290 77, 290 122, 312 122" fill="none" stroke="#d9d4c7" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="40" y="102" width="220" height="30" rx="7" fill="#1f2633"/>
<text x="52" y="122" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">FINAL ANSWER: **2000**</text>
<path d="M262 117 C 290 117, 290 122, 312 122" fill="none" stroke="#d9d4c7" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="40" y="142" width="220" height="30" rx="7" fill="#1f2633"/>
<text x="52" y="162" font-size="11.2" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">Final Answer: 2000.</text>
<path d="M262 157 C 290 157, 290 122, 312 122" fill="none" stroke="#d9d4c7" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="316" y="108" width="96" height="28" rx="14" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="364" y="126.464" font-size="12.4" fill="#0b6650" text-anchor="middle" font-weight="700">2000</text>
<text x="40" y="210" font-size="11.6" fill="#1c2230" text-anchor="start">Clean up the case, the stars, the commas and</text>
<text x="40" y="228" font-size="11.6" fill="#1c2230" text-anchor="start">the dot, and three answers become one vote.</text>
<text x="40" y="254" font-size="11.6" fill="#0b6650" text-anchor="start" font-weight="700">Numbers, labels, yes or no</text>
<rect x="450" y="20" width="410" height="250" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.5"/>
<text x="470" y="46" font-size="12.8" fill="#963f1f" text-anchor="start" font-weight="700">A long written answer</text>
<text x="470" y="76" font-size="11.4" fill="#1c2230" text-anchor="start" font-style="italic">&quot;The app looks suspicious, because its</text>
<text x="470" y="96" font-size="11.4" fill="#1c2230" text-anchor="start" font-style="italic">SMS permissions do not fit its features.&quot;</text>
<text x="470" y="130" font-size="11.4" fill="#1c2230" text-anchor="start" font-style="italic">&quot;Its permissions do not match what it</text>
<text x="470" y="150" font-size="11.4" fill="#1c2230" text-anchor="start" font-style="italic">does, so treat it as suspicious.&quot;</text>
<text x="470" y="186" font-size="11.6" fill="#1c2230" text-anchor="start">Same meaning, different words.</text>
<text x="470" y="204" font-size="11.6" fill="#1c2230" text-anchor="start">The counter sees two different texts.</text>
<rect x="470" y="222" width="170" height="28" rx="14" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="555" y="240.104" font-size="11.4" fill="#963f1f" text-anchor="middle" font-weight="700">2 answers, 1 vote each</text>
</svg>
