<text x="348" y="322" font-size="15.5" fill="#8a5a12" text-anchor="start" font-weight="700">Workshops, symposia</text>
<text x="348" y="346" font-size="12.5" fill="#1c2230" text-anchor="start">Early ideas, work in</text>
