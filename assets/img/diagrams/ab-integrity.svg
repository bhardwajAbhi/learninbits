<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A Play Integrity check before a payment</title>
  <desc id="d">Four lanes, your app, Google Play, your server and the payment step. One, the server and the app agree on the payment details to protect. Two, the app asks Google Play for an integrity token with a hash of those details. Three, Play returns a signed and encrypted token. Four, the app sends the token with the payment request. Five, the server decodes the token with Google and reads the verdicts. Six, the server allows the payment only on a trusted device. The decision is made on the server, because code on the device can be changed.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="25" y="20" width="170" height="40" rx="10" fill="#2f62c8"/>
<text x="110" y="45" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">Your app</text>
<line x1="110" y1="60" x2="110" y2="330" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="245" y="20" width="170" height="40" rx="10" fill="#0f8a6a"/>
<text x="330" y="45" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">Google Play</text>
<line x1="330" y1="60" x2="330" y2="330" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="475" y="20" width="170" height="40" rx="10" fill="#7a4fc2"/>
<text x="560" y="45" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">Your server</text>
<line x1="560" y1="60" x2="560" y2="330" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="695" y="20" width="170" height="40" rx="10" fill="#b7791f"/>
<text x="780" y="45" font-size="12.4" fill="#fff" text-anchor="middle" font-weight="700">Payment step</text>
<line x1="780" y1="60" x2="780" y2="330" stroke="#d9d4c7" stroke-width="1.6" stroke-dasharray="5 5"/>
<path d="M556 86 L 116 86" fill="none" stroke="#7a4fc2" stroke-width="1.7" marker-end="url(#m5)"/>
<text x="335" y="78" font-size="11.4" fill="#58378f" text-anchor="middle" font-weight="600">1  the payment details to protect</text>
<path d="M114 126 L 324 126" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<text x="220" y="118" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-weight="600">2  ask for a token with their hash</text>
<path d="M326 166 L 116 166" fill="none" stroke="#0f8a6a" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#m4)"/>
<text x="220" y="158" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="600">3  signed and encrypted token</text>
<path d="M114 206 L 554 206" fill="none" stroke="#2f62c8" stroke-width="1.7" marker-end="url(#m3)"/>
<text x="335" y="198" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-weight="600">4  token with the payment request</text>
<rect x="478" y="220" width="164" height="56" rx="8" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.3"/>
<text x="560" y="240" font-size="11.2" fill="#58378f" text-anchor="middle" font-weight="700">5  Decode with Google</text>
<text x="560" y="258" font-size="11.2" fill="#4a5263" text-anchor="middle">and read the verdicts</text>
<path d="M564 298 L 774 298" fill="none" stroke="#b7791f" stroke-width="1.7" marker-end="url(#m6)"/>
<text x="670" y="290" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="600">6  allow only on a trusted device</text>
<text x="440" y="350" font-size="11.8" fill="#4a5263" text-anchor="middle" font-style="italic">The decision is made on the server. Code on the device can be changed, so it cannot decide alone.</text>
</svg>
