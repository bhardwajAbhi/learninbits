<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The class family of libbinder</title>
  <desc id="d">IBinder is the base class, with transact, linkToDeath and queryLocalInterface. BBinder is the local object in the server, with a final transact that calls the virtual onTransact. BpBinder is the proxy in the client, with a kernel handle or an RPC session. BnInterface of IFoo combines BBinder and IFoo. BpInterface of IFoo combines BpRefBase and IFoo. IFoo derives from IInterface and declares getName. The AIDL compiler generates BnFoo, with an onTransact switch, and BpFoo, which writes the Parcel. FooImpl, your code, derives from BnFoo and returns the value.</desc>
