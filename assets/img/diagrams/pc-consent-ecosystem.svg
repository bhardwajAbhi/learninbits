<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Consent governance across the data ecosystem</title>
  <desc id="d">The Data Principal gets a notice and gives consent to a consent collector. A data collector stores the data. Threat modeling and recommendations feed an augmented DPIA that the DPO reviews. Business uses are recorded in the RoPA. Uses beyond the purpose go through PETs first. A rights portal gives control back to the person.</desc>
