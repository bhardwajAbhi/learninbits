<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Play Integrity on top of key attestation</title>
  <desc id="d">On the device, the app calls the Play Integrity API. Google Play services collects signals, including a hardware key attestation on Android 13 and later, from KeyMint with the boot state and the patch levels. The signals go to the Google Play servers, which return a signed verdict that your server decodes. The verdict has deviceIntegrity with labels such as MEETS_BASIC, MEETS_DEVICE and MEETS_STRONG, appIntegrity with PLAY_RECOGNIZED, accountDetails with LICENSED and requestDetails with the request hash and the time. Play Integrity builds on key attestation, and Google does the verification, but your server still decides.</desc>
