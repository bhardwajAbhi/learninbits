<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SMS compared with Firebase Cloud Messaging</title>
  <desc id="d">SMS travels as plain text in the network, where operators and some attacks can read it. Its sender can be faked, and apps with SMS access on the device can read it. Firebase Cloud Messaging is encrypted in transit with TLS, goes only to a token of your app, and can carry a signal so that the app fetches the data over HTTPS. For a one-time code by SMS, use the SMS Retriever API so that the app needs no SMS permission.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="34" width="400" height="220" rx="16" fill="#fbecec" fill-opacity="0.55"/>
<rect x="20" y="34" width="400" height="220" rx="16" fill="none" stroke="#c2552d" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="36" y="21" width="50.8" height="26" rx="13" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="61.4" y="38.5" font-size="12.5" fill="#963f1f" text-anchor="middle" font-weight="700">SMS</text>
<rect x="40" y="66" width="360" height="50" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.3"/>
<text x="56" y="87" font-size="12.2" fill="#963f1f" text-anchor="start" font-weight="700">Plain text in the network</text>
<text x="56" y="105" font-size="11.2" fill="#4a5263" text-anchor="start">Operators and some attacks can read it</text>
<rect x="40" y="126" width="360" height="50" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.3"/>
<text x="56" y="147" font-size="12.2" fill="#963f1f" text-anchor="start" font-weight="700">Sender can be faked</text>
<text x="56" y="165" font-size="11.2" fill="#4a5263" text-anchor="start">A message looks like your brand</text>
<rect x="40" y="186" width="360" height="50" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.3"/>
<text x="56" y="207" font-size="12.2" fill="#963f1f" text-anchor="start" font-weight="700">Other apps can read it</text>
<text x="56" y="225" font-size="11.2" fill="#4a5263" text-anchor="start">Apps with SMS access on the device</text>
<rect x="460" y="34" width="400" height="220" rx="16" fill="#e3f4ee" fill-opacity="0.55"/>
<rect x="460" y="34" width="400" height="220" rx="16" fill="none" stroke="#0f8a6a" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="476" y="21" width="210.4" height="26" rx="13" fill="#fff" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="581.2" y="38.5" font-size="12.5" fill="#0b6650" text-anchor="middle" font-weight="700">Firebase Cloud Messaging</text>
<rect x="480" y="66" width="360" height="50" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="496" y="87" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">Encrypted in transit</text>
<text x="496" y="105" font-size="11.2" fill="#4a5263" text-anchor="start">TLS from your server to the device</text>
<rect x="480" y="126" width="360" height="50" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="496" y="147" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">Only your app gets it</text>
<text x="496" y="165" font-size="11.2" fill="#4a5263" text-anchor="start">Sent to a token of your app</text>
<rect x="480" y="186" width="360" height="50" rx="10" fill="#fff" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="496" y="207" font-size="12.2" fill="#0b6650" text-anchor="start" font-weight="700">Data can be fetched later</text>
<text x="496" y="225" font-size="11.2" fill="#4a5263" text-anchor="start">Send a signal, then fetch over HTTPS</text>
<text x="440" y="280" font-size="11.8" fill="#4a5263" text-anchor="middle" font-style="italic">For a one-time code by SMS, use the SMS Retriever API, so the app needs no SMS permission.</text>
</svg>
