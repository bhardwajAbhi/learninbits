<text x="146" y="52" font-size="13.6" fill="#3f4a59" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">prompt</text>
<text x="146" y="74" font-size="12.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace">&quot;Write a one sentense security awareness message about phishing emails.&quot;</text>
