<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How APK Inspector works</title>
  <desc id="d">You right-click an APK in the file manager. A Nautilus script starts the Python app. The app runs aapt, apksigner, openssl and unzip on the APK. The results show in one window with ten tabs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker>
  </defs>

  <!-- 1 APK -->
  <rect x="20" y="90" width="130" height="120" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="2"/>
  <path d="M60 112h34l16 16v46H60z" fill="#fff" stroke="#0f8a6a" stroke-width="2"/>
  <path d="M94 112v16h16" fill="none" stroke="#0f8a6a" stroke-width="2"/>
  <text x="85" y="160" font-size="11" font-weight="700" text-anchor="middle" fill="#0b5e48">.apk</text>
  <text x="85" y="198" font-size="13" font-weight="600" text-anchor="middle" fill="#1c2230">Your APK file</text>

  <!-- 2 right click -->
  <rect x="190" y="90" width="150" height="120" rx="12" fill="#f2efe8" stroke="#9aa0ab" stroke-width="1.5"/>
  <text x="265" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2230">Right-click</text>
  <rect x="208" y="130" width="114" height="22" rx="4" fill="#fff" stroke="#cfc9bb"/>
  <text x="265" y="145" font-size="11" text-anchor="middle" fill="#4a5263">Scripts</text>
  <rect x="208" y="154" width="114" height="22" rx="4" fill="#2f62c8"/>
  <text x="265" y="169" font-size="11" text-anchor="middle" fill="#fff">Get APK Details</text>
  <text x="265" y="198" font-size="11.5" text-anchor="middle" fill="#4a5263">in the file manager</text>

  <!-- 3 python app -->
  <rect x="380" y="90" width="140" height="120" rx="12" fill="#e5ecfb" stroke="#2f62c8" stroke-width="2"/>
  <text x="450" y="132" font-size="13" font-weight="700" text-anchor="middle" fill="#1f448f">apk_inspector.py</text>
  <text x="450" y="154" font-size="11.5" text-anchor="middle" fill="#4a5263">Python 3</text>
  <text x="450" y="172" font-size="11.5" text-anchor="middle" fill="#4a5263">runs the tools,</text>
  <text x="450" y="188" font-size="11.5" text-anchor="middle" fill="#4a5263">reads the results</text>

  <!-- 4 tools -->
  <rect x="560" y="40" width="130" height="220" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="2"/>
  <text x="625" y="66" font-size="12" font-weight="700" text-anchor="middle" fill="#7a4f10">Command-line tools</text>
  <g font-size="12" font-family="JetBrains Mono, monospace" text-anchor="middle" fill="#1c2230">
    <rect x="578" y="82" width="94" height="30" rx="6" fill="#fff" stroke="#e0c58f"/><text x="625" y="102">aapt</text>
    <rect x="578" y="120" width="94" height="30" rx="6" fill="#fff" stroke="#e0c58f"/><text x="625" y="140">apksigner</text>
    <rect x="578" y="158" width="94" height="30" rx="6" fill="#fff" stroke="#e0c58f"/><text x="625" y="178">openssl</text>
    <rect x="578" y="196" width="94" height="30" rx="6" fill="#fff" stroke="#e0c58f"/><text x="625" y="216">unzip</text>
  </g>

  <!-- 5 window -->
  <rect x="730" y="70" width="130" height="160" rx="12" fill="#ffffff" stroke="#1c2230" stroke-width="2"/>
  <rect x="730" y="70" width="130" height="24" rx="12" fill="#1c2230"/>
  <rect x="730" y="82" width="130" height="12" fill="#1c2230"/>
  <text x="795" y="87" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">APK Inspector</text>
  <g fill="#e4e0d6">
    <rect x="740" y="104" width="34" height="8" rx="2"/><rect x="740" y="118" width="34" height="8" rx="2"/><rect x="740" y="132" width="34" height="8" rx="2"/>
    <rect x="740" y="146" width="34" height="8" rx="2"/><rect x="740" y="160" width="34" height="8" rx="2"/>
    <rect x="782" y="104" width="68" height="8" rx="2"/><rect x="782" y="118" width="56" height="8" rx="2"/><rect x="782" y="132" width="64" height="8" rx="2"/>
  </g>
  <rect x="740" y="104" width="34" height="8" rx="2" fill="#2f62c8"/>
  <text x="795" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2230">10 tabs of</text>
  <text x="795" y="216" font-size="12" font-weight="600" text-anchor="middle" fill="#1c2230">results</text>

  <!-- arrows -->
  <line x1="152" y1="150" x2="186" y2="150" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="342" y1="150" x2="376" y2="150" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="522" y1="150" x2="556" y2="150" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>
  <line x1="692" y1="150" x2="726" y2="150" stroke="#4a5263" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="85" cy="70" r="13" fill="#1c2230"/><text x="85" y="75">1</text>
    <circle cx="265" cy="70" r="13" fill="#1c2230"/><text x="265" y="75">2</text>
    <circle cx="450" cy="70" r="13" fill="#1c2230"/><text x="450" y="75">3</text>
    <circle cx="625" cy="22" r="13" fill="#1c2230"/><text x="625" y="27">4</text>
    <circle cx="795" cy="50" r="13" fill="#1c2230"/><text x="795" y="55">5</text>
  </g>
</svg>
