<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Attacks on LLMs and the defenses</title>
  <desc id="d">White-box attacks use the weights and data, for example gradient-based suffixes such as GCG, logit-based search and harmful fine-tuning. Black-box attacks only send queries, with templates, rewriting and another LLM that writes jailbreaks. Prompt-level defenses detect odd prompts, perturb prompts and use safer system prompts. Model-level defenses use safety fine-tuning, gradient analysis and a guard model that checks the output.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="260" height="150" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.6"/>
<path d="M32 20 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#c2552d"/>
<text x="34" y="41.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">White-box attacks</text>
<text x="34" y="76" font-size="11.5" fill="#4a5263" text-anchor="start">knows the weights and data</text>
<text x="34" y="93.825" font-size="11.5" fill="#4a5263" text-anchor="start">• gradient-based suffix (GCG)</text>
<text x="34" y="111.65" font-size="11.5" fill="#4a5263" text-anchor="start">• logit-based search</text>
<text x="34" y="129.475" font-size="11.5" fill="#4a5263" text-anchor="start">• harmful fine-tuning</text>
<rect x="20" y="186" width="260" height="150" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<path d="M32 186 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#b7791f"/>
<text x="34" y="207.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">Black-box attacks</text>
<text x="34" y="242" font-size="11.5" fill="#4a5263" text-anchor="start">only sends queries</text>
<text x="34" y="259.825" font-size="11.5" fill="#4a5263" text-anchor="start">• templates, role-play, fake turns</text>
<text x="34" y="277.65" font-size="11.5" fill="#4a5263" text-anchor="start">• rewriting in other languages</text>
<text x="34" y="295.475" font-size="11.5" fill="#4a5263" text-anchor="start">• another LLM writes jailbreaks</text>
<rect x="330" y="60" width="220" height="236" rx="16" fill="#f2efe8"/>
<rect x="350" y="80" width="180" height="196" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="2"/>
<text x="440" y="104" font-size="11.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">Prompt-level shield</text>
<rect x="372" y="118" width="136" height="136" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="2"/>
<text x="440" y="140" font-size="11.5" fill="#58378f" text-anchor="middle" font-weight="700">Model-level</text>
<circle cx="440" cy="196" r="36" fill="#1c2230"/>
<text x="440" y="201" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">LLM</text>
<path d="M280 95 H344" fill="none" stroke="#c2552d" stroke-width="1.8" marker-end="url(#m7)"/>
<path d="M280 260 H344" fill="none" stroke="#b7791f" stroke-width="1.8" marker-end="url(#m6)"/>
<rect x="600" y="20" width="260" height="150" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<path d="M612 20 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#2f62c8"/>
<text x="614" y="41.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">Prompt-level defenses</text>
<text x="614" y="76" font-size="11.5" fill="#4a5263" text-anchor="start">• detect odd prompts (perplexity)</text>
<text x="614" y="93.825" font-size="11.5" fill="#4a5263" text-anchor="start">• perturb the prompt slightly</text>
<text x="614" y="111.65" font-size="11.5" fill="#4a5263" text-anchor="start">• safer system prompts</text>
<rect x="600" y="186" width="260" height="150" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<path d="M612 186 h236 a12 12 0 0 1 12 12 v22 h-260 v-22 a12 12 0 0 1 12 -12z" fill="#7a4fc2"/>
<text x="614" y="207.86" font-size="13.5" fill="#fff" text-anchor="start" font-weight="700">Model-level defenses</text>
<text x="614" y="242" font-size="11.5" fill="#4a5263" text-anchor="start">• safety fine-tuning</text>
<text x="614" y="259.825" font-size="11.5" fill="#4a5263" text-anchor="start">• gradient analysis of</text>
<text x="614" y="277.65" font-size="11.5" fill="#4a5263" text-anchor="start">  safety-critical parameters</text>
<text x="614" y="295.475" font-size="11.5" fill="#4a5263" text-anchor="start">• a guard SLM checks the output</text>
<path d="M594 95 H536" fill="none" stroke="#2f62c8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m3)"/>
<path d="M594 260 H514" fill="none" stroke="#7a4fc2" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m5)"/>
</svg>
