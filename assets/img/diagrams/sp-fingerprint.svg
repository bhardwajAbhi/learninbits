<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the build fingerprint is put together</title>
  <desc id="d">The build fingerprint is built from other properties when the build does not set it. For an emulator it reads google slash sdk_gphone64_x86_64 slash emu64x colon 17 slash the build id slash the incremental number colon userdebug slash dev-keys. The brand, name and device come from ro.product properties. The release, build id and incremental number come from ro.build.version and ro.build.id. The type and tags come from ro.build.type and ro.build.tags.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="30" y="48" width="65.2" height="32" rx="7" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="62.6" y="69" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">google</text>
<text x="62.6" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">brand</text>
<text x="101.2" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/</text>
<rect x="111.2" y="48" width="171.8" height="32" rx="7" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="197.1" y="69" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">sdk_gphone64_x86_64</text>
<text x="197.1" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">name</text>
<text x="289" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/</text>
<rect x="299" y="48" width="65.2" height="32" rx="7" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="331.6" y="69" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">emu64x</text>
<text x="331.6" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">device</text>
<text x="370.2" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">:</text>
<rect x="380.2" y="48" width="64" height="32" rx="7" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="412.2" y="69" font-size="11.4" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">17</text>
<text x="412.2" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">release</text>
<text x="450.2" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/</text>
<rect x="460.2" y="48" width="81.6" height="32" rx="7" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="501" y="69" font-size="11.4" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">BUILD_ID</text>
<text x="501" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">build id</text>
<text x="547.8" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/</text>
<rect x="557.8" y="48" width="73.4" height="32" rx="7" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="594.5" y="69" font-size="11.4" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">1234567</text>
<text x="594.5" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">incremental</text>
<text x="637.2" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">:</text>
<rect x="647.2" y="48" width="89.8" height="32" rx="7" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="692.1" y="69" font-size="11.4" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">userdebug</text>
<text x="692.1" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">type</text>
<text x="743" y="70" font-size="15" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/</text>
<rect x="753" y="48" width="81.6" height="32" rx="7" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="793.8" y="69" font-size="11.4" fill="#0b6650" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">dev-keys</text>
<text x="793.8" y="100" font-size="10.4" fill="#4a5263" text-anchor="middle">tags</text>
<text x="30" y="30" font-size="12.4" fill="#1c2230" text-anchor="start" font-weight="700">ro.build.fingerprint, built from other properties when the build does not set it</text>
<rect x="30" y="124" width="820" height="44" rx="10" fill="#f2efe8"/>
<text x="440" y="151" font-size="11.2" fill="#1c2230" text-anchor="middle">Blue comes from ro.product.*, purple from ro.build.version.* and ro.build.id, green from ro.build.type and ro.build.tags.</text>
</svg>
