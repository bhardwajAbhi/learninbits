<text x="368" y="182" font-size="15.5" fill="#0b6650" text-anchor="start" font-weight="700">Conferences</text>
<text x="368" y="206" font-size="12.5" fill="#1c2230" text-anchor="start">Months, talks,</text>
<text x="368" y="225" font-size="12.5" fill="#1c2230" text-anchor="start">feedback, networking</text>
