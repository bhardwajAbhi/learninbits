<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two halves of a GKI device and the interface between them</title>
  <desc id="d">On the left, built by Google, the GKI core kernel ships in boot.img and about 100 GKI modules ship in system_dlkm.img. On the right, built by the vendor, vendor modules with SoC and board drivers ship in vendor or vendor_boot, and optional extra modules ship in vendor_dlkm.img. In the middle, the KMI consists of the symbol list abi_symbollist, the ABI description abi.stg and a CRC for each symbol from CONFIG_MODVERSIONS. The KMI freezes for a branch, so both sides can update without each other.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="160" y="34" font-size="13.5" fill="#0b6650" text-anchor="middle" font-weight="700">Built by Google</text>
<rect x="20" y="50" width="280" height="90" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="36" y="76" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">GKI core kernel</text>
<text x="36" y="96" font-size="11.4" fill="#4a5263" text-anchor="start">Image.lz4</text>
<rect x="36" y="106" width="59.6" height="24" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="65.8" y="121.96" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="700">boot.img</text>
<rect x="20" y="160" width="280" height="90" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="36" y="186" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">GKI modules</text>
<text x="36" y="206" font-size="11.4" fill="#4a5263" text-anchor="start">about 100 .ko files</text>
<rect x="36" y="216" width="111.4" height="24" rx="12" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="91.7" y="231.96" font-size="11" fill="#0b6650" text-anchor="middle" font-weight="700">system_dlkm.img</text>
<text x="720" y="34" font-size="13.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">Built by the vendor</text>
<rect x="580" y="50" width="280" height="90" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="596" y="76" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Vendor modules</text>
<text x="596" y="96" font-size="11.4" fill="#4a5263" text-anchor="start">SoC and board drivers</text>
<rect x="596" y="106" width="185.4" height="24" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="688.7" y="121.96" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="700">vendor or vendor_boot.img</text>
<rect x="580" y="160" width="280" height="90" rx="12" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="596" y="186" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Vendor DLKM</text>
<text x="596" y="206" font-size="11.4" fill="#4a5263" text-anchor="start">optional extra modules</text>
<rect x="596" y="216" width="111.4" height="24" rx="12" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.2"/>
<text x="651.7" y="231.96" font-size="11" fill="#1f4a9e" text-anchor="middle" font-weight="700">vendor_dlkm.img</text>
<rect x="330" y="50" width="220" height="200" rx="14" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.6"/>
<text x="440" y="78" font-size="18" fill="#8a5a12" text-anchor="middle" font-weight="800">KMI</text>
<text x="440" y="104" font-size="11.6" fill="#1c2230" text-anchor="middle" font-weight="700">Symbol list</text>
<text x="440" y="126" font-size="11" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace">abi_symbollist</text>
<text x="440" y="148" font-size="11.6" fill="#1c2230" text-anchor="middle" font-weight="700">ABI description</text>
<text x="440" y="170" font-size="11" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace">abi.stg</text>
<text x="440" y="192" font-size="11.6" fill="#1c2230" text-anchor="middle" font-weight="700">CRC for each symbol</text>
<text x="440" y="214" font-size="11" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace">CONFIG_MODVERSIONS</text>
<path d="M300 95 L 326 95" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="313" y="88" font-size="10" fill="#0b6650" text-anchor="middle" font-weight="600">exports</text>
<path d="M576 95 L 554 95" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<path d="M576 205 L 554 205" fill="none" stroke="#2f62c8" stroke-width="1.6" marker-end="url(#m3)"/>
<path d="M300 205 L 326 205" fill="none" stroke="#0f8a6a" stroke-width="1.6" marker-end="url(#m4)"/>
<text x="440" y="282" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic">The KMI freezes for a branch. Both sides can then update without each other.</text>
</svg>
