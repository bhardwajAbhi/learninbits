<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Location privacy with rounding and with a crowd rule</title>
  <desc id="d">On the left, rounding the coordinates of a person who lives alone in a large area still points to her. On the right, a crowd rule shows a point only when at least ten cases are within one kilometer.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="410" height="260" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.6"/>
<text x="40" y="48" font-size="14" fill="#963f1f" text-anchor="start" font-weight="700">Rounding the coordinates</text>
<rect x="450" y="20" width="410" height="260" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
<text x="470" y="48" font-size="14" fill="#0b6650" text-anchor="start" font-weight="700">A crowd rule</text>
<circle cx="225" cy="160" r="70" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<circle cx="225" cy="160" r="7" fill="#c2552d"/>
<text x="225" y="250" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="600">Only one person within 100 km.</text>
<text x="225" y="266" font-size="12" fill="#4a5263" text-anchor="middle">Any rounding still points to her.</text>
<text x="305" y="108" font-size="10.5" fill="#963f1f" text-anchor="start" font-weight="600">rounded area</text>
<circle cx="655" cy="155" r="72" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<circle cx="655.524" cy="160.961" r="5" fill="#0f8a6a"/>
<circle cx="647.862" cy="160.462" r="5" fill="#0f8a6a"/>
<circle cx="676.288" cy="164.453" r="5" fill="#0f8a6a"/>
<circle cx="695.389" cy="132.106" r="5" fill="#0f8a6a"/>
<circle cx="656.223" cy="142.186" r="5" fill="#0f8a6a"/>
<circle cx="639.376" cy="151.336" r="5" fill="#0f8a6a"/>
<circle cx="657.876" cy="160.446" r="5" fill="#0f8a6a"/>
<circle cx="666.934" cy="207.453" r="5" fill="#0f8a6a"/>
<circle cx="677.254" cy="113.846" r="5" fill="#0f8a6a"/>
<circle cx="658.495" cy="144.339" r="5" fill="#0f8a6a"/>
<circle cx="641.647" cy="188.824" r="5" fill="#0f8a6a"/>
<circle cx="649.366" cy="105.752" r="5" fill="#0f8a6a"/>
<circle cx="658.667" cy="151.558" r="5" fill="#0f8a6a"/>
<circle cx="624.342" cy="130.961" r="5" fill="#0f8a6a"/>
<text x="655" y="250" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="600">Show a point only when at least 10</text>
