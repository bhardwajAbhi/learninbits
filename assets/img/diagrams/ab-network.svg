<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP and HTTPS on a public hotspot</title>
  <desc id="d">Top, an app uses HTTP through a public hotspot. The hotspot reads the password and can add an ad or a script before the data reaches the server. Bottom, the app uses HTTPS. A TLS tunnel runs from the app to the server, and the hotspot sees only encrypted bytes and the server name. Below, a network security config sets cleartextTrafficPermitted to false, which is the default for apps that target Android 9 or later.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="840" height="130" rx="16" fill="#fbecec" fill-opacity="0.55"/>
<rect x="20" y="30" width="840" height="130" rx="16" fill="none" stroke="#c2552d" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="36" y="17" width="210.4" height="26" rx="13" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="141.2" y="34.5" font-size="12.5" fill="#963f1f" text-anchor="middle" font-weight="700">HTTP on a public hotspot</text>
<rect x="40" y="60" width="140" height="70" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.4"/>
<text x="110" y="90" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Your app</text>
<text x="110" y="110" font-size="11.2" fill="#1c2230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="600">http://</text>
<rect x="330" y="60" width="200" height="70" rx="10" fill="#fff" stroke="#c2552d" stroke-width="1.5"/>
<text x="430" y="88" font-size="12.6" fill="#963f1f" text-anchor="middle" font-weight="700">Hotspot</text>
<text x="430" y="106" font-size="10.8" fill="#4a5263" text-anchor="middle">Reads the password and</text>
<text x="430" y="122" font-size="10.8" fill="#4a5263" text-anchor="middle">can add an ad or a script</text>
<rect x="680" y="60" width="160" height="70" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.4"/>
<text x="760" y="100" font-size="12.6" fill="#3f4a59" text-anchor="middle" font-weight="700">Server</text>
