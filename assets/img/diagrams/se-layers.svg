<rect x="251.04" y="168" width="97.92" height="30" rx="15" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="300" y="188" font-size="12" fill="#58378f" text-anchor="middle" font-weight="600">seccomp-BPF</text>
<rect x="358.96" y="168" width="91.2" height="30" rx="15" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="404.56" y="188" font-size="12" fill="#58378f" text-anchor="middle" font-weight="600">Namespaces</text>
<rect x="460.16" y="168" width="84.48" height="30" rx="15" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="502.4" y="188" font-size="12" fill="#58378f" text-anchor="middle" font-weight="600">dm-verity</text>
<rect x="554.64" y="168" width="165.12" height="30" rx="15" fill="#fff" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="637.2" y="188" font-size="12" fill="#58378f" text-anchor="middle" font-weight="600">File-based encryption</text>
<rect x="20" y="222" width="840" height="54" rx="12" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="40" y="255" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">Boot</text>
<rect x="170" y="234" width="165.12" height="30" rx="15" fill="#fff" stroke="#b7791f" stroke-width="1.2"/>
<text x="252.56" y="254" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="600">Android Verified Boot</text>
<rect x="345.12" y="234" width="151.68" height="30" rx="15" fill="#fff" stroke="#b7791f" stroke-width="1.2"/>
<text x="420.96" y="254" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="600">Rollback protection</text>
<rect x="20" y="288" width="840" height="54" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.4"/>
<text x="40" y="321" font-size="14" fill="#963f1f" text-anchor="start" font-weight="700">Hardware</text>
<rect x="170" y="300" width="144.96" height="30" rx="15" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="242.48" y="320" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="600">Boot ROM and fuses</text>
<rect x="324.96" y="300" width="124.8" height="30" rx="15" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="387.36" y="320" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="600">TEE (TrustZone)</text>
<rect x="459.76" y="300" width="84.48" height="30" rx="15" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
<text x="502" y="320" font-size="12" fill="#963f1f" text-anchor="middle" font-weight="600">StrongBox</text>
<text x="440" y="366" font-size="12" fill="#4a5263" text-anchor="middle" font-style="italic" font-weight="500">Each layer works on its own. An attacker has to defeat all of them, not just one.</text>
</svg>
