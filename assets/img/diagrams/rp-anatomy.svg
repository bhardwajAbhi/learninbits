<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The anatomy of a research paper</title>
  <desc id="d">A paper page with six blocks. Front matter has the title, authors, affiliations, abstract and keywords. Context and motivation has the introduction, literature review and problem statement. Methodology has the approach, architecture and assumptions. Experiments and data has the setup, data and metrics. Results and discussion has the results, analysis and discussion. Conclusion and references has limitations, future work, the conclusion and references.</desc>
