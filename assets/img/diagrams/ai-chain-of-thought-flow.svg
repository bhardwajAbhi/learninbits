<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A direct answer compared with a chain of thought</title>
  <desc id="d">Left, a direct answer jumps from the phishing problem to a single number such as about 60 accounts, and you cannot see the error. This wrong number is invented for the comparison. Right, a chain of thought writes five steps: the given values, the order of the calculation, the formula and result 2,000 times 0.20 equals 400, each next step 400 times 0.15 equals 60 and then 12, and the final answer 12 times 0.25 equals 3 accounts. Each step is visible, so you can check it.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<text x="220" y="34" font-size="14.5" fill="#963f1f" text-anchor="middle" font-weight="700">Direct answer</text>
<rect x="40" y="50" width="360" height="70" rx="12" fill="#fff" stroke="#5d6b7e" stroke-width="1.7"/>
<text x="56" y="77" font-size="14" fill="#3f4a59" text-anchor="start" font-weight="700">Problem</text>
<text x="56" y="100" font-size="12" fill="#4a5263" text-anchor="start">2,000 emails, 80% blocked, 15% click ...</text>
<path d="M220 120 L 220 150" fill="none" stroke="#c2552d" stroke-width="1.6" marker-end="url(#m7)"/>
<rect x="40" y="154" width="360" height="64" rx="12" fill="#fff" stroke="#c2552d" stroke-width="1.7"/>
<text x="56" y="181" font-size="14" fill="#963f1f" text-anchor="start" font-weight="700">“About 60 accounts”</text>
<text x="56" y="204" font-size="12" fill="#4a5263" text-anchor="start">One jump. You cannot see the error.</text>
<text x="650" y="34" font-size="14.5" fill="#0b6650" text-anchor="middle" font-weight="700">Chain of thought</text>
<rect x="470" y="50" width="360" height="54" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.3"/>
<circle cx="496" cy="77" r="12" fill="#2f62c8"/>
<text x="496" y="81.32" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="518" y="72" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Given values</text>
<text x="518" y="91" font-size="12.2" fill="#1c2230" text-anchor="start">2,000, 80%, 15%, 20%, 75%</text>
<path d="M650 104 L 650 114" fill="none" stroke="#2f62c8" stroke-width="1.4" marker-end="url(#m3)"/>
<rect x="470" y="116" width="360" height="54" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.3"/>
<circle cx="496" cy="143" r="12" fill="#2f62c8"/>
<text x="496" y="147.32" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="518" y="138" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Order</text>
<text x="518" y="157" font-size="12.2" fill="#1c2230" text-anchor="start">delivered, clicked, typed, after MFA</text>
<path d="M650 170 L 650 180" fill="none" stroke="#2f62c8" stroke-width="1.4" marker-end="url(#m3)"/>
<rect x="470" y="182" width="360" height="54" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.3"/>
<circle cx="496" cy="209" r="12" fill="#2f62c8"/>
<text x="496" y="213.32" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="518" y="204" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Formula and result</text>
<text x="518" y="223" font-size="12.2" fill="#1c2230" text-anchor="start">2,000 x 0.20 = 400</text>
<path d="M650 236 L 650 246" fill="none" stroke="#2f62c8" stroke-width="1.4" marker-end="url(#m3)"/>
<rect x="470" y="248" width="360" height="54" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.3"/>
<circle cx="496" cy="275" r="12" fill="#2f62c8"/>
<text x="496" y="279.32" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="518" y="270" font-size="13" fill="#1f4a9e" text-anchor="start" font-weight="700">Each next step</text>
<text x="518" y="289" font-size="12.2" fill="#1c2230" text-anchor="start">400 x 0.15 = 60, then 12</text>
<path d="M650 302 L 650 312" fill="none" stroke="#2f62c8" stroke-width="1.4" marker-end="url(#m3)"/>
<rect x="470" y="314" width="360" height="54" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<circle cx="496" cy="341" r="12" fill="#0f8a6a"/>
<text x="496" y="345.32" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="518" y="336" font-size="13" fill="#0b6650" text-anchor="start" font-weight="700">Final answer</text>
<text x="518" y="355" font-size="12.2" fill="#1c2230" text-anchor="start">12 x 0.25 = 3 accounts</text>
<text x="220" y="270" font-size="11.8" fill="#4a5263" text-anchor="middle" font-style="italic">The wrong number is invented for this comparison.</text>
<text x="650" y="386" font-size="12.3" fill="#4a5263" text-anchor="middle" font-style="italic">Each step is visible, so you can check it.</text>
</svg>
