<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the program of chapter 4 flows</title>
  <desc id="d">Setup, llm = ChatOllama(model=&quot;mistral&quot;), Connects to the mistral model in Ollama. Page, st.title and st.text_input, A heading and a text box with the label Enter your query. Call, if query llm.invoke(query), Runs only when the text box has text. Output, st.write(response.content), The answer shows below the text box.</desc>
