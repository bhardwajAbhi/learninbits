<rect x="504" y="40" width="134" height="40" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.5"/>
<text x="571" y="66" font-size="15" fill="#8a5a12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">ab15097451</text>
<text x="645" y="66" font-size="16" fill="#4a5263" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">-</text>
<line x1="571" y1="80" x2="571" y2="98" stroke="#b7791f" stroke-width="1.4"/>
