<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Synthetic data from real data</title>
  <desc id="d">Real rows go into a generator that learns patterns and statistics, not people. Differential privacy stops it from memorizing rare rows. The synthetic rows keep the averages and the link between age and salary, but no row is a real person. Uses include AI model building, fraud detection, application testing, patient data safety and research. Check quality with distributions, PCA and correlations.</desc>
