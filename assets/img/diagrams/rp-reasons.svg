<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six reasons to write a research paper</title>
  <desc id="d">Six benefits lead to impact. Credibility, structured thinking, recognition, career growth, communication skills and a contribution to society.</desc>
