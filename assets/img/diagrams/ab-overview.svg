<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six layers of defense for an Android app</title>
  <desc id="d">Rings around the app show five layers. Ring 1 is the code and its secrets, ring 2 is data on the device, ring 3 is the app boundaries, ring 4 is the device and the user and ring 5 is the network and the backend. A list on the right names each layer with its topics. Code and secrets covers R8, API keys and libraries. Data covers storage, encryption and logs. Boundaries cover components, permissions, WebView and input. Device and user covers integrity checks and personal data. Network and backend covers HTTPS, Firebase, messages and transfers. A sixth item is a release checklist.</desc>
