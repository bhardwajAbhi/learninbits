<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 246" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Binder for control and a fast message queue for data</title>
  <desc id="d">SensorService in the framework reads events, and the Sensors HAL in the vendor partition writes them. Binder carries the control calls once, such as initialize with the queue descriptors and activate. A Fast Message Queue, a ring buffer in shared memory, sits between them. The HAL writes samples into it and the framework reads them. Hundreds of samples each second travel through the queue, not through Binder.</desc>
