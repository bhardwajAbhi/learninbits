<text x="240" y="216" font-size="13" fill="#1c2230" text-anchor="start" font-weight="700">The “data doctor” view</text>
<text x="240" y="236" font-size="11.5" fill="#4a5263" text-anchor="start">Data carries germs that you cannot see with the naked eye.</text>
<rect x="240" y="248" width="118" height="24" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="299" y="264.14" font-size="11.5" fill="#963f1f" text-anchor="middle" font-weight="600">linkages</text>
