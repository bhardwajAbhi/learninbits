<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens inside one call of invoke()</title>
  <desc id="d">A sequence with four lanes, namely your code, the model object, the model service and the model. One, your code calls invoke with the question. Two, the model object makes a human message and adds the settings. Three, it sends an HTTPS request with the API key. Four, the service gives the prompt as tokens to the model. Five, the model writes the next token until it stops or reaches the limit. Six, the tokens and the finish reason go back to the service. Seven, the service replies with text, usage and metadata. Eight, your code gets an AIMessage.</desc>
