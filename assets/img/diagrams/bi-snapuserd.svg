<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The five steps to load the SELinux policy during a Virtual A/B update</title>
  <desc id="d">Three lanes for init, the device mapper and snapuserd. Step one, init reads the policy while snapuserd runs. Step two, the device mapper tables are rewritten to new dm-user devices. Step three, the old snapuserd stops because it has no devices left. Step four, init loads the policy and runs restorecon only in /dev. Step five, snapuserd starts again and attaches to the new devices. The goal is to load the policy while no read from /system waits on a daemon that the new policy can stop.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="44" width="130" height="52" rx="10" fill="#b7791f"/>
<text x="85" y="75" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">init</text>
<line x1="150" y1="70" x2="860" y2="70" stroke="#d9d4c7" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="20" y="134" width="130" height="52" rx="10" fill="#2f62c8"/>
<text x="85" y="165" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Device mapper</text>
<line x1="150" y1="160" x2="860" y2="160" stroke="#d9d4c7" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="20" y="224" width="130" height="52" rx="10" fill="#7a4fc2"/>
<text x="85" y="255" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">snapuserd</text>
<line x1="150" y1="250" x2="860" y2="250" stroke="#d9d4c7" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="170" y="46" width="140" height="48" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<circle cx="170" cy="46" r="11" fill="#b7791f"/>
<text x="170" y="50.14" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="240" y="67" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="700">Read the policy</text>
<text x="240" y="83" font-size="10.6" fill="#4a5263" text-anchor="middle">while snapuserd runs</text>
<rect x="290" y="136" width="140" height="48" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<circle cx="290" cy="136" r="11" fill="#2f62c8"/>
<text x="290" y="140.14" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="360" y="157" font-size="11.4" fill="#1f4a9e" text-anchor="middle" font-weight="700">Rewrite the tables</text>
<text x="360" y="173" font-size="10.6" fill="#4a5263" text-anchor="middle">new dm-user devices</text>
<path d="M310 70 C 328 70, 272 160, 288 160" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="410" y="226" width="140" height="48" rx="10" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<circle cx="410" cy="226" r="11" fill="#7a4fc2"/>
<text x="410" y="230.14" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="480" y="247" font-size="11.4" fill="#58378f" text-anchor="middle" font-weight="700">Stop the old daemon</text>
<text x="480" y="263" font-size="10.6" fill="#4a5263" text-anchor="middle">no devices left</text>
<path d="M430 160 C 448 160, 392 250, 408 250" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="530" y="46" width="140" height="48" rx="10" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<circle cx="530" cy="46" r="11" fill="#b7791f"/>
<text x="530" y="50.14" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<text x="600" y="67" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="700">Load the policy</text>
<text x="600" y="83" font-size="10.6" fill="#4a5263" text-anchor="middle">restorecon in /dev only</text>
<path d="M550 250 C 568 250, 512 70, 528 70" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="670" y="226" width="140" height="48" rx="10" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<circle cx="670" cy="226" r="11" fill="#7a4fc2"/>
<text x="670" y="230.14" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<text x="740" y="247" font-size="11.4" fill="#58378f" text-anchor="middle" font-weight="700">Start it again</text>
<text x="740" y="263" font-size="10.6" fill="#4a5263" text-anchor="middle">attach to new devices</text>
<path d="M670 70 C 688 70, 652 250, 668 250" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<rect x="20" y="300" width="840" height="44" rx="10" fill="#f2efe8"/>
<text x="440" y="327" font-size="12" fill="#1c2230" text-anchor="middle" font-weight="500">The goal is to load the policy while no read from /system waits on a daemon that the new policy can stop.</text>
</svg>
