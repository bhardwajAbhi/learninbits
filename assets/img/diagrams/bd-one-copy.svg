<text x="660" y="82" font-size="10.6" fill="#c2552d" text-anchor="middle" font-weight="700">copy</text>
<rect x="693" y="90" width="104" height="60" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.3"/>
<text x="745" y="116" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">Receiver</text>
<text x="745" y="133" font-size="11.6" fill="#0b6650" text-anchor="middle" font-weight="700">region</text>
<text x="660" y="190" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">One copy into memory that the receiver has mapped</text>
<text x="660" y="214" font-size="11" fill="#4a5263" text-anchor="middle">The region is read-only for the receiver,</text>
<text x="660" y="232" font-size="11" fill="#4a5263" text-anchor="middle">so only the kernel can write into it.</text>
</svg>
