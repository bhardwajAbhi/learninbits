<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens inside one call of a chain</title>
  <desc id="d">A sequence with four lanes, namely your code, the prompt template, the model object and the model service. One, your code calls chain.invoke with a dictionary. Two, the template fills the placeholder and makes the prompt. Three, the prompt value goes to the model object. Four, the model object sends an HTTPS request with the key. Five, the service replies with the Hindi text. Six, your code gets an AIMessage.</desc>
