<rect x="20" y="272" width="470" height="44" rx="10" fill="#fff" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="38" y="299" font-size="12.2" fill="#1c2230" text-anchor="start" font-weight="600">An answer that your code must read</text>
