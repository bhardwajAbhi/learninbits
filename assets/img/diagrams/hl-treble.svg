<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two sides of a Treble device</title>
  <desc id="d">Left, the system side with /system, /system_ext and /product, holding the framework and system apps. It has a framework manifest, which says what the system offers, and a framework compatibility matrix, which says what the system needs. Right, the vendor side with /vendor and /odm, holding HAL services and firmware. It has a device manifest, which says what the vendor offers, and a device compatibility matrix, which says what the vendor needs. Arrows cross between them. Each side checks the offer of the other side against its own needs, at build time, at update time and at boot.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="20" width="400" height="250" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="220" y="46" font-size="13.5" fill="#1f4a9e" text-anchor="middle" font-weight="700">System side</text>
<rect x="460" y="20" width="400" height="250" rx="14" fill="#fff" stroke="#b0457a" stroke-width="1.6"/>
<text x="660" y="46" font-size="13.5" fill="#7d2a55" text-anchor="middle" font-weight="700">Vendor side</text>
<rect x="44" y="64" width="352" height="50" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="220" y="86" font-size="12" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/system, /system_ext, /product</text>
<text x="220" y="104" font-size="11" fill="#4a5263" text-anchor="middle">framework, system apps</text>
<rect x="44" y="128" width="352" height="50" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="220" y="150" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Framework manifest</text>
<text x="220" y="168" font-size="11" fill="#4a5263" text-anchor="middle">what the system offers</text>
<rect x="44" y="192" width="352" height="50" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="220" y="214" font-size="12" fill="#1f4a9e" text-anchor="middle" font-weight="700">Framework compatibility matrix</text>
<text x="220" y="232" font-size="11" fill="#4a5263" text-anchor="middle">what the system needs</text>
<rect x="484" y="64" width="352" height="50" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="660" y="86" font-size="12" fill="#7d2a55" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">/vendor, /odm</text>
<text x="660" y="104" font-size="11" fill="#4a5263" text-anchor="middle">HAL services, firmware</text>
<rect x="484" y="128" width="352" height="50" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="660" y="150" font-size="12" fill="#7d2a55" text-anchor="middle" font-weight="700">Device manifest</text>
<text x="660" y="168" font-size="11" fill="#4a5263" text-anchor="middle">what the vendor offers</text>
<rect x="484" y="192" width="352" height="50" rx="10" fill="#f8eaf1" stroke="#b0457a" stroke-width="1.4"/>
<text x="660" y="214" font-size="12" fill="#7d2a55" text-anchor="middle" font-weight="700">Device compatibility matrix</text>
<text x="660" y="232" font-size="11" fill="#4a5263" text-anchor="middle">what the vendor needs</text>
<path d="M398 153 L 482 217" fill="none" stroke="#7a4fc2" stroke-width="1.5" marker-end="url(#m5)" marker-start="url(#m5)"/>
<path d="M398 217 L 482 153" fill="none" stroke="#7a4fc2" stroke-width="1.5" marker-end="url(#m5)" marker-start="url(#m5)"/>
<text x="440" y="290" font-size="11.4" fill="#1c2230" text-anchor="middle" font-weight="600">Each side checks the offer of the other side against its own needs, at build time, at update time and at boot.</text>
</svg>
