<rect x="20" y="34" width="400" height="250" rx="16" fill="#fbecec" fill-opacity="0.55"/>
<rect x="20" y="34" width="400" height="250" rx="16" fill="none" stroke="#c2552d" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="36" y="21" width="164.8" height="26" rx="13" fill="#fff" stroke="#c2552d" stroke-width="1.2"/>
