<text x="662" y="116" font-size="11.5" fill="#1c2230" text-anchor="middle" font-weight="700">Mapping to law,</text>
<text x="662" y="134" font-size="10.5" fill="#4a5263" text-anchor="middle">LINDDUN and NIST</text>
