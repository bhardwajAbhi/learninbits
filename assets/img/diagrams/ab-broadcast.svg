<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A system broadcast compared with an in-app stream</title>
  <desc id="d">On the left, your app calls sendBroadcast with a user token, and any app with a matching receiver can get it. On the right, inside one app, a repository passes data to a screen through StateFlow, SharedFlow or LiveData. The data never leaves the process, and no other app can listen.</desc>
