<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the boot partitions combine into the start of Linux</title>
  <desc id="d">Three partitions on the left. boot holds the generic kernel and, up to Android 12, the generic ramdisk. vendor_boot holds the vendor ramdisk, vendor kernel modules and the device tree blob. init_boot holds the generic ramdisk with first-stage init. The bootloader loads, verifies and joins them. The result is the Linux kernel, a combined ramdisk with a generic layer and a vendor layer, the device tree blob and the kernel command line with bootconfig. Then /init runs as process 1. A timeline shows header version 2 up to Android 10, version 3 in Android 11 with vendor_boot and version 4 in Android 13 with init_boot.</desc>
