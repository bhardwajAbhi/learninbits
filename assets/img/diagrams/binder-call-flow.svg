<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One Binder call, step by step</title>
  <desc id="d">The app thread calls the proxy. The proxy packs a Parcel and gives it to the Binder driver. The driver adds the caller ID, copies the data into the service process and wakes a service thread. The stub unpacks the data, does a permission check and runs the method. The reply goes back the same way and the app thread continues.</desc>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f7d55"/></marker>
  </defs>

  <!-- headers -->
  <rect x="30" y="16" width="200" height="56" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="2"/>
  <text x="130" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#0b5e48">App thread</text>
  <text x="130" y="58" font-size="11.5" text-anchor="middle" fill="#4a5263">uses the Proxy</text>

  <rect x="280" y="16" width="200" height="56" rx="10" fill="#fbe8e0" stroke="#c2552d" stroke-width="2"/>
  <text x="380" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#8e3618">Binder driver</text>
  <text x="380" y="58" font-size="11.5" text-anchor="middle" fill="#4a5263">in the kernel</text>

  <rect x="530" y="16" width="200" height="56" rx="10" fill="#e5ecfb" stroke="#2f62c8" stroke-width="2"/>
  <text x="630" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1f448f">Service thread</text>
  <text x="630" y="58" font-size="11.5" text-anchor="middle" fill="#4a5263">uses the Stub</text>

  <!-- lifelines -->
  <line x1="130" y1="72" x2="130" y2="540" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="380" y1="72" x2="380" y2="540" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="630" y1="72" x2="630" y2="540" stroke="#9aa0ab" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- app waits bar -->
  <rect x="122" y="152" width="16" height="320" rx="3" fill="#e4e0d6"/>
  <text x="112" y="320" font-size="11.5" text-anchor="end" fill="#7b8292">The app</text>
  <text x="112" y="335" font-size="11.5" text-anchor="end" fill="#7b8292">thread waits</text>

  <!-- step 1 -->
  <circle cx="30" cy="104" r="12" fill="#1c2230"/><text x="30" y="109" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <rect x="50" y="88" width="160" height="34" rx="6" fill="#ffffff" stroke="#0f8a6a"/>
  <text x="130" y="110" font-size="12" text-anchor="middle" fill="#1c2230">setPrimaryClip(text)</text>

  <!-- step 2 -->
  <line x1="138" y1="160" x2="372" y2="160" stroke="#1c2230" stroke-width="2" marker-end="url(#b1)"/>
  <circle cx="160" cy="160" r="0"/>
  <text x="255" y="146" font-size="12.5" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">2</tspan> Proxy packs a Parcel, calls ioctl()</text>

  <!-- step 3 -->
  <rect x="290" y="186" width="180" height="62" rx="6" fill="#fff6f2" stroke="#c2552d"/>
  <text x="380" y="206" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">3</tspan> Adds caller UID and PID</text>
  <text x="380" y="223" font-size="12" text-anchor="middle" fill="#1c2230">Copies data one time into</text>
  <text x="380" y="239" font-size="12" text-anchor="middle" fill="#1c2230">the memory of the service</text>

  <!-- step 4 -->
  <line x1="388" y1="278" x2="622" y2="278" stroke="#1c2230" stroke-width="2" marker-end="url(#b1)"/>
  <text x="505" y="264" font-size="12.5" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">4</tspan> Wakes a free thread</text>

  <!-- step 5 -->
  <rect x="540" y="296" width="180" height="78" rx="6" fill="#f3f6fd" stroke="#2f62c8"/>
  <text x="630" y="316" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">5</tspan> Stub unpacks the Parcel</text>
  <text x="630" y="333" font-size="12" text-anchor="middle" fill="#1c2230">Checks the caller permission</text>
  <text x="630" y="350" font-size="12" text-anchor="middle" fill="#1c2230">Runs the real method</text>
  <text x="630" y="366" font-size="12" text-anchor="middle" fill="#1c2230">Packs the reply</text>

  <!-- step 6 -->
  <line x1="622" y1="404" x2="388" y2="404" stroke="#2f7d55" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b2)"/>
  <text x="505" y="392" font-size="12.5" text-anchor="middle" fill="#1f5c3d"><tspan font-weight="700">6</tspan> Reply Parcel</text>

  <!-- step 7 -->
  <line x1="372" y1="462" x2="138" y2="462" stroke="#2f7d55" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b2)"/>
  <text x="255" y="450" font-size="12.5" text-anchor="middle" fill="#1f5c3d"><tspan font-weight="700">7</tspan> Driver wakes the app thread</text>

  <!-- step 8 -->
  <rect x="50" y="490" width="160" height="34" rx="6" fill="#ffffff" stroke="#0f8a6a"/>
  <text x="130" y="512" font-size="12" text-anchor="middle" fill="#1c2230"><tspan font-weight="700">8</tspan> The call returns</text>
</svg>
