<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the review analysis of Example 2 flows</title>
  <desc id="d">Schema, class ProductReview(BaseModel), sentiment (POSITIVE, NEGATIVE, NEUTRAL), confidence between 0.0 and 1.0, key_points, 2 or 3 strings, suggested_action. Parser, parser = JsonOutputParser(pydantic_object=ProductReview), get_format_instructions() for each call. Data, for review in reviews, 3 phone reviews, cleaned with &quot; &quot;.join(review.split()). Template, review_analysis_prompt, {format_instructions} and Review {review}. Model, llm = ChatOpenRouter(model=&quot;qwen/qwen-2.5-7b-instruct&quot;, temperature=0), Writes one JSON object for each review. Parser, JsonOutputParser, Turns the JSON text into a dict. Output, result[&#x27;sentiment&#x27;], result[&#x27;confidence&#x27;], ..., POSITIVE 0.85, NEGATIVE 0.98, NEUTRAL 0.8. A loop goes back from stage 7 to stage 3, next review.</desc>
