<rect x="20" y="100" width="160" height="56" rx="10" fill="#fff" stroke="#2f62c8" stroke-width="1.3"/>
<text x="100" y="124" font-size="12.4" fill="#1f4a9e" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">board.dts</text>
<text x="100" y="144" font-size="10.8" fill="#4a5263" text-anchor="middle">includes the .dtsi</text>
<rect x="20" y="170" width="160" height="56" rx="10" fill="#fff" stroke="#7a4fc2" stroke-width="1.3"/>
<text x="100" y="194" font-size="12.4" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">panel.dts</text>
<text x="100" y="214" font-size="10.8" fill="#4a5263" text-anchor="middle">an overlay source</text>
