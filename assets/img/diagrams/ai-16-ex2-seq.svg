<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one run of Example 2</title>
  <desc id="d">A sequence diagram with the lanes main(), three chains, OpenRouter API. Step 1, main() to three chains, draft_chain.invoke(...), the question. Step 2, three chains to OpenRouter API, call 1. Step 3, OpenRouter API to main(), draft, printed under DRAFT. Step 4, main() to three chains, critique_chain.invoke(...), the question and the draft. Step 5, three chains to OpenRouter API, call 2. Step 6, OpenRouter API to main(), critique, four criteria and the improvements. Step 7, main() to three chains, revise_chain.invoke(...), the question, the draft and the critique. Step 8, three chains to OpenRouter API, call 3. Step 9, OpenRouter API to main(), revised answer, printed under REVISED ANSWER. Steps 1 to 9 repeat, Repeated for each of the 3 questions.</desc>
