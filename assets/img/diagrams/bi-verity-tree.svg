<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 378" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The dm-verity hash tree and the managed error mode</title>
  <desc id="d">On the left, a hash tree. The root hash sits at the top, then two level-1 hashes, four level-2 hashes and eight data blocks. A read of block B5 hashes the block and walks up through its parents to the root. The root hash comes from the signed vbmeta. On the right, the mode MANAGED_RESTART_AND_EIO, the usual mode on production devices. In restart mode, corruption causes a reboot. After a reboot for hashtree corruption, the device enters EIO mode, where apps get I/O errors and the device does not reboot again. A new OS version returns the device to restart mode. The state lives in avb.managed_verity_mode. Other modes are RESTART, EIO, LOGGING and PANIC.</desc>
