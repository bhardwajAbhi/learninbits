<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 986" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inside one run of Example 1</title>
  <desc id="d">A sequence diagram with the lanes Your code, chain_of_verification, four chains, Gemini API. Step 1, Your code to chain_of_verification, chain_of_verification(question, ...). Step 2, chain_of_verification to four chains, generate_chain.invoke(...), write the first answer. Step 3, four chains to Gemini API, call 1. Step 4, Gemini API to chain_of_verification, first answer, a long text with many facts. Step 5, chain_of_verification to four chains, extract_chain.invoke(...), list the facts. Step 6, four chains to Gemini API, call 2. Step 7, Gemini API to chain_of_verification, 18 facts, one per line, split into the list claims. Step 8, chain_of_verification to four chains, verify_chain.invoke({&quot;claim&quot; claim}), one fact, nothing else. Step 9, four chains to Gemini API, one call for each fact. Step 10, Gemini API to chain_of_verification, check result, VERIFIED, INCORRECT or UNCERTAIN. Step 11, chain_of_verification to chain_of_verification, &quot;INCORRECT&quot; in verification_text, found, so fix the answer. Step 12, chain_of_verification to four chains, revise_chain.invoke(...), first answer plus all check results. Step 13, four chains to Gemini API, last call. Step 14, Gemini API to chain_of_verification, final answer, 21 calls in total. Step 15, chain_of_verification to Your code, result, initial, claims, verifications and final. Steps 8 to 10 repeat, Repeated for each of the 18 facts.</desc>
