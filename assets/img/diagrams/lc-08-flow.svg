<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 465" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How the chat page of chapter 8 flows</title>
  <desc id="d">Template, ChatPromptTemplate.from_messages([...]), A system message, a MessagesPlaceholder and the human input. History, chat_with_history = RunnableWithMessageHistory(chain, ...), Reads and saves the messages in StreamlitChatMessageHistory. Page, for message in st.session_state[&quot;langchain_messages&quot;], Shows the earlier messages as chat bubbles after every rerun. Call, chat_with_history.stream({&quot;input&quot; question}, config=...), Runs when the user sends a message in st.chat_input. Stream, st.write_stream(response), The answer appears piece by piece.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="34" width="92" height="26" rx="13" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.2"/>
<text x="66" y="51.32" font-size="12" fill="#58378f" text-anchor="middle" font-weight="700">Template</text>
<rect x="126" y="24" width="680" height="65" rx="12" fill="#fff" stroke="#7a4fc2" stroke-width="1.6"/>
<rect x="126" y="24" width="6" height="65" rx="3" fill="#7a4fc2"/>
<text x="146" y="52" font-size="13.6" fill="#58378f" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">ChatPromptTemplate.from_messages([...])</text>
<text x="146" y="74" font-size="12.2" fill="#4a5263" text-anchor="start">A system message, a MessagesPlaceholder and the human input</text>
<path d="M466 91 L 466 109" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="123" width="92" height="26" rx="13" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="66" y="140.32" font-size="12" fill="#8a5a12" text-anchor="middle" font-weight="700">History</text>
<rect x="126" y="113" width="680" height="65" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<rect x="126" y="113" width="6" height="65" rx="3" fill="#b7791f"/>
<text x="146" y="141" font-size="13.6" fill="#8a5a12" text-anchor="start" font-weight="700">chat_with_history = RunnableWithMessageHistory(chain, ...)</text>
<text x="146" y="163" font-size="12.2" fill="#4a5263" text-anchor="start">Reads and saves the messages in StreamlitChatMessageHistory</text>
<path d="M466 180 L 466 198" fill="none" stroke="#1c2230" stroke-width="1.6" marker-end="url(#m0)"/>
<rect x="20" y="212" width="92" height="26" rx="13" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="66" y="229.32" font-size="12" fill="#0b6650" text-anchor="middle" font-weight="700">Page</text>
<rect x="126" y="202" width="680" height="65" rx="12" fill="#fff" stroke="#0f8a6a" stroke-width="1.6"/>
