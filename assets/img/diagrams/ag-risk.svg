<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Where an attack can enter the agent loop, and the guards</title>
  <desc id="d">In the middle is the agent loop, with think, act, observe and remember. Four risks point into it. No stop means a loop that keeps running and spending. Hidden instructions come in a web page or a tool reply that the agent observes. Too much access means that an action can do real harm. False memories come from a planted entry that misleads the agent later. Below are the guards, namely human approval for risky steps, the fewest permissions, a sandbox, a step limit and a log of every action.</desc>
