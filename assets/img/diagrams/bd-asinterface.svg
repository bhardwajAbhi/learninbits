<rect x="20" y="90" width="200" height="70" rx="10" fill="#f3f0fa" stroke="#7a4fc2" stroke-width="1.4"/>
<text x="120" y="129.176" font-size="11.6" fill="#58378f" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700">IFoo.Stub.asInterface(b)</text>
<rect x="270" y="30" width="50" height="190" rx="12" fill="none"/>
<path d="M222 125 C 260 125, 260 62, 300 62" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<path d="M222 125 C 260 125, 260 188, 300 188" fill="none" stroke="#1c2230" stroke-width="1.4" marker-end="url(#m0)"/>
<rect x="304" y="30" width="556" height="64" rx="10" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.4"/>
<text x="582" y="59" font-size="12.6" fill="#0b6650" text-anchor="middle" font-weight="700">Same process: queryLocalInterface() finds the object</text>
<text x="582" y="77" font-size="11" fill="#4a5263" text-anchor="middle">The caller gets the real Java object. Calls are normal method calls, with no Parcel and no driver.</text>
<rect x="304" y="156" width="556" height="64" rx="10" fill="#eef3fb" stroke="#2f62c8" stroke-width="1.4"/>
<text x="582" y="185" font-size="12.6" fill="#1f4a9e" text-anchor="middle" font-weight="700">Other process: b is a BinderProxy</text>
<text x="582" y="203" font-size="11" fill="#4a5263" text-anchor="middle">The caller gets a new IFoo.Stub.Proxy. Each call writes a Parcel and goes through the driver.</text>
