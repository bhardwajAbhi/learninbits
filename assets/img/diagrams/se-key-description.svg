<text x="36" y="47" font-size="13.5" fill="#fff" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">KeyDescription</text>
<text x="36" y="84" font-size="12" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">attestationVersion</text>
<text x="304" y="84" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">500</text>
<text x="36" y="120" font-size="12" fill="#ffd479" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">attestationSecurityLevel</text>
<text x="304" y="120" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">TEE</text>
<text x="36" y="156" font-size="12" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">keyMintVersion</text>
<text x="304" y="156" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">500</text>
<text x="36" y="192" font-size="12" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">keyMintSecurityLevel</text>
<text x="304" y="192" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">TEE</text>
<text x="36" y="228" font-size="12" fill="#ffd479" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">attestationChallenge</text>
<text x="304" y="228" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">your nonce</text>
<text x="36" y="264" font-size="12" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">uniqueId</text>
<text x="304" y="264" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">usually empty</text>
<text x="36" y="300" font-size="12" fill="#e8ecf3" text-anchor="start" font-family="JetBrains Mono, monospace">softwareEnforced</text>
<text x="304" y="300" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">list</text>
<text x="36" y="336" font-size="12" fill="#ffd479" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">hardwareEnforced</text>
<text x="304" y="336" font-size="11" fill="#9aa6b8" text-anchor="end" font-family="JetBrains Mono, monospace">list</text>
<path d="M320 336 C 360 336, 360 70, 396 70" fill="none" stroke="#b7791f" stroke-width="1.6" marker-end="url(#m6)"/>
<rect x="400" y="24" width="460" height="352" rx="12" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<text x="416" y="50" font-size="13.5" fill="#8a5a12" text-anchor="start" font-weight="700">AuthorizationList, selected tags</text>
<text x="416" y="78" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[1] purpose</text>
<text x="844" y="78" font-size="10.8" fill="#4a5263" text-anchor="end">SIGN, ATTEST_KEY ...</text>
<text x="416" y="103" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[2] algorithm  [3] keySize</text>
<text x="844" y="103" font-size="10.8" fill="#4a5263" text-anchor="end">EC, RSA, ML_DSA</text>
<text x="416" y="128" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[503] noAuthRequired</text>
<text x="844" y="128" font-size="10.8" fill="#4a5263" text-anchor="end">or [504] userAuthType</text>
<text x="416" y="153" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[702] origin</text>
<text x="844" y="153" font-size="10.8" fill="#4a5263" text-anchor="end">GENERATED or IMPORTED</text>
<text x="416" y="178" font-size="11.2" fill="#8a5a12" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">[704] rootOfTrust</text>
<text x="844" y="178" font-size="10.8" fill="#4a5263" text-anchor="end">boot key, lock, state, hash</text>
<text x="416" y="203" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[705] osVersion</text>
<text x="844" y="203" font-size="10.8" fill="#4a5263" text-anchor="end">170000</text>
<text x="416" y="228" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[706] osPatchLevel</text>
<text x="844" y="228" font-size="10.8" fill="#4a5263" text-anchor="end">202610</text>
<text x="416" y="253" font-size="11.2" fill="#8a5a12" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="700">[709] attestationApplicationId</text>
<text x="844" y="253" font-size="10.8" fill="#4a5263" text-anchor="end">package and signer</text>
<text x="416" y="278" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[710..717] attestationId*</text>
<text x="844" y="278" font-size="10.8" fill="#4a5263" text-anchor="end">only with ID attestation</text>
<text x="416" y="303" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[718] vendorPatchLevel</text>
<text x="844" y="303" font-size="10.8" fill="#4a5263" text-anchor="end">20261005</text>
<text x="416" y="328" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[719] bootPatchLevel</text>
<text x="844" y="328" font-size="10.8" fill="#4a5263" text-anchor="end">20261005</text>
<text x="416" y="353" font-size="11.2" fill="#1c2230" text-anchor="start" font-family="JetBrains Mono, monospace" font-weight="600">[724] moduleHash</text>
<text x="844" y="353" font-size="10.8" fill="#4a5263" text-anchor="end">version 400 and later</text>
<text x="440" y="398" font-size="11.4" fill="#4a5263" text-anchor="middle" font-style="italic">Trust the hardwareEnforced list. The softwareEnforced list is only as good as the Android build.</text>
</svg>
