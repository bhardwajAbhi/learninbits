<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The layers of Binder</title>
  <desc id="d">Five layers from top to bottom. Java and Kotlin, with android.os.Binder, android.os.BinderProxy, Parcel and the AIDL Stub and Proxy. The JNI bridge, android_util_Binder.cpp and android_os_Parcel.cpp. The native libraries, libbinder for C++, libbinder_ndk with a stable C API and libbinder_rs for Rust. Process and thread state, ProcessState once per process and IPCThreadState once per thread. The kernel driver with /dev/binder, /dev/vndbinder and /dev/hwbinder, explained in chapter 5.</desc>
