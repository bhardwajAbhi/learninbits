<rect x="20" y="123" width="92" height="26" rx="13" fill="#e6f3f4" stroke="#0e7c86" stroke-width="1.2"/>
<text x="66" y="140.32" font-size="12" fill="#095a61" text-anchor="middle" font-weight="700">Add</text>
