<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What the DPDP Act and the GDPR cover and exclude</title>
  <desc id="d">The DPDP Act covers digital personal data in India, paper data that is later digitized and data processed abroad for goods or services offered in India. The GDPR covers data processed by automated means, paper records in a filing system, organizations in the EU and offers to or monitoring of people in the EU. The DPDP Act excludes personal or domestic use and data that the person made public or that someone published under a legal duty. The GDPR excludes purely personal or household use and has no general exclusion for public data.</desc>
  <defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1c2230"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5263"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7b8292"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f62c8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0f8a6a"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7a4fc2"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b7791f"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c2552d"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d6b7e"/></marker></defs>
<rect x="20" y="30" width="400" height="180" rx="14" fill="#fff" stroke="#b7791f" stroke-width="1.6"/>
<text x="36" y="58" font-size="14" fill="#8a5a12" text-anchor="start" font-weight="700">DPDP Act covers</text>
<circle cx="42" cy="84" r="3.5" fill="#b7791f"/>
<text x="52" y="88" font-size="12" fill="#1c2230" text-anchor="start">Digital personal data in India</text>
<circle cx="42" cy="112" r="3.5" fill="#b7791f"/>
<text x="52" y="116" font-size="12" fill="#1c2230" text-anchor="start">Paper data that is later digitized</text>
<circle cx="42" cy="140" r="3.5" fill="#b7791f"/>
<text x="52" y="144" font-size="12" fill="#1c2230" text-anchor="start">Data processed abroad for goods</text>
<text x="52" y="172" font-size="12" fill="#1c2230" text-anchor="start">or services offered in India</text>
<rect x="460" y="30" width="400" height="180" rx="14" fill="#fff" stroke="#2f62c8" stroke-width="1.6"/>
<text x="476" y="58" font-size="14" fill="#1f4a9e" text-anchor="start" font-weight="700">GDPR covers</text>
<circle cx="482" cy="84" r="3.5" fill="#2f62c8"/>
<text x="492" y="88" font-size="12" fill="#1c2230" text-anchor="start">Data processed by automated means</text>
<circle cx="482" cy="112" r="3.5" fill="#2f62c8"/>
<text x="492" y="116" font-size="12" fill="#1c2230" text-anchor="start">Paper records in a filing system</text>
<circle cx="482" cy="140" r="3.5" fill="#2f62c8"/>
<text x="492" y="144" font-size="12" fill="#1c2230" text-anchor="start">Organizations in the EU</text>
<circle cx="482" cy="168" r="3.5" fill="#2f62c8"/>
<text x="492" y="172" font-size="12" fill="#1c2230" text-anchor="start">Offers to or monitoring of people in the EU</text>
<rect x="20" y="228" width="400" height="112" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="36" y="254" font-size="13" fill="#963f1f" text-anchor="start" font-weight="700">DPDP Act excludes</text>
<text x="36" y="280" font-size="11.6" fill="#1c2230" text-anchor="start">Personal or domestic use</text>
<text x="36" y="300" font-size="11.6" fill="#1c2230" text-anchor="start">Data made public by the person</text>
<text x="36" y="320" font-size="11.6" fill="#1c2230" text-anchor="start">or under a legal duty</text>
<rect x="460" y="228" width="400" height="112" rx="12" fill="#fbecec" stroke="#c2552d" stroke-width="1.2"/>
<text x="476" y="254" font-size="13" fill="#963f1f" text-anchor="start" font-weight="700">GDPR excludes</text>
<text x="476" y="280" font-size="11.6" fill="#1c2230" text-anchor="start">Purely personal or household use</text>
<text x="476" y="300" font-size="11.6" fill="#1c2230" text-anchor="start">No general exclusion for</text>
<text x="476" y="320" font-size="11.6" fill="#1c2230" text-anchor="start">data that is public</text>
</svg>
