<text x="432" y="465" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="600">Mount /data</text>
<rect x="534" y="444" width="236" height="32" rx="8" fill="#fdf4e3" stroke="#b7791f" stroke-width="1.2"/>
<text x="652" y="465" font-size="11.4" fill="#8a5a12" text-anchor="middle" font-weight="600">apexd activates APEX</text>
