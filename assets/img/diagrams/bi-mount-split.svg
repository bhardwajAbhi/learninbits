<rect x="334" y="490" width="236" height="32" rx="8" fill="#e3f4ee" stroke="#0f8a6a" stroke-width="1.2"/>
<text x="452" y="511" font-size="11.4" fill="#0b6650" text-anchor="middle" font-weight="600">apexd activates APEX</text>
<rect x="574" y="490" width="196" height="32" rx="8" fill="#eef0f3" stroke="#5d6b7e" stroke-width="1.2"/>
<text x="672" y="511" font-size="11.4" fill="#3f4a59" text-anchor="middle" font-weight="600">Mount /data</text>
<text x="440" y="554" font-size="11.6" fill="#4a5263" text-anchor="middle" font-style="italic">Not used on DSU or GSI boots, where the partition layout differs.</text>
