<text x="146" y="497" font-size="13.6" fill="#0b6650" text-anchor="start" font-weight="700">st.write(response.content)</text>
<text x="146" y="519" font-size="12.2" fill="#4a5263" text-anchor="start">The Privacy Assessment Report</text>
