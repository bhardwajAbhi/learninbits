<path d="M412 211 C 440 211, 440 75, 468 75" fill="none" stroke="#1c2230" stroke-width="1.3" marker-end="url(#m0)"/>
<text x="20" y="270" font-size="11.2" fill="#4a5263" text-anchor="start" font-weight="700">Interface side, shared by</text>
<text x="20" y="288" font-size="11.2" fill="#4a5263" text-anchor="start" font-weight="700">framework and vendor</text>
